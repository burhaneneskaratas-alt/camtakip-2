// Kullanıcının kendi kaydettiği standart ölçüsü (profiles.delik_varsayilanlari) —
// yoksa boş nesne döner, çağıran taraf fabrika varsayılanına (a.def) düşer.
function dsOzelVarsayilan(key, panelKey){
  const v = (profile && profile.delik_varsayilanlari) ? profile.delik_varsayilanlari[key] : null;
  if(!v) return {};
  if(panelKey) return (v.paneller && v.paneller[panelKey] && v.paneller[panelKey].olculer) || {};
  return v.olculer || {};
}
function openDsDetail(key){
  dsCtx.sablon = key;
  const tpl = DELIK_SABLON_TANIMLARI[key];
  document.getElementById('ds_gallery').style.display = 'none';
  document.getElementById('ds_detail').style.display = 'block';
  document.getElementById('ds_detailTitle').textContent = tpl.ad;
  const wrap = document.getElementById('ds_canvasWrap');
  wrap.style.aspectRatio = `${tpl.viewBox.w} / ${tpl.viewBox.h}`;
  wrap.innerHTML = dsRenderSVG(tpl);
  const mevcutLine = lineState[dsCtx.lineIdx];
  const mevcutSablon = (mevcutLine && mevcutLine.delikSablon && mevcutLine.delikSablon.sablon===key) ? mevcutLine.delikSablon : null;
  dsTemplatePanels(tpl).forEach(p=>{
    const prefix = p.key ? p.key+'_' : '';
    const existing = tpl.multiPanel
      ? ((mevcutSablon && mevcutSablon.paneller && mevcutSablon.paneller[p.key]) ? mevcutSablon.paneller[p.key].olculer : {})
      : (mevcutSablon ? mevcutSablon.olculer : {});
    const ozelVarsayilan = dsOzelVarsayilan(key, p.key);
    p.arrows.forEach(a=>{
      if(a.decorative) return; // sadece nota işaret eden ok — ölçü girişi yok
      const lbl = dsAutoLabel(a);
      const inp = document.createElement('input');
      inp.type = 'number'; inp.step = '1'; inp.placeholder = 'mm';
      inp.id = 'ds_inp_'+prefix+a.id;
      // Sıra: (1) bu satıra daha önce kaydedilmiş değer, (2) kullanıcının kendi
      // standart ölçüsü olarak kaydettiği değer, (3) fabrika (VBA'dan gelen) varsayılanı.
      inp.value = (existing[a.id]!=null) ? existing[a.id]
                : (ozelVarsayilan[a.id]!=null) ? ozelVarsayilan[a.id]
                : (a.def!=null ? a.def : '');
      inp.style.cssText = `position:absolute; width:56px; padding:3px 4px; font-size:14px; font-weight:600; text-align:center; border:1.5px solid var(--accent); border-radius:3px; background:#fff; left:${(lbl.x-tpl.viewBox.x)/tpl.viewBox.w*100}%; top:${(lbl.y-tpl.viewBox.y)/tpl.viewBox.h*100}%; transform:translate(-50%,-50%);`;
      wrap.appendChild(inp);
    });
    // "BURAYA CAM ÖLÇÜSÜ" (kural 5.1): giriş kutusu yok, satırın kendi Boy (h)
    // alanından salt-okunur gösteriliyor.
    if(p.camOlcuArrow){
      const lbl = dsAutoLabel({type:'single', x1:p.camOlcuArrow.x1, y1:p.camOlcuArrow.y1, x2:p.camOlcuArrow.x2, y2:p.camOlcuArrow.y2});
      const disp = document.createElement('div');
      const hVal = (mevcutLine && mevcutLine.h) ? mevcutLine.h+' mm' : '(Boy girilmedi)';
      disp.textContent = hVal;
      disp.style.cssText = `position:absolute; font-size:13px; font-weight:700; color:var(--text-dim); background:var(--surface-2); border:1px dashed var(--border); border-radius:3px; padding:3px 6px; left:${(lbl.x-tpl.viewBox.x)/tpl.viewBox.w*100}%; top:${(lbl.y-tpl.viewBox.y)/tpl.viewBox.h*100}%; transform:translate(-50%,-50%); white-space:nowrap;`;
      wrap.appendChild(disp);
    }
  });
}

// Panelin ekrandaki inputlarından girilen mm değerlerini okur ({ok_id: sayı|null}).
function dsReadPanelOlculer(p, prefix){
  const olculer = {};
  p.arrows.forEach(a=>{
    if(a.decorative) return;
    const v = document.getElementById('ds_inp_'+prefix+a.id).value;
    olculer[a.id] = (v!=='' && v!=null) ? parseFloat(v) : null;
  });
  return olculer;
}
// Ekrandaki inputlardan, hem satıra kaydetmek hem de "standart ölçüm" olarak
// profile kaydetmek için aynı şekilde kullanılacak veri yapısını üretir.
function dsReadCurrentOlculerData(tpl){
  if(tpl.multiPanel){
    const paneller = {};
    dsTemplatePanels(tpl).forEach(p=>{ paneller[p.key] = {olculer: dsReadPanelOlculer(p, p.key+'_')}; });
    return {paneller};
  }
  return {olculer: dsReadPanelOlculer(tpl, '')};
}
document.getElementById('ds_save').onclick = ()=>{
  if(!dsCtx || !dsCtx.sablon) return;
  const tpl = DELIK_SABLON_TANIMLARI[dsCtx.sablon];
  const data = dsReadCurrentOlculerData(tpl);
  lineState[dsCtx.lineIdx].delikSablon = tpl.multiPanel
    ? {sablon: dsCtx.sablon, paneller: data.paneller}
    : {sablon: dsCtx.sablon, olculer: data.olculer};
  document.getElementById('ds_overlay').style.display = 'none';
  dsCtx = null;
  renderLines();
};
document.getElementById('ds_saveDefault').onclick = async ()=>{
  if(!dsCtx || !dsCtx.sablon) return;
  const tpl = DELIK_SABLON_TANIMLARI[dsCtx.sablon];
  const data = dsReadCurrentOlculerData(tpl);
  const btn = document.getElementById('ds_saveDefault');
  const eskiMetin = btn.textContent;
  btn.textContent = 'Kaydediliyor…'; btn.disabled = true;
  const yeniVarsayilanlar = Object.assign({}, profile.delik_varsayilanlari||{});
  yeniVarsayilanlar[dsCtx.sablon] = data;
  const {error} = await sb.from('profiles').update({delik_varsayilanlari: yeniVarsayilanlar}).eq('id', profile.id);
  btn.disabled = false;
  if(error){ alert('Standart ölçüm kaydedilemedi: ' + error.message); btn.textContent = eskiMetin; return; }
  profile.delik_varsayilanlari = yeniVarsayilanlar;
  btn.textContent = '✓ Kaydedildi';
  setTimeout(()=>{ btn.textContent = eskiMetin; }, 1500);
};

// ====================================================================
// EXCEL EXPORT ENJEKSİYONU — ExcelJS 4.4.0 shape (dikdörtgen/oval/ok) çizmiyor,
// bu yüzden workbook üretildikten sonra .xlsx (zip) açılıp içine gerçek
// xdr:sp / xdr:cxnSp XML'i elle eklenip yeniden paketleniyor.
// Koordinat birimi: nokta. EMU = nokta × 12700 (VBA.xlsx'ten doğrulandı).
// ====================================================================
const EMU_PER_PT = 12700;
const DS_DEFAULT_ROW_PT = 15; // proje genelinde varsayılan satır yüksekliği (bkz. EXCEL_ROWS_PER_A4_PAGE yorumu) — sayfada özel satır yüksekliği yok
const DS_EXCEL_SCALE = 0.85; // delik şeması Excel'de çok az küçültülsün diye (07 Ağustos 2026) — tüm ölçüler orantılı küçülür
function dsEmu(pt){ return Math.round(pt*DS_EXCEL_SCALE*EMU_PER_PT); }
function dsXmlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// 0-indeksli satırın sayfa üzerindeki mutlak Y'si (EMU) — absoluteAnchor için.
function dsRowTopEmu(row){ return Math.round(row * DS_DEFAULT_ROW_PT * EMU_PER_PT); }

// Dikdörtgen/oval (dolgulu, çerçeveli) — VBA CizCam/CizDelik karşılığı.
// xEmu/yEmu: sayfanın mutlak sol-üstüne göre gerçek EMU konumu (a:off'un GERÇEK
// değeri olmalı — VBA.xlsx'ten çıkarılan gerçek örnekte a:off hep gerçek konumu
// taşıyordu, "0,0" değil; bunu atlayınca şekiller yanlış yerde toplanıyordu).
function dsOoxmlShape(id, name, xEmu, yEmu, cx, cy, prst, fillHex, lineHex, lineWEmu){
  return `<xdr:absoluteAnchor><xdr:pos x="${xEmu}" y="${yEmu}"/><xdr:ext cx="${cx}" cy="${cy}"/><xdr:sp macro="" textlink=""><xdr:nvSpPr><xdr:cNvPr id="${id}" name="${dsXmlEsc(name)}"/><xdr:cNvSpPr/></xdr:nvSpPr><xdr:spPr><a:xfrm><a:off x="${xEmu}" y="${yEmu}"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="${prst}"><a:avLst/></a:prstGeom><a:solidFill><a:srgbClr val="${fillHex}"/></a:solidFill><a:ln w="${lineWEmu}"><a:solidFill><a:srgbClr val="${lineHex}"/></a:solidFill></a:ln></xdr:spPr><xdr:txBody><a:bodyPr/><a:lstStyle/><a:p><a:endParaRPr lang="tr-TR"/></a:p></xdr:txBody></xdr:sp><xdr:clientData/></xdr:absoluteAnchor>`;
}
// Ok/çift ok (bağlayıcı çizgi) — VBA CizOk/CizCiftYonuOk karşılığı.
function dsOoxmlConnector(id, name, x1Emu, y1Emu, x2Emu, y2Emu, doubleHeaded){
  const xEmu=Math.min(x1Emu,x2Emu), yEmu=Math.min(y1Emu,y2Emu), cx=Math.abs(x2Emu-x1Emu), cy=Math.abs(y2Emu-y1Emu);
  const flipH = x1Emu>x2Emu, flipV = y1Emu>y2Emu;
  const flipAttr = (flipH?' flipH="1"':'') + (flipV?' flipV="1"':'');
  const lineEnds = doubleHeaded ? `<a:headEnd type="triangle"/><a:tailEnd type="triangle"/>` : `<a:tailEnd type="triangle" w="med" len="med"/>`;
  return `<xdr:absoluteAnchor><xdr:pos x="${xEmu}" y="${yEmu}"/><xdr:ext cx="${cx}" cy="${cy}"/><xdr:cxnSp macro=""><xdr:nvCxnSpPr><xdr:cNvPr id="${id}" name="${dsXmlEsc(name)}"/><xdr:cNvCxnSpPr/></xdr:nvCxnSpPr><xdr:spPr><a:xfrm${flipAttr}><a:off x="${xEmu}" y="${yEmu}"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="line"><a:avLst/></a:prstGeom><a:ln w="12700"><a:solidFill><a:srgbClr val="000000"/></a:solidFill>${lineEnds}</a:ln></xdr:spPr></xdr:cxnSp><xdr:clientData/></xdr:absoluteAnchor>`;
}
// Metin kutusu (çerçevesiz/dolgusuz) — VBA CizMetinKutusu karşılığı. Ok etiketleri de bunu kullanır.
function dsOoxmlTextbox(id, name, xEmu, yEmu, cx, cy, text, opts){
  opts = opts||{};
  const align = opts.align||'l', bold = opts.bold?'1':'0', sz = opts.sz||900;
  const paras = String(text).split('\n').map(line=>
    `<a:p><a:pPr algn="${align}"/><a:r><a:rPr lang="tr-TR" sz="${sz}" b="${bold}"><a:solidFill><a:srgbClr val="000000"/></a:solidFill><a:latin typeface="Segoe UI"/></a:rPr><a:t>${dsXmlEsc(line)}</a:t></a:r></a:p>`
  ).join('');
  return `<xdr:absoluteAnchor><xdr:pos x="${xEmu}" y="${yEmu}"/><xdr:ext cx="${cx}" cy="${cy}"/><xdr:sp macro="" textlink=""><xdr:nvSpPr><xdr:cNvPr id="${id}" name="${dsXmlEsc(name)}"/><xdr:cNvSpPr txBox="1"/></xdr:nvSpPr><xdr:spPr><a:xfrm><a:off x="${xEmu}" y="${yEmu}"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/><a:ln><a:noFill/></a:ln></xdr:spPr><xdr:txBody><a:bodyPr wrap="none" vertOverflow="clip" horzOverflow="clip" anchor="t"/><a:lstStyle/>${paras}</xdr:txBody></xdr:sp><xdr:clientData/></xdr:absoluteAnchor>`;
}

// Bir (şablon + girilen ölçüler) çiftinin, verilen satıra (0-indeksli) ankraj olacak
// tüm şekillerinin XML'ini üretir. Şeklin geometrisi tpl'den birebir gelir, DEĞİŞMEZ —
// olculer sadece etiket metni olarak eklenir. row'un mutlak Y'si (EMU) burada bir kere
// hesaplanıp tüm alt şekillere eklenir (absoluteAnchor => col/row sınırı yok, X de dahil
// sayfanın mutlak sol-üstüne göre).
function dsBuildAnchorXML(tpl, delikSablonData, row, idStart, lineH){
  let id = idStart, out = '';
  const baseY = dsRowTopEmu(row);
  const X = pt => dsEmu(pt);
  const Y = pt => baseY + dsEmu(pt);
  dsTemplatePanels(tpl).forEach(p=>{
    const olculer = tpl.multiPanel
      ? (((delikSablonData.paneller||{})[p.key]||{}).olculer || {})
      : (delikSablonData.olculer || {});
    out += dsOoxmlShape(id++, 'Cam', X(p.glass.x), Y(p.glass.y), dsEmu(p.glass.w), dsEmu(p.glass.h), 'rect', 'F5F7FA', '000000', 19050);
    p.holes.forEach((h,i)=>{ out += dsOoxmlShape(id++, 'Delik '+(i+1), X(h.x), Y(h.y), dsEmu(h.w), dsEmu(h.h), 'ellipse', 'FFFFFF', '000000', 12700); });
    p.arrows.forEach(a=>{
      // decorative=true ok her zaman çizilir (VBA'daki gibi geometri sabit), ama
      // ölçü girişi olmadığı için olculer[a.id] hiç set edilmez → etiket kutusu eklenmez.
      if(a.type==='single'){
        out += dsOoxmlConnector(id++, 'Ok', X(a.x1), Y(a.y1), X(a.x2), Y(a.y2), false);
      } else {
        out += dsOoxmlConnector(id++, 'Cift Ok', X(a.x), Y(a.y1), X(a.x), Y(a.y2), true);
      }
      const v = olculer[a.id];
      if(v!=null && v!==''){
        const lbl = dsAutoLabel(a);
        out += dsOoxmlTextbox(id++, 'Olcu '+a.id, X(lbl.x-27), Y(lbl.y-8), dsEmu(54), dsEmu(18), v+' mm', {sz:1200, bold:true, align:'ctr'});
      }
    });
    // "BURAYA CAM ÖLÇÜSÜ" — kural 5.1: kullanıcı girişi değil, satırın kendi Boy (h) alanı.
    if(p.camOlcuArrow){
      const a = p.camOlcuArrow;
      out += dsOoxmlConnector(id++, 'Ok', X(a.x1), Y(a.y1), X(a.x2), Y(a.y2), false);
      if(lineH){
        const lbl = dsAutoLabel({type:'single', x1:a.x1, y1:a.y1, x2:a.x2, y2:a.y2});
        out += dsOoxmlTextbox(id++, 'Cam Olcusu', X(lbl.x-35), Y(lbl.y-8), dsEmu(80), dsEmu(18), lineH+' mm', {sz:1200, bold:true, align:'ctr'});
      }
    }
    if(p.note) out += dsOoxmlTextbox(id++, 'Not', X(p.noteX), Y(p.noteY), dsEmu(220), dsEmu(34), p.note, {sz:900});
  });
  return {xml: out, nextId: id};
}

// wb.xlsx.writeBuffer() ile üretilmiş ham buffer'ı JSZip ile açıp, sayfanın
// drawing XML'ine delikSablon şekillerini ekleyip yeniden paketler.
async function injectDelikSablonShapes(buf, anchors){
  if(!anchors || !anchors.length) return buf;
  const zip = await JSZip.loadAsync(buf);
  const relsFile = zip.file('xl/worksheets/_rels/sheet1.xml.rels');
  if(!relsFile){ console.warn('[delikSablon] sheet1.xml.rels bulunamadı, şekiller eklenemedi.'); return buf; }
  const relsXml = await relsFile.async('string');
  const relMatch = relsXml.match(/<Relationship[^>]*Type="[^"]*\/drawing"[^>]*Target="([^"]+)"[^>]*\/>/)
                 || relsXml.match(/<Relationship[^>]*Target="([^"]+)"[^>]*Type="[^"]*\/drawing"[^>]*\/>/);
  if(!relMatch){ console.warn('[delikSablon] drawing ilişkisi bulunamadı, şekiller eklenemedi.'); return buf; }
  const drawingPath = 'xl/drawings/' + relMatch[1].split('/').pop();
  const drawingFile = zip.file(drawingPath);
  if(!drawingFile){ console.warn('[delikSablon] drawing dosyası bulunamadı: '+drawingPath); return buf; }
  let drawingXml = await drawingFile.async('string');

  let maxId = 0;
  (drawingXml.match(/id="(\d+)"/g)||[]).forEach(s=>{ const n=parseInt(s.match(/\d+/)[0]); if(n>maxId) maxId=n; });
  let nextId = maxId + 1;

  let injectXml = '';
  anchors.forEach(a=>{
    const tpl = DELIK_SABLON_TANIMLARI[a.delikSablon && a.delikSablon.sablon];
    if(!tpl) return;
    const built = dsBuildAnchorXML(tpl, a.delikSablon, a.row, nextId, a.h);
    injectXml += built.xml;
    nextId = built.nextId;
  });
  if(!injectXml) return buf;

  drawingXml = drawingXml.replace('</xdr:wsDr>', injectXml + '</xdr:wsDr>');
  zip.file(drawingPath, drawingXml);
  return await zip.generateAsync({type:'arraybuffer'});
}

// Excel'e gömülecek delik/menfez diyagramını bir <canvas>'a çizip PNG base64 döndürür.
// Şablonla birebir aynı mantık: dikdörtgen (cam) + delik (daire) + üstten/soldan
// mesafeyi gösteren, üzerinde gerçek mm değeri yazan iki ölçü oku.
// Menfez yönü seçilmişse (dirs), o kenar(lar)a ayrıca kısa kırmızı ok çizilir (ayrı bilgi).
function renderDelikPngBase64(line, size){
  size = size || 220;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const padTop = 34, padLeft = 44, padRight = 44, padBottom = 16;
  const availW = size - padLeft - padRight, availH = size - padTop - padBottom;
  const w = parseFloat(line.w) || 1000, h = parseFloat(line.h) || 1000;
  const ratio = w/h;
  let rw, rh;
  if(ratio > availW/availH){ rw = availW; rh = availW/ratio; } else { rh = availH; rw = availH*ratio; }
  const x0 = padLeft + (availW-rw)/2, y0 = padTop + (availH-rh)/2, x1 = x0+rw, y1 = y0+rh;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);
  ctx.strokeStyle = '#333333'; ctx.lineWidth = 1.5;
  ctx.strokeRect(x0,y0,rw,rh);
  ctx.font = '11px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  (line.dm||[]).forEach(p=>{
    const px = x0+p.x*rw, py = y0+p.y*rh;
    const side = p.side || 'sol';
    // Gerçek mm mesafesi: kayıtlıysa doğrudan kullan, eski kayıtlarda yoksa oran üzerinden geri hesapla.
    const ustMm = (p.ust!=null && !isNaN(p.ust)) ? Math.round(p.ust) : Math.round(p.y*h);
    const yatayMm = (p.yatay!=null && !isNaN(p.yatay)) ? Math.round(p.yatay) : (p.sol!=null && !isNaN(p.sol)) ? Math.round(p.sol) : Math.round((side==='sag' ? (1-p.x) : p.x)*w);

    // --- Üstten ölçü oku: dikdörtgenin üst kenarından deliğe kadar, mm yazılı ---
    ctx.strokeStyle = '#1d4ed8'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(px, y0-14); ctx.lineTo(px, py); ctx.stroke();
    ctx.fillStyle = '#1d4ed8';
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px-4, py-8); ctx.lineTo(px+4, py-8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1d4ed8'; ctx.textAlign = 'center';
    ctx.fillText(ustMm+' mm', px, y0-22);

    // --- Yatay ölçü oku: hangi kenardan ölçüldüyse o kenardan deliğe kadar, mm yazılı ---
    if(side==='sag'){
      ctx.beginPath(); ctx.moveTo(x1+14, py); ctx.lineTo(px, py); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px+8, py-4); ctx.lineTo(px+8, py+4); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.translate(x1+24, py); ctx.rotate(Math.PI/2);
      ctx.fillText(yatayMm+' mm', 0, 0);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.moveTo(x0-14, py); ctx.lineTo(px, py); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px-8, py-4); ctx.lineTo(px-8, py+4); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.translate(x0-24, py); ctx.rotate(-Math.PI/2);
      ctx.fillText(yatayMm+' mm', 0, 0);
      ctx.restore();
    }

    // --- Menfez yönü (varsa) — ayrı, kısa kırmızı ok(lar) ---
    (p.dirs||[]).forEach(dir=>{
      let tx=px, ty=py;
      if(dir==='up') ty = y0-10;
      if(dir==='down') ty = y1+10;
      if(dir==='left') tx = x0-10;
      if(dir==='right') tx = x1+10;
      ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(tx,ty); ctx.stroke();
      const ang = Math.atan2(ty-py, tx-px);
      ctx.beginPath(); ctx.moveTo(tx,ty);
      ctx.lineTo(tx-7*Math.cos(ang-0.4), ty-7*Math.sin(ang-0.4));
      ctx.lineTo(tx-7*Math.cos(ang+0.4), ty-7*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fillStyle = '#dc2626'; ctx.fill();
    });

    // --- Delik (daire) ---
    ctx.beginPath(); ctx.arc(px,py,6,0,Math.PI*2);
    ctx.fillStyle = 'rgba(51,51,51,0.12)'; ctx.fill();
    ctx.strokeStyle = '#333333'; ctx.lineWidth = 1.2; ctx.stroke();
  });
  return canvas.toDataURL('image/png').split(',')[1];
}

function renderStats(){
  const el = document.getElementById('statStrip');
  if(!el) return;
  const counts = STATUSES.map((s,i)=>orders.filter(o=>o.status===i).length);
  el.innerHTML = STATUSES.map((s,i)=>`<div class="pane stat-card"><div class="stat-num">${counts[i]}</div><div class="stat-label">${s.short}</div></div>`).join('');
}

function renderFilters(){
  const el = document.getElementById('filterRow');
  if(!el) return;
  const chips = [{key:'all',label:'Tümü'}, ...STATUSES.map((s,i)=>({key:String(i),label:s.short}))];
  el.innerHTML = chips.map(c=>`<button class="filter-chip ${activeFilter===c.key?'active':''}" data-key="${c.key}">${c.label}</button>`).join('');
  el.querySelectorAll('.filter-chip').forEach(btn=>{
    btn.onclick = ()=>{ activeFilter = btn.dataset.key; renderFilters(); renderList(profile.role==='satici'); };
  });
}

// Sipariş listesinin altındaki kalınlık/kategori filtre çipleri — 4mm/8mm/Isıcam gibi
// birbirine karışmaması için, sadece o an aktif siparişlerde gerçekten var olan
// kalınlıklar gösterilir.
function renderThicknessFilters(){
  const el = document.getElementById('thicknessFilterRow');
  if(!el) return;
  const activeOrders = orders.filter(o=>o.status < DELIVERED_INDEX);
  const present = new Set(activeOrders.map(orderThicknessKey));
  if(present.size <= 1){ el.innerHTML = ''; return; }
  const order = ['4MM','5MM','6MM','8MM','ISI CAM','DİĞER'];
  const keys = [...present].sort((a,b)=>{
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia===-1?99:ia) - (ib===-1?99:ib);
  });
  const chips = [{key:'all',label:'Tümü'}, ...keys.map(k=>({key:k,label:k}))];
  el.innerHTML = chips.map(c=>`<button class="filter-chip ${thicknessFilter===c.key?'active':''}" data-key="${c.key}">${c.label}</button>`).join('');
  el.querySelectorAll('.filter-chip').forEach(btn=>{
    btn.onclick = ()=>{ thicknessFilter = btn.dataset.key; renderThicknessFilters(); renderList(true); };
  });
}

        <div class="order-lines">${(o.lines||[]).map(l=>`<div class="order-line"><span>${l.w}×${l.h}mm × ${l.qty}${l.note?' — '+l.note:''}${l.sekilFotoUrl?` <a href="${l.sekilFotoUrl}" target="_blank" title="Şekil fotoğrafını gör">📷</a>`:''}</span><span class="lm2">${fmtM2(lineM2(l))}</span></div>`).join('')}</div>
        <div class="order-m2total">Toplam: ${fmtM2(total)}</div>
        ${o.note?`<div class="order-note">${linkifyNote(o.note)}</div>`:''}
        ${o.cust_address?`<div class="order-note">📍 ${o.cust_address}</div>`:''}
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
        ${(isSellerView && !isDelivered && o.status===URETIM_INDEX) ? uretimAdimlariHtml(o) : ''}
      </div>
      <div class="order-due"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1.5" y="2.5" width="9" height="8" rx="1" stroke="#9CA3AF"/><path d="M1.5 5 H10.5 M4 1.5V3.5M8 1.5V3.5" stroke="#9CA3AF"/></svg>${fmtDate(o.due)}</div>
      <span class="status-pill ${pillClass}">${pillLabel}</span>
      ${actionsHtml}
    </div>`;
}

function renderList(isSellerView){
  const el = document.getElementById('orderList');
  if(!el) return;
  const activeOrders = orders.filter(o=>o.status < DELIVERED_INDEX);
  const deliveredOrders = orders.filter(o=>o.status === DELIVERED_INDEX);
  let list = activeOrders.slice();
  if(isSellerView && activeFilter !== 'all') list = list.filter(o=>String(o.status)===activeFilter);
  if(isSellerView && thicknessFilter !== 'all') list = list.filter(o=>orderThicknessKey(o)===thicknessFilter);
  renderThicknessFilters();
  if(isSellerView && searchQuery.trim()){
    const q = searchQuery.trim().toLocaleLowerCase('tr');
    list = list.filter(o=> `${o.bayi_adi||''} ${o.cust_name||''}`.toLocaleLowerCase('tr').includes(q));
  }

  el.innerHTML = list.length===0
    ? `<div class="pane empty-state"><div class="section-eyebrow">Kayıt yok</div><div style="font-size:13px;">Henüz aktif sipariş bulunmuyor.</div></div>`
    : list.map(o=>orderCardHtml(o, isSellerView, false)).join('');

  el.querySelectorAll('.editBtn').forEach(b=>{
    b.onclick = ()=>{
      const o = orders.find(x=>String(x.id)===b.dataset.id);
      if(o) openEditOrder(o, isSellerView);
    };
  });
  el.querySelectorAll('.deleteBtn').forEach(b=>{
    b.onclick = async ()=>{
      const o = orders.find(x=>String(x.id)===b.dataset.id);
      if(!o) return;
      if(!confirm(`#${o.id} numaralı siparişi silmek istediğine emin misin? Silinenler'den geri alabilirsin.`)) return;
      const {data, error} = await sb.from('orders').update({deleted_at: new Date().toISOString()}).eq('id', o.id).select();
      if(sbCheckRow(data, error, 'Sipariş silinemedi.')) return;
      if(isSellerView){ await loadOrdersForSeller(); } else { await loadOrdersForCustomer(); }
      renderStats(); renderFilters(); renderList(isSellerView);
    };
  });

  el.querySelectorAll('.orderBulkCheck').forEach(c=>{
    c.onchange = ()=>{
      if(c.checked) selectedForBulk.add(c.dataset.id);
      else selectedForBulk.delete(c.dataset.id);
      updateBulkDeleteBar();
      updateBulkKesimBar();
    };
  });
  updateBulkDeleteBar();
  updateBulkKesimBar();

  if(isSellerView){
    el.querySelectorAll('.excelBtn').forEach(b=>{
      b.onclick = ()=>{
        const o = orders.find(x=>String(x.id)===b.dataset.id);
        if(o) askExcelCopiesAndExport(o);
      };
    });
    el.querySelectorAll('.ascBtn').forEach(b=>{
      b.onclick = ()=>{
        const o = orders.find(x=>String(x.id)===b.dataset.id);
        if(o) exportOrderToASC(o);
      };
    });
    el.querySelectorAll('.etiketBtn').forEach(b=>{
      b.onclick = ()=>{
        const o = orders.find(x=>String(x.id)===b.dataset.id);
        if(o) printEtiketler(o);
      };
    });
    el.querySelectorAll('.teklifBtn').forEach(b=>{
      b.onclick = ()=>{
        const o = orders.find(x=>String(x.id)===b.dataset.id);
        if(o) printTeklifForOrder(o);
      };
    });
    el.querySelectorAll('.nextBtn').forEach(b=>{
      b.onclick = async ()=>{
        const o = orders.find(x=>String(x.id)===b.dataset.id);
        if(o && o.status <= DELIVERED_INDEX-1){
          const {data, error} = await sb.from('orders').update({status:o.status+1}).eq('id', o.id).select();
          if(sbCheckRow(data, error, 'Sipariş durumu güncellenemedi.')) return;
          await loadOrdersForSeller(); renderStats(); renderFilters(); renderList(true);
        }
      };
    });
    el.querySelectorAll('.prevBtn').forEach(b=>{
      b.onclick = async ()=>{
        const o = orders.find(x=>String(x.id)===b.dataset.id);
        if(o && o.status > 0){
          const {data, error} = await sb.from('orders').update({status:o.status-1}).eq('id', o.id).select();
          if(sbCheckRow(data, error, 'Sipariş durumu güncellenemedi.')) return;
          await loadOrdersForSeller(); renderStats(); renderFilters(); renderList(true);
        }
      };
    });
    // Üretimde durumundaki sırasız adım kutucukları — hangi sırayla işaretlenirse
    // işaretlensin, sadece o adımın kendi bayrağını (true/false) günceller.
    el.querySelectorAll('.uretimAdimCheck').forEach(cb=>{
      cb.onchange = async ()=>{
        const o = orders.find(x=>String(x.id)===cb.dataset.id);
        if(!o) return;
        const yeni = Object.assign({}, o.uretim_adimlari||{});
        yeni[cb.dataset.key] = cb.checked;
        const {data, error} = await sb.from('orders').update({uretim_adimlari: yeni}).eq('id', o.id).select();
        if(sbCheckRow(data, error, 'Üretim adımı güncellenemedi.')) return;
        await loadOrdersForSeller(); renderList(true);
      };
    });
  }

  // Sevk edilenler — ayrı arşiv bölümü
  const archEl = document.getElementById('deliveredSection');
  if(archEl){
    archEl.innerHTML = `
      <div class="list-head" style="margin-top:26px;">
        <div class="section-eyebrow" style="margin-bottom:0;">Sevk edilenler <span class="hint">(${deliveredOrders.length})</span></div>
        ${deliveredOrders.length>0 ? `<button class="btn btn-ghost btn-sm" id="toggleDeliveredBtn">${showDelivered?'Gizle':'Göster'}</button>` : ''}
      </div>
      <div id="deliveredList" style="${showDelivered?'':'display:none;'}">
        ${deliveredOrders.length===0
          ? `<div class="pane empty-state"><div style="font-size:13px;">Henüz sevk edilmiş sipariş yok.</div></div>`
          : deliveredOrders.map(o=>orderCardHtml(o, isSellerView, true)).join('')}
      </div>
    `;
    const toggleBtn = document.getElementById('toggleDeliveredBtn');
    if(toggleBtn) toggleBtn.onclick = ()=>{ showDelivered = !showDelivered; renderList(isSellerView); };
    if(isSellerView){
      archEl.querySelectorAll('.excelBtn').forEach(b=>{
        b.onclick = ()=>{
          const o = orders.find(x=>String(x.id)===b.dataset.id);
          if(o) askExcelCopiesAndExport(o);
        };
      });
      archEl.querySelectorAll('.ascBtn').forEach(b=>{
        b.onclick = ()=>{
          const o = orders.find(x=>String(x.id)===b.dataset.id);
          if(o) exportOrderToASC(o);
        };
      });
      archEl.querySelectorAll('.etiketBtn').forEach(b=>{
        b.onclick = ()=>{
          const o = orders.find(x=>String(x.id)===b.dataset.id);
          if(o) printEtiketler(o);
        };
      });
      archEl.querySelectorAll('.teklifBtn').forEach(b=>{
        b.onclick = ()=>{
          const o = orders.find(x=>String(x.id)===b.dataset.id);
          if(o) printTeklifForOrder(o);
        };
      });
      archEl.querySelectorAll('.undoDeliverBtn').forEach(b=>{
        b.onclick = async ()=>{
          const o = orders.find(x=>String(x.id)===b.dataset.id);
          if(o){
            const {data, error} = await sb.from('orders').update({status:STATUSES.length-1}).eq('id', o.id).select();
            if(sbCheckRow(data, error, 'Sipariş durumu güncellenemedi.')) return;
            await loadOrdersForSeller(); renderStats(); renderFilters(); renderList(true);
          }
        };
      });
    }
  }
  if(isSellerView){ renderBulkEtiket(); renderBulkAsc(); }
}

function updateBulkDeleteBar(){
  const btn = document.getElementById('bulkDeleteBtn');
  const countEl = document.getElementById('bulkDeleteCount');
  if(!btn || !countEl) return;
  const n = [...selectedForBulk].filter(id=>{
    const o = orders.find(x=>String(x.id)===String(id));
    return o && o.status===0;
  }).length;
  countEl.textContent = n;
  btn.style.display = n>0 ? 'inline-flex' : 'none';
}

async function handleBulkDelete(){
  const ids = [...selectedForBulk].filter(id=>{
    const o = orders.find(x=>String(x.id)===String(id));
    return o && o.status===0;
  });
  if(ids.length===0) return;
  if(!confirm(`${ids.length} siparişi silmek istediğine emin misin? Silinenler'den geri alabilirsin.`)) return;
  const {data, error} = await sb.from('orders').update({deleted_at: new Date().toISOString()}).in('id', ids).select();
  if(sbCheckRow(data, error, 'Siparişler silinemedi.')) return;
  selectedForBulk.clear();
  await loadOrdersForSeller();
  renderStats(); renderFilters(); renderList(true);
}

function updateBulkKesimBar(){
  const btn = document.getElementById('bulkKesimBtn');
  const countEl = document.getElementById('bulkKesimCount');
  if(!btn || !countEl) return;
  const n = [...selectedForBulk].filter(id=>{
    const o = orders.find(x=>String(x.id)===String(id));
    return o && !kesimTamamlandiMi(o);
  }).length;
  countEl.textContent = n;
  btn.style.display = n>0 ? 'inline-flex' : 'none';
}

// Seçilen birden fazla siparişi tek seferde "Kesim" olarak işaretler — her
// siparişin uretim_adimlari'ndaki diğer bayrakları (rodaj/temper/işlemde)
// koruyarak sadece kesim:true ekliyor, üzerine yazmıyor. Seçim içinde zaten
// kesimi işaretlenmiş olanlar varsa (sil için seçilmiş olabilirler) onlar
// bu işlemden pas geçilir.
async function handleBulkKesim(){
  const ids = [...selectedForBulk].filter(id=>{
    const o = orders.find(x=>String(x.id)===String(id));
    return o && !kesimTamamlandiMi(o);
  });
  if(ids.length===0) return;
  if(!confirm(`${ids.length} sipariş "Kesildi" olarak işaretlensin mi?`)) return;
  const sonuclar = await Promise.all(ids.map(id=>{
    const o = orders.find(x=>String(x.id)===String(id));
    const yeni = Object.assign({}, (o && o.uretim_adimlari) || {}, {kesim:true});
    return sb.from('orders').update({uretim_adimlari: yeni}).eq('id', id);
  }));
  if(sonuclar.some(r=>r.error)){ alert('Bazı siparişler güncellenemedi, sayfayı yenileyip tekrar dene.'); }
  selectedForBulk.clear();
  await loadOrdersForSeller();
  renderStats(); renderFilters(); renderList(true);
}

// kapatılır — atölyede hepsi kesimden ÖNCE toplu hazırlandığı için, kesim

function renderReportSection(){
  const el = document.getElementById('reportSection');
  if(!el) return;
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfWeek = new Date(startOfDay);
  startOfWeek.setDate(startOfWeek.getDate() - ((startOfDay.getDay()+6)%7)); // Pazartesi başlangıç
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const inRange = (o, from) => o.created_at && new Date(o.created_at) >= from;
  // Isıcam (çift cam) siparişte İKİ ayrı cam levhası kesilip kullanılıyor — bu yüzden
  // raporda (SADECE raporda; Excel/etiket'e hiç dokunulmuyor) m² hesabı Isıcam siparişler
  // için 2 katı sayılıyor, gerçek üretimde kesilen cam miktarını yansıtsın diye.
  const isicamMatch = (o)=> (o.renk||'').match(/^Isıcam:\s*([\d.,]+)\+([\d.,]+)\+([\d.,]+)\s+/i);
  const reportM2ForOrder = (o) => linesTotalM2(o.lines||[]) * (isicamMatch(o) ? 2 : 1);
  const m2Of = (list) => list.reduce((s,o)=> s + reportM2ForOrder(o), 0);

  const periods = [
    {label:'Bugün', list: orders.filter(o=>inRange(o, startOfDay))},
    {label:'Bu hafta', list: orders.filter(o=>inRange(o, startOfWeek))},
    {label:'Bu ay', list: orders.filter(o=>inRange(o, startOfMonth))},
    {label:'Toplam', list: orders}
  ];

  // Cam kalınlığına göre m² dağılımı (tüm zamanlar) — "8mm'den kaç m² sattık" gibi sorulara cevap.
  // Isıcam siparişler her iki cam kalınlığının (dış+iç) kendi kovasına tam alan olarak eklenir.
  const byThickness = {};
  orders.forEach(o=>{
    const m = isicamMatch(o);
    const m2 = linesTotalM2(o.lines||[]);
    if(m){
      const dis = m[1]+'MM', ic = m[3]+'MM';
      byThickness[dis] = (byThickness[dis]||0) + m2;
      byThickness[ic] = (byThickness[ic]||0) + m2;
    } else {
      const key = parseKalinlik(o.product_label) || 'Belirsiz';
      byThickness[key] = (byThickness[key]||0) + m2;
    }
  });
  const thicknessEntries = Object.entries(byThickness).sort((a,b)=>b[1]-a[1]);

  const bayiCounts = {};
  orders.forEach(o=>{
    const key = o.bayi_adi || o.cust_name || '—';
    bayiCounts[key] = (bayiCounts[key]||0) + 1;
  });
  const topBayi = Object.entries(bayiCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);

  el.innerHTML = `
    <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px;">
      ${periods.map(p=>`
        <div style="background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px;">
          <div class="hint">${p.label}</div>
          <div style="font-size:18px; font-weight:800;">${fmtM2(m2Of(p.list))}</div>
          <div class="hint" style="font-size:11px;">${p.list.length} sipariş</div>
        </div>
      `).join('')}
    </div>
    <div class="hint" style="margin-bottom:6px;">Cam kalınlığına göre m² (toplam)</div>
    ${thicknessEntries.length===0 ? `<div class="hint">Henüz veri yok.</div>` : thicknessEntries.map(([k,v])=>`
      <div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;">
        <span>${k}</span><span style="font-weight:700;">${fmtM2(v)}</span>
      </div>
    `).join('')}
    <div class="hint" style="margin:14px 0 6px;">En çok sipariş veren bayiler</div>
    ${topBayi.length===0 ? `<div class="hint">Henüz veri yok.</div>` : topBayi.map(([name,count],i)=>`
      <div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;">
        <span>${i+1}. ${name}</span><span style="font-weight:700;">${count} sipariş</span>
      </div>
    `).join('')}
  `;
}

/* =========================================================
   EXCEL EXPORT — "Kuante Cam Sipariş Formu" şablonunun birebir kopyası
   (ExcelJS ile: gerçek hücre kenarlıkları, gri başlık dolguları,
    birleştirilmiş hücreler ve sabit logo görseliyle)
   ========================================================= */
const THIN = {style:'thin', color:{argb:'FF000000'}};
const BORDER_ALL = {top:THIN, left:THIN, bottom:THIN, right:THIN};
const GRAY_FILL = {type:'pattern', pattern:'solid', fgColor:{argb:'FFD9D9D9'}};
const FONT_HDR = {name:'Calibri', size:10, bold:true};
const FONT_TBL = {name:'Arial', size:9, bold:true};
const FONT_TBL_N = {name:'Arial', size:9, bold:false};

function styleCell(cell, {font, fill, align, border=true, numFmt, wrap}={}){
  if(font) cell.font = font;
  if(fill) cell.fill = fill;
  if(border) cell.border = BORDER_ALL;
  if(align) cell.alignment = {horizontal:align.h, vertical:align.v, wrapText:!!wrap};
  if(numFmt) cell.numFmt = numFmt;
}

// Dosya adında sorun çıkarabilecek karakterleri (\ / : * ? " < > |) temizler,
// Windows/Mac'te dosya adı olarak güvenle kullanılabilsin diye.
function safeFilenamePart(s){
  return String(s||'').replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').trim();
}

// "8 MM FÜME CAM JUMBO" gibi ürün açıklamasından kalınlığı ayıklar
function parseKalinlik(label){
  const s = (label||'').trim();
  if(!s) return '';
  // Isıcam tipi üçlü ölçü: "4X12X4 ..."
  let m = s.match(/^(\d+(?:[.,]\d+)?\s*[xX]\s*\d+(?:[.,]\d+)?\s*[xX]\s*\d+(?:[.,]\d+)?)/);
  if(m) return m[1].replace(/\s+/g,'').toUpperCase();
  // Düz cam: "8 MM FÜME ..."
  m = s.match(/^(\d+(?:[.,]\d+)?)\s*MM\b/i);
  if(m) return `${m[1]}MM`;
  return '';
}
// cam adı SADECE "FÜME", "ŞEFFAF", "MİKA" veya "ISICAM" olarak yazılır, başka hiçbir şey yazılmaz (eski siparişler için yedek)
function parseCamAdi(label){
  const s = (label||'').toLocaleUpperCase('tr');
  if(s.includes('FÜME')) return 'FÜME';
  if(s.includes('ŞEFFAF')) return 'ŞEFFAF';
  if(s.includes('MİKA')) return 'MİKA';
  if(s.includes('ISICAM')) return 'ISICAM';
  return '';
}

// Bir siparişin tam form bloğunu (başlık+firma+müşteri+tablo+toplam+delik) verilen
// satırdan (base+1) başlayarak çizer. Hem tekli export hem toplu export bunu kullanır.
// base=0 → blok 1. satırdan başlar (eskisiyle birebir aynı). Dönen değer: bloğun kullandığı son satır.
// Sipariş satırlarını Boy (h) değerine göre gruplar: aynı Boy'daki satırlar bitişik
// yazılır (siparişte hangi sırayla girildiyse o sıra grup içinde korunur, gruplar
// arasında ilk görülme sırası korunur), farklı bir Boy grubuna geçerken araya 1 boş
// satır konur. "No" sütunu bu yeni (yazılan) sıraya göre numaralanır.
// Döner: {rows:[{row, line, idx, no}], lastDataRow}
function buildLinesRowPlan(lines, firstRow){
  if(!lines.length) return {rows:[], lastDataRow: firstRow};
  const groups = [];
  const groupIdxByKey = new Map();
  lines.forEach((line, idx)=>{
    const key = String(parseFloat(line.h)||0);
    if(!groupIdxByKey.has(key)){ groupIdxByKey.set(key, groups.length); groups.push([]); }
    groups[groupIdxByKey.get(key)].push({line, idx});
  });
  const rows = [];
  let r = firstRow;
  groups.forEach((g, gi)=>{
    if(gi>0) r++; // farklı Boy grubuna geçiş — önce 1 boş satır
    g.forEach(item=>{
      rows.push({row:r, line:item.line, idx:item.idx, no: rows.length+1});
      r++;
    });
  });
  return {rows, lastDataRow: r-1};
}

function drawOrderExcelBlock(wb, ws, o, base, delikSablonAnchors){
  const R = (n)=> base + n; // blok-içi göreli satırı, sayfadaki gerçek satıra çevirir
  const wsName = profile.workshop_name || profile.full_name || 'Atölye';
  const lines = o.lines || [];
  const firstRow = R(12); // veri satırları bloğun 12. satırından başlar (şablonla birebir aynı)
  const rowPlan = buildLinesRowPlan(lines, firstRow); // Boy'a göre gruplu satır planı
  const lastDataRow = rowPlan.lastDataRow;
  const totalRow = lastDataRow + 2; // toplam satırı, veri bloğundan 1 satır boşlukla ayrı
  const rowByIdx = {}; // orijinal satır index -> yazıldığı gerçek Excel satırı (Fiyat bölümü için)
  rowPlan.rows.forEach(p=>{ rowByIdx[p.idx] = p.row; });

  // Satır 1 — başlık
  ws.mergeCells(`A${R(1)}:I${R(1)}`);
  styleCell(ws.getCell(`A${R(1)}`), {font:{name:'Calibri', size:11, bold:true}, align:{h:'center', v:'center'}});
  ws.getCell(`A${R(1)}`).value = `${wsName} Cam Sipariş Formu`;

  // Satır 2 — "Firma Bilgileri" + logo alanı
  ws.mergeCells(`A${R(2)}:F${R(2)}`);
  styleCell(ws.getCell(`A${R(2)}`), {font:FONT_HDR, fill:GRAY_FILL, align:{h:'center'}});
  ws.getCell(`A${R(2)}`).value = 'Firma Bilgileri';
  ws.mergeCells(`G${R(2)}:I${R(8)}`);
  styleCell(ws.getCell(`G${R(2)}`), {border:false});
  if(KUANTE_LOGO_B64){
    const imgId = wb.addImage({base64:KUANTE_LOGO_B64, extension:'jpeg'});
    ws.addImage(imgId, `G${R(2)}:I${R(8)}`);
  }

  // Satır 3 — E-MAİL / TEL
  styleCell(ws.getCell(`A${R(3)}`), {font:FONT_HDR}); ws.getCell(`A${R(3)}`).value = 'E-MAİL';
  ws.mergeCells(`B${R(3)}:C${R(3)}`);
  styleCell(ws.getCell(`B${R(3)}`), {font:FONT_HDR, align:{h:'left'}}); ws.getCell(`B${R(3)}`).value = profile.company_email || '';
  styleCell(ws.getCell(`D${R(3)}`), {font:FONT_HDR}); ws.getCell(`D${R(3)}`).value = 'TEL';
  styleCell(ws.getCell(`E${R(3)}`), {font:FONT_HDR}); ws.getCell(`E${R(3)}`).value = profile.company_phone || '';

  // Satır 4 — WEB / FAKS
  styleCell(ws.getCell(`A${R(4)}`), {font:FONT_HDR}); ws.getCell(`A${R(4)}`).value = 'WEB';
  ws.mergeCells(`B${R(4)}:C${R(4)}`);
  styleCell(ws.getCell(`B${R(4)}`), {font:FONT_HDR, align:{h:'left'}}); ws.getCell(`B${R(4)}`).value = profile.company_web || '';
  styleCell(ws.getCell(`D${R(4)}`), {font:FONT_HDR}); ws.getCell(`D${R(4)}`).value = 'FAKS';
  styleCell(ws.getCell(`E${R(4)}`), {font:FONT_HDR});

  // Satır 5-6 — ADRES
  styleCell(ws.getCell(`A${R(5)}`), {font:FONT_HDR}); ws.getCell(`A${R(5)}`).value = 'ADRES';
  styleCell(ws.getCell(`A${R(6)}`), {font:FONT_HDR});
  ws.mergeCells(`B${R(5)}:F${R(6)}`);
  styleCell(ws.getCell(`B${R(5)}`), {font:FONT_HDR, align:{h:'center', v:'center'}, wrap:true});
  ws.getCell(`B${R(5)}`).value = profile.company_address || '';

  // Satır 7 — "Müşteri Bilgileri"
  ws.mergeCells(`A${R(7)}:F${R(7)}`);
  styleCell(ws.getCell(`A${R(7)}`), {font:FONT_HDR, fill:GRAY_FILL, align:{h:'center'}});
  ws.getCell(`A${R(7)}`).value = 'Müşteri Bilgileri';

  // Satır 8 — BAYİ ADI (siparişi veren müşteri/bayi)
  styleCell(ws.getCell(`A${R(8)}`), {font:FONT_HDR}); ws.getCell(`A${R(8)}`).value = 'BAYİ ADI';
  ws.mergeCells(`B${R(8)}:E${R(8)}`);
  styleCell(ws.getCell(`B${R(8)}`), {font:FONT_HDR, align:{h:'center'}}); ws.getCell(`B${R(8)}`).value = o.bayi_adi || o.cust_name || '';

  // Satır 9 — MÜŞTERİ ADI / Form No + Tarih (tek bölümde birleşik)
  styleCell(ws.getCell(`A${R(9)}`), {font:FONT_HDR, align:{h:'left'}}); ws.getCell(`A${R(9)}`).value = 'MÜŞTERİ ADI';
  ws.mergeCells(`B${R(9)}:E${R(9)}`);
  styleCell(ws.getCell(`B${R(9)}`), {font:FONT_HDR, align:{h:'center'}});
  ws.getCell(`B${R(9)}`).value = o.cust_name || '';
  ws.mergeCells(`G${R(9)}:I${R(9)}`);
  const tarihStr = new Date(o.created_at || o.due || Date.now()).toLocaleDateString('tr-TR');
  const sortedOrders = [...orders].sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
  const formNo = sortedOrders.findIndex(x=>x.id===o.id) + 1;
  styleCell(ws.getCell(`G${R(9)}`), {font:FONT_HDR, align:{h:'center'}});
  ws.getCell(`G${R(9)}`).value = `Form No : ${formNo || 1}`;

  // Satır 10 — ADRES / Tarih (Form No'nun bir alt satırı)
  styleCell(ws.getCell(`A${R(10)}`), {font:FONT_HDR}); ws.getCell(`A${R(10)}`).value = 'ADRES';
  ws.mergeCells(`B${R(10)}:E${R(10)}`);
  styleCell(ws.getCell(`B${R(10)}`), {font:FONT_HDR, align:{h:'center'}});
  ws.getCell(`B${R(10)}`).value = o.cust_address || '';
  ws.mergeCells(`G${R(10)}:I${R(10)}`);
  styleCell(ws.getCell(`G${R(10)}`), {font:FONT_HDR, align:{h:'center'}});
  ws.getCell(`G${R(10)}`).value = `Tarih : ${tarihStr}`;

  // Satır 11 — tablo başlıkları (Delik ve Poz tek sütunda birleşik)
  const headRow = ['No','Genişlik','Yükseklik','Adet','m2','Cam Rengi','Cam Özelliği','Delik/Poz'];
  headRow.forEach((val,i)=>{
    const cell = ws.getCell(R(11), i+1);
    styleCell(cell, {font:FONT_TBL, align:{h:'center'}});
    if(val!=null) cell.value = val;
  });

  let toplamAdet = 0, toplamM2 = 0;

  // Veri satırları (siparişin ölçü/kalem listesi) — No | Genişlik | Yükseklik | Adet | m2 | Cam Rengi | Cam Özelliği | Delik/Poz
  rowPlan.rows.forEach(({row:r, line:l, no})=>{
    const qty = parseInt(l.qty)||0, w = parseFloat(l.w)||0, h = parseFloat(l.h)||0;
    const satirM2 = lineM2(l); // atölyenin 3 ondalık yuvarlama kuralıyla birebir
    toplamAdet += qty; toplamM2 += satirM2;
    // Delik/Poz: kullanıcı bu kutuya ne yazdıysa direkt yazılır; hiçbir şey yazmadıysa
    // ama delik kroki eklendiyse yedek olarak "Delik" yazılır.
    const delikPoz = l.note || (l.dm && l.dm.length ? 'Delik' : '');
    // Satırın kendine özel Isıcam'ı varsa (mini etiketten değiştirilmişse) o kullanılır,
    // yoksa sipariş genelindeki cam bilgisine düşer — etiket yazdırmayla aynı mantık.
    const { camRengi: camAdi, camOzelligi } = etiketCamBilgisi(o, l);
    const vals = { A: no, B: w, C: h, D: qty, F: camAdi, G: camOzelligi, H: delikPoz };
    Object.entries(vals).forEach(([col,val])=>{
      const cell = ws.getCell(`${col}${r}`);
      const isNum = col==='A'||col==='B'||col==='C'||col==='D';
      styleCell(cell, {font: isNum ? FONT_TBL_N : FONT_TBL, align: isNum ? {h:'center'} : {h:'left', wrap:true}});
      cell.value = val;
    });
    // E = m2 (adet × tek parça m²'si) — Excel'de ölçü değişirse otomatik güncellensin diye
    // formül olarak yazılıyor; ROUND(...,3) atölyenin 3 ondalık yuvarlama kuralını Excel
    // tarafında da korur (kullanıcı ölçüyü Excel'de değiştirirse bile fiyatla tutarlı kalır).
    styleCell(ws.getCell(`E${r}`), {font:FONT_TBL_N, align:{h:'center'}, numFmt:'0.000'});
    ws.getCell(`E${r}`).value = {formula:`ROUND((B${r}*C${r}*D${r})/1000000,3)`, result: satirM2};
  });

  // GENEL TOPLAM satırı — toplam adet ve toplam m² doğrudan hesaplanmış değer olarak yazılıyor
  ws.mergeCells(`A${totalRow}:D${totalRow}`);
  styleCell(ws.getCell(`A${totalRow}`), {font:FONT_TBL_N, fill:GRAY_FILL, align:{h:'center'}});
  ws.getCell(`A${totalRow}`).value = {formula:`"Toplam "&SUM(D${firstRow}:D${lastDataRow})&" Adet"`, result: `Toplam ${toplamAdet} Adet`};
  styleCell(ws.getCell(`E${totalRow}`), {font:FONT_TBL_N, fill:GRAY_FILL, align:{h:'center'}, numFmt:'0.000 "m²"'});
  ws.getCell(`E${totalRow}`).value = {formula:`SUM(E${firstRow}:E${lastDataRow})`, result: Number(toplamM2.toFixed(3))};
  ['F','G','H'].forEach(col=>styleCell(ws.getCell(`${col}${totalRow}`), {font:FONT_TBL_N, fill:GRAY_FILL}));

  // Delik Bölümü — sadece kroki eklenmiş satırlar için, tablonun altına ayrı bir bölüm olarak (sadece şema, ekstra ölçü yazısı yok)
  const dmLines = lines.filter(l=>l.dm && l.dm.length);
  const delikSablonLines = lines.filter(l=>l.delikSablon && l.delikSablon.sablon);
  let lastUsedRow = totalRow;
  if(dmLines.length || delikSablonLines.length){
    let r = totalRow + 2;
    ws.mergeCells(`A${r}:I${r}`);
    styleCell(ws.getCell(`A${r}`), {font:FONT_HDR, fill:GRAY_FILL, align:{h:'center'}});
    ws.getCell(`A${r}`).value = 'Delik Bölümü';
    r += 1;
    dmLines.forEach(l=>{
      const b64 = renderDelikPngBase64(l, 220);
      const imgId = wb.addImage({base64:b64, extension:'png'});
      ws.addImage(imgId, {tl:{col:0, row:r-1}, ext:{width:220, height:220}});
      r += 12;
    });
    // Yeni şablon sistemi: gerçek Excel Shape'leri writeBuffer() SONRASINDA enjekte
    // edilecek (ExcelJS shape çizmiyor) — burada sadece hangi satıra (0-indeksli
    // row) ankraj olacağını kaydediyoruz, delikSablonAnchors dizisine ekliyoruz.
    delikSablonLines.forEach(l=>{
      if(delikSablonAnchors) delikSablonAnchors.push({delikSablon: l.delikSablon, row: r-1, h: l.h});
      r += 26;
    });
    lastUsedRow = r - 1;
  }

  // Fiyat — sadece en az bir satıra birim fiyat girilmişse eklenir. Bilerek tablonun
  // SAĞINA (K/L sütunları) yazılıyor: A4 yazdırma alanı sadece A:I sütunlarını kapsıyor,
  // bu yüzden fiyat ekranda/Excel'de görünür ama kağıda hiç basılmıyor.
  const fiyatLines = lines.filter(l=>l.fiyat && parseFloat(l.fiyat)>0);
  if(fiyatLines.length){
    styleCell(ws.getCell(`K${R(11)}`), {font:FONT_TBL, align:{h:'center'}, border:false});
    ws.getCell(`K${R(11)}`).value = 'Birim Fiyat (TL/m²)';
    styleCell(ws.getCell(`L${R(11)}`), {font:FONT_TBL, align:{h:'center'}, border:false});
    ws.getCell(`L${R(11)}`).value = 'Tutar (TL)';
    let genelTutar = 0;
    lines.forEach((l,i)=>{
      const r = rowByIdx[i]; // Boy'a göre gruplanmış gerçek satır (blok başlangıcından basit ofset değil)
      // m² atölyenin 3 ondalık yuvarlama kuralıyla (lineM2) hesaplanır — Fiyat bu
      // yuvarlanmış değerle çarpılır, tam (yuvarlanmamış) değerle değil. Örnek:
      // 617×1770mm × 2 adet = 2,18418 m² → yuvarlanır 2,184 m² → ×1310 TL = 2.861,04 TL.
      // Yuvarlanmamış tam değer kullanılsaydı 2.861,28 TL çıkardı — atölyenin elle
      // hesapladığından fazla, kul hakkı geçecek bir fark.
      const m2 = lineM2(l);
      const fiyat = parseFloat(l.fiyat)||0;
      const tutar = m2*fiyat;
      genelTutar += tutar;
      styleCell(ws.getCell(`K${r}`), {font:FONT_TBL_N, align:{h:'center'}, border:false, numFmt:'#,##0.00'});
      ws.getCell(`K${r}`).value = fiyat;
      styleCell(ws.getCell(`L${r}`), {font:FONT_TBL_N, align:{h:'center'}, border:false, numFmt:'#,##0.00'});
      ws.getCell(`L${r}`).value = tutar;
    });
    styleCell(ws.getCell(`K${totalRow}`), {font:FONT_TBL, fill:GRAY_FILL, border:false, align:{h:'right'}});
    ws.getCell(`K${totalRow}`).value = 'GENEL TOPLAM:';
    styleCell(ws.getCell(`L${totalRow}`), {font:FONT_TBL, fill:GRAY_FILL, border:false, numFmt:'#,##0.00 "TL"'});
    ws.getCell(`L${totalRow}`).value = genelTutar;
  }
  return lastUsedRow;
}

// drawOrderExcelBlock ile birebir aynı satır matematiğini, hücrelere hiç yazmadan
// hesaplar — bir bloğun kaç satır tutacağını ÖNCEDEN bilmek için (sayfa bölünmesini
// önlemede kullanılıyor).
function estimateBlockRows(o){
  const lines = o.lines || [];
  // drawOrderExcelBlock'taki (base=0) firstRow=12 ile birebir aynı, Boy'a göre
  // gruplama (araya giren boş satırlar dahil) da aynı yardımcı fonksiyonla hesaplanıyor.
  const lastDataRow = buildLinesRowPlan(lines, 12).lastDataRow;
  const totalRow = lastDataRow + 2;
  const dmLines = lines.filter(l=>l.dm && l.dm.length);
  const delikSablonLines = lines.filter(l=>l.delikSablon && l.delikSablon.sablon);
  if(!dmLines.length && !delikSablonLines.length) return totalRow;
  return totalRow + 2 + dmLines.length*12 + delikSablonLines.length*26;
}

// Bir A4 sayfasına (mevcut kenar boşluğu + varsayılan 15pt satır yüksekliğiyle) sığan
// yaklaşık satır sayısı. Gerçek Excel render'ında küçük farklar olabileceği için
// bilerek biraz düşük tutulan güvenli bir tahmin (fazla iyimser olup bloğu ortadan
// kesmektense, bir bloğu bir sonraki sayfaya erken atmak tercih edilir).
const EXCEL_ROWS_PER_A4_PAGE = 46;

// Birden fazla sipariş bloğunu (aynı sipariş tekrar tekrar ya da farklı siparişler)
// alt alta yerleştirir. Bir sonraki blok mevcut sayfaya SIĞMAYACAKSA, o bloğu
// ortadan kesmek yerine tamamen bir sonraki A4 sayfasına atar (manuel sayfa kesimi).
function layoutOrderBlocks(wb, ws, orderList, delikSablonAnchors){
  let cursor = 0;       // o ana kadar kullanılan son satır (mutlak)
  let pageUsed = 0;     // mevcut "sanal" A4 sayfasında kullanılan satır sayısı
  const GAP = 2;         // bloklar arası boşluk satırı
  let lastUsedRow = 0;
  orderList.forEach((o, idx)=>{
    const estRows = estimateBlockRows(o);
    if(idx > 0){
      if(pageUsed + GAP + estRows > EXCEL_ROWS_PER_A4_PAGE){
        // Bu blok mevcut sayfaya sığmıyor — sayfayı burada kes, blok yeni sayfadan başlasın.
        ws.getRow(cursor).addPageBreak();
        pageUsed = 0;
      } else {
        cursor += GAP;
        pageUsed += GAP;
      }
    }
    const startBase = cursor;
    const endRow = drawOrderExcelBlock(wb, ws, o, startBase, delikSablonAnchors);
    pageUsed += (endRow - startBase);
    cursor = endRow;
    lastUsedRow = endRow;
  });
  return lastUsedRow;
}

async function exportOrderToExcelGenel(o, copies){
  copies = Math.max(1, parseInt(copies)||1);
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Sipariş', {
    pageSetup:{
      orientation:'portrait', paperSize:9,
      // Sütunlar (A-I) her zaman TEK sayfa genişliğine sığsın; satır sayısı arttıkça
      // (çok satırlı sipariş / delik krokisi / birden fazla kopya) alt alta yeni A4 sayfasına taşsın.
      fitToPage:true, fitToWidth:1, fitToHeight:0,
      horizontalCentered:true,
      margins:{left:0.3, right:0.3, top:0.3, bottom:0.3, header:0.1, footer:0.1}
    }
  });

  ws.columns = [{width:5}, {width:10}, {width:10}, {width:7}, {width:8.86}, {width:12}, {width:16}, {width:18}, {width:2.86}, {width:3}, {width:16}, {width:14}];

  // Fabrikadaki farklı bölümlere (kesim, temperleme, paketleme vb.) dağıtmak için
  // aynı siparişin formu, istenen kopya sayısı kadar alt alta tekrar basılır —
  // bir kopya sayfa ortasında bölünecekse otomatik yeni sayfaya atılır.
  const orderList = Array.from({length: copies}, ()=>o);
  const delikSablonAnchors = []; // {delikSablon, row} — writeBuffer() sonrası gerçek Shape enjeksiyonu için
  const lastUsedRow = layoutOrderBlocks(wb, ws, orderList, delikSablonAnchors);
  // Yazdırma alanı içeriğin bittiği satırdan biraz daha aşağıya kadar (+25 satır) açık
  // bırakılıyor — dosya indirildikten sonra Excel'de elle not/şekil/çizim eklenirse
  // (örn. şekilli camın taslağı) o da yazdırma alanına girsin diye.
  ws.pageSetup.printArea = `A1:I${lastUsedRow + 1000}`;

  const bayiAdi = safeFilenamePart(o.bayi_adi || o.cust_name || 'Bayi');
  const musteriAdi = safeFilenamePart(o.cust_name || 'Müşteri');
  const tarihAdi = safeFilenamePart(new Date(o.created_at || o.due || Date.now()).toLocaleDateString('tr-TR'));
  // Bayi ve müşteri aynıysa (bayi adı girilmemiş, ikisi de müşteri adına düşmüşse) ismi tekrar etme.
  const isimKismi = bayiAdi === musteriAdi ? bayiAdi : `${bayiAdi} ${musteriAdi}`;
  const kopyaEk = copies>1 ? ` ${copies} kopya` : '';
  await downloadWorkbook(wb, `${isimKismi} ${tarihAdi}${kopyaEk}.xlsx`, delikSablonAnchors);
}

// "Excel'e aktar" butonuna basınca kaç kopya (fabrikadaki kaç bölüme) basılacağını sorar.
function askExcelCopiesAndExport(o){
  if(!o) return;
  const input = prompt('Bu sipariş için kaç kopya Excel formu oluşturulsun? (fabrikadaki her bölüm için bir kopya)', '1');
  if(input === null) return; // iptal
  const copies = Math.max(1, parseInt(input)||1);
  exportOrderToExcelGenel(o, copies);
}

async function downloadWorkbook(wb, filename, delikSablonAnchors){
  let buf = await wb.xlsx.writeBuffer();
  if(delikSablonAnchors && delikSablonAnchors.length){
    buf = await injectDelikSablonShapes(buf, delikSablonAnchors);
  }
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  // Destekleyen tarayıcılarda (Chrome/Edge) "Farklı Kaydet" penceresi açılıp
  // kullanıcı istediği klasörü seçebiliyor; desteklemeyen tarayıcılarda (Firefox/Safari)
  // eski usul otomatik indirmeye düşülüyor.
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{description:'Excel Dosyası', accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    }catch(err){
      if(err.name === 'AbortError') return; // kullanıcı "Farklı Kaydet" penceresini iptal etti
      // desteklenmiyor/başka bir hata olursa eski yönteme düş
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
/* =========================================================
   ASC (OPTIME) DIŞA AKTARIM
   ---------------------------------------------------------
   Kullanıcının verdiği örnek "HALK.ASC" dosyası bayt bayt incelenerek
   çıkarılan sabit-genişlikli (fixed-width) satır yapısına göre üretilir.
   ÖNEMLİ — bu format kullanıcının Optime programına özgü, belgesi
   olmayan bir yapı. Tek bir örnek dosyadan çıkarılabildiği kadarıyla
   alan genişlikleri/konumları BİREBİR eşleştirildi (offset'ler test
   edildi, toplam satır uzunluğu 1049 karakter olacak şekilde tutarlı).
   Ancak bazı alanların TAM ANLAMI belirsiz kaldı — bu alanlar örnekteki
   gibi sabit/varsayılan değerlerle dolduruluyor. Kullanıcı Optime'a
   bir deneme dosyası atıp sonucu bildirirse bu alanlar netleştirilebilir.
   ========================================================= */

// Windows-1254 (Türkçe) bayt kodlaması — Optime muhtemelen UTF-8 değil bu
// eski Windows kod sayfasını bekliyor. Sadece 6 Türkçe harf Latin-1'den farklı.
const CP1254_MAP = {'İ':0xDD,'ı':0xFD,'Ğ':0xD0,'ğ':0xF0,'Ş':0xDE,'ş':0xFE};
function encodeCP1254(str){
  const bytes = new Uint8Array(str.length);
  for(let i=0;i<str.length;i++){
    const ch = str[i];
    const code = ch.codePointAt(0);
    if(CP1254_MAP[ch]!=null) bytes[i] = CP1254_MAP[ch];
    else if(code<=255) bytes[i] = code;
    else bytes[i] = 0x3F; // '?' — bilinmeyen karakter
  }
  return bytes;
}
function ascPadR(v,n){ v=(v==null?'':String(v)); v=v.length>n?v.slice(0,n):v; return v + ' '.repeat(n-v.length); }
function ascPadL(v,n){ v=(v==null?'':String(v)); v=v.length>n?v.slice(0,n):v; return ' '.repeat(n-v.length) + v; }
function ascNum1(v,n){
  // ÖNEMLİ: Optime satır formatı bu alanı hep 1 ondalıkla bekliyor, o yüzden genişliği
  // değiştiremiyoruz — ama girilen ölçü ASLA yukarı/aşağı yuvarlanmıyor, sadece
  // 1. ondalıktan sonrası kesiliyor (kesme = truncate, yuvarlama değil). Normalde
  // ölçüler zaten tam mm (küsuratsız) girildiği için bu hiçbir şeyi değiştirmiyor;
  // sadece istisnai küsuratlı bir ölçü girilirse bile değer olduğu gibi (aşağı kesilerek,
  // yukarı YUVARLANMADAN) korunuyor.
  const num = Number(v) || 0;
  const kesilmis = Math.trunc(num * 10) / 10;
  return ascPadL(kesilmis.toFixed(1), n);
}
function ascDDMMYYYY(d){
  const dt = d ? new Date(d+'T00:00:00') : new Date();
  if(isNaN(dt)) return ascDDMMYYYY(null);
  const dd = String(dt.getDate()).padStart(2,'0');
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  const yyyy = dt.getFullYear();
  return `${dd}${mm}${yyyy}`;
}
function ascUp(s){ return (s||'').toLocaleUpperCase('tr'); }

// Sabit blok — örnek dosyada hep aynıydı, olduğu gibi kopyalanıyor
const ASC_GAP_140_158 = ' 0    0    0      ';           // 18 karakter
const ASC_GAP_166_174 = '000     ';                       // 8 karakter
const ASC_GAP_510_538 = '0.0     0.0     0.0     0.0 ';   // 28 karakter

// camKoduTip: kalınlık+renk'ten oluşan kod, ör. "8MM FÜME" (Optime'da
// tanımlı gerçek kod bu MU bilmiyoruz — kullanıcıdan teyit gerekiyor)
//
// custCode / firma / kisi ayrımı gerçek Opty-Win ekran görüntüleriyle DOĞRULANDI:
//   21:41  -> "Customer" (kısa kod, örn. "SRY-A") — bizde henüz karşılığı yok, boş bırakılıyor
//   65:73  -> "Q.ty" (adet) — gerçek Opty-Win ekranındaki Q.ty sütunuyla BİREBİR DOĞRULANDI
//             (513.0mm/548.0mm/553.0mm/155.0mm satırlarında ekranda "2" yazıyordu, dosyada da tam bu konumda "2" çıktı)
//   177:209 -> "Note 1" = Firma/Bayi adı (örn. "SARAY CAMBALKON")
//   209:241 -> "Note 2" = Kişi/Müşteri adı (örn. "ADEM")
//   241:273 -> "Note 3" = parça notu (BACA/MENFEZ vb.) — bu kısım TAHMİNİ, teyit edilmedi
function ascBuildRow(itemNo, camKoduTip, custCode, w, h, qty, ekBilgi, not1, firma, kisi, girisTarihi, teslimTarihi, compMatCode){
  const itemNoStr4 = ascPadL(itemNo, 4);
  const itemNoStr8 = ascPadL(itemNo, 8);
  let row = '';
  // Not: bu alan HER ZAMAN tam 17 karakter olmalı — satır uzunluğu 1049'dan
  // sapınca (Isıcam kodu için genişletilmişti) Optime import hatası verdi, geri alındı.
  row += ascPadR(camKoduTip, 17) + itemNoStr4;        // 0:21
  row += ascPadR(ascUp(custCode), 20);                 // 21:41 (Optime'daki "Customer" kısa kodu)
  row += ascPadR('', 12);                              // 41:53 (bilinmiyor) — denendi, Notes kutusuna yansımadı, boş bırakılıyor
  // 53:56 — Grinding. Kural: camın en küçük kenarı (En/Boy'un küçüğü) 300mm'nin
  // altındaysa 3mm, 300mm ve üstündeyse 1mm.
  const ascKucukKenar = Math.min(Number(w)||0, Number(h)||0);
  const ascGrinding = (ascKucukKenar > 0 && ascKucukKenar < 300) ? '3.0' : '1.0';
  row += ascPadL(ascGrinding, 3);                      // 53:56
  row += ' '.repeat(7);                                // 56:63
  row += '0Y';                                         // 63:65
  row += ascPadL(String(qty||1), 8);                   // 65:73 — Q.ty (adet), artık gerçek sayı yazılıyor
  row += '(null)';                                      // 73:79
  row += ascNum1(w, 10);                               // 79:89
  row += ascNum1(h, 8);                                // 89:97
  // 97:140 — gerçek Optime exportlarıyla (birebir karşılaştırma) doğrulandı:
  // ilk 8 karakter (97:105) boş kalmalı (dokununca Note1/Note2 bozuluyor, kanıtlı),
  // 105:140 arası ise Optime'ın TEKLİ "Notes" kutusunun karşılığı.
  row += ascPadR('', 8);                               // 97:105 — dokunma
  row += ascPadR(ascUp(not1), 35);                     // 105:140 — Notes kutusu
  row += ASC_GAP_140_158;                              // 140:158
  row += girisTarihi;                                  // 158:166
  row += ASC_GAP_166_174;                              // 166:174
  row += '0.0';                                        // 174:177
  row += ascPadR(ascUp(firma), 32);                    // 177:209 — Note 1: firma/bayi adı (DOĞRULANDI)
  row += ascPadR(ascUp(kisi), 32);                      // 209:241 — Note 2: kişi/müşteri adı (DOĞRULANDI)
  row += ascPadR('', 32);                               // 241:273 — Note 3: bilerek boş (parça notu artık sadece Notes'a yazılıyor)
  row += ' '.repeat(510-273);                           // 273:510 — Note 4+ (kullanılmıyor)
  row += ASC_GAP_510_538;                              // 510:538
  // 538:905 — gerçek Optime exportlarıyla doğrulandı: 857:897 arası ekranda görülen
  // ayrı "Comp. Mat. Code" kutusunun karşılığı (Isıcam'da "4MM FÜME \ 22 \ 4MM FÜME"
  // gibi tam biçimli birleşik kod burada duruyor; normal camda kalınlık+renk).
  row += ' '.repeat(319);                              // 538:857 — bilinmiyor, boş
  row += ascPadR(ascUp(compMatCode||''), 40);          // 857:897 — Comp. Mat. Code
  row += ' '.repeat(8);                                // 897:905 — dokunma
  row += teslimTarihi;                                 // 905:913
  row += itemNoStr8 + '(null)' + ' '.repeat(122);       // 913:1049
  return row;
}

// Bayi adından + müşteri adından Optime'daki "Customer" kısa kodunu üretir:
// {bayi kısaltması}-{müşteri kısaltması}. Bayi kısaltması: ilk kelimenin ilk harfi
// aynen korunur, geri kalanından sesli harfler atılır (örn. "SARAY CAMBALKON" -> "SRY",
// "ARŞAH CAMBALKON" -> "ARŞH" — gerçek Optime örnekleriyle doğrulandı). Müşteri kısaltması:
// adın her kelimesinin ilk harfi (örn. "Üzeyfe Tekelei" -> "ÜT" — gerçek örnekle doğrulandı).
const ASC_VOWELS = 'AEIİOÖUÜ';
function ascBayiKisaltma(bayiAdi){
  const ilkKelime = (bayiAdi||'').trim().split(/\s+/)[0] || '';
  if(!ilkKelime) return '';
  const harfler = ilkKelime.toLocaleUpperCase('tr').split('');
  let kod = harfler[0]; // ilk harf her zaman korunur (sesli olsa bile)
  for(let i=1;i<harfler.length;i++){
    if(!ASC_VOWELS.includes(harfler[i])) kod += harfler[i];
  }
  return kod;
}
function ascMusteriKisaltma(musteriAdi){
  return (musteriAdi||'').trim().split(/\s+/).filter(Boolean)
    .map(kelime=>kelime[0]).join('').toLocaleUpperCase('tr');
}
function ascCustCode(bayiAdi, musteriAdi){
  const bayiK = ascBayiKisaltma(bayiAdi);
  const musteriK = ascMusteriKisaltma(musteriAdi);
  if(!bayiK) return '';
  return musteriK ? `${bayiK}-${musteriK}` : `${bayiK}-A`;
}

function ascCamKodu(o){
  // Isıcam (çift cam) ise Optime'ın beklediği bileşik format:
  // "{1.cam kalınlığı}MM {1.renk} \ {çıta} \ {2.cam kalınlığı}MM {2.renk}"
  // Örn: "4MM FÜME \ 22 \ 4MM FÜME" — Opty-Win ekranındaki "Comp. Mat. Code" ile teyit edildi.
  const isicamMatch = (o.renk||'').match(/^Isıcam:\s*([\d+]+)\s+(.+)$/i);
  if(isicamMatch){
    const yapi = isicamMatch[1].split('+');
    const renkler = isicamMatch[2].split('+');
    const t1 = yapi[0] || '', cita = yapi[1] || '', t2 = yapi[2] || yapi[0] || '';
    const r1 = ascUp(renkler[0]||''), r2 = ascUp(renkler[1]||renkler[0]||'');
    // Alan 17 karakterle sınırlı olduğu için boşluksuz/kısa format kullanılıyor
    return `${t1}${r1}\\${cita}\\${t2}${r2}`;
  }
  // Kalınlık ürün açıklamasından ayıklanıyor (Excel çıktısındaki gibi),
  // renk doğrudan "renk" seçicisinden geliyor.
  const kalinlik = parseKalinlik(o.product_label).replace('MM','MM ');
  const renk = ascUp(o.renk || parseCamAdi(o.product_label));
  return `${kalinlik}${renk}`.trim();
}

// Ekranda ayrı gösterilen "Comp. Mat. Code" alanı için TAM biçimli kod (17 karakter
// sınırı yok, gerçek Optime örneğiyle doğrulandı: "4MM DC \ 22 \ 4MM FÜME" gibi).
// Optime bu string'i kendi "1st Material / 1st Spacers / 2nd Material" alanlarına
// otomatik ayrıştırıyor gibi görünüyor.
function ascCompMatCode(o){
  const isicamMatch = (o.renk||'').match(/^Isıcam:\s*([\d+]+)\s+(.+)$/i);
  if(isicamMatch){
    const yapi = isicamMatch[1].split('+');
    const renkler = isicamMatch[2].split('+');
    const t1 = yapi[0] || '', cita = yapi[1] || '', t2 = yapi[2] || yapi[0] || '';
    const r1 = ascUp(renkler[0]||''), r2 = ascUp(renkler[1]||renkler[0]||'');
    return `${t1}MM ${r1} \\ ${cita} \\ ${t2}MM ${r2}`;
  }
  const kalinlik = parseKalinlik(o.product_label);
  const renk = ascUp(o.renk || parseCamAdi(o.product_label));
  return `${kalinlik}${renk}`;
}

// Bir siparişin parça satırlarını üretir (itemNo startNo'dan başlar) — hem
// tekli hem toplu ASC aktarımında ortak kullanılıyor
function ascRowsForOrder(o, startNo){
  const lines = o.lines || [];
  const firma = o.bayi_adi || '';           // Note 1
  const kisi = o.cust_name || '';            // Note 2
  const custCode = (o.asc_customer_code && o.asc_customer_code.trim())
    ? ascUp(o.asc_customer_code.trim())               // sipariş girilirken elle yazılmışsa onu kullan
    : ascCustCode(firma, kisi);                        // yoksa bayi+müşteri adından otomatik üret
  const camKodu = ascCamKodu(o);
  const compMatCode = ascCompMatCode(o);
  const ekBilgi = [o.temper, o.edge].filter(Boolean).join(' - ');
  const girisTarihi = ascDDMMYYYY(o.created_at ? o.created_at.slice(0,10) : null);
  const teslimTarihi = ascDDMMYYYY(o.due);
  // Aynı En x Boy x Not değerine sahip satırlar TEK satırda birleştirilip adetleri
  // toplanıyor, gerçek Q.ty (65:73) alanına yazılıyor — artık 100 parça = 1 satır.
  // Delikli/menfezli satırlar birleştirilmiyor (her biri kendine özel, ayrı kalmalı).
  const gruplar = new Map();
  const ayriSatirlar = [];
  lines.forEach(l=>{
    const qty = parseInt(l.qty)||1;
    const not1 = ascNotesKisalt(l.note);
    if(l.dm && l.dm.length){
      ayriSatirlar.push({w:l.w, h:l.h, qty, not1});
      return;
    }
    const key = `${l.w}|${l.h}|${not1}`;
    if(gruplar.has(key)) gruplar.get(key).qty += qty;
    else gruplar.set(key, {w:l.w, h:l.h, qty, not1});
  });
  const pieces = [...gruplar.values(), ...ayriSatirlar];
  if(pieces.length===0) pieces.push({w:0,h:0,qty:1,not1:''});
  return pieces.map((r,i)=>ascBuildRow(startNo+i, camKodu, custCode, r.w, r.h, r.qty, ekBilgi, r.not1, firma, kisi, girisTarihi, teslimTarihi, compMatCode));
}

// Hazır satırlardan ASC dosyasını indirir (başlık + adet satırı + parça satırları)
function downloadASCText(rows, headerName, girisTarihiForHeader, filenameFallback){
  // Son 4 hanede referans dosyada "18V4" gibi bilinmeyen bir kod vardı, biz hep boş
  // bırakıyorduk — Note1/Note2'nin okunmaması bununla ilgili olabilir mi diye TEST
  // amaçlı aynen ekliyoruz (sabit mi, hesaplanan bir değer mi, henüz bilmiyoruz).
  const headerLine = ascPadR(ascUp(headerName), 32) + girisTarihiForHeader + ' '.repeat(14) + '18V4';
  const countLine = ascPadL(rows.length, 8);
  const fullText = [headerLine, countLine, ...rows].join('\r\n') + '\r\n';
  const bytes = encodeCP1254(fullText);
  const blob = new Blob([bytes], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = ascUp(headerName).replace(/[^A-Z0-9ÇĞİÖŞÜ ]/g,'').trim().replace(/\s+/g,'_') || filenameFallback || 'SIPARIS';
  a.href = url; a.download = `${safeName}.ASC`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function exportOrderToASC(o){
  const custName = o.bayi_adi || o.cust_name || 'MUSTERI';
  const girisTarihi = ascDDMMYYYY(o.created_at ? o.created_at.slice(0,10) : null);
  const rows = ascRowsForOrder(o, 1);
  downloadASCText(rows, custName, girisTarihi, 'SIPARIS');
}

/* =========================================================
   ETİKET YAZDIRMA — Optime'ın Note1/Note2'yi okuyup okumamasından
   tamamen bağımsız: kendi etiketimizi kendimiz üretip A4 sticker
   sayfasına basıyoruz. Her ölçü satırı (parça) için ayrı etiket.
   ========================================================= */
function etiketCamBilgisi(o, l){
  // Excel export'taki aynı mantık: Isıcam ise renk/yapı ayrılır, Temp./Rodaj formatlanır.
  // Satır (l) verilmişse ve SİPARİŞİN KENDİSİ Isıcam siparişiyse ve o satırın kendine özel
  // Isıcam'ı varsa (mini etiketten değiştirilmişse), sipariş genelindeki Isıcam yerine
  // SATIRIN kendi Isıcam'ı kullanılır. Sipariş Isıcam değilse, satırdaki eski/varsayılan
  // isicam verisi (her satırda arka planda hep dolu tutulan alan) tamamen yok sayılır —
  // yoksa normal cam siparişleri de "Isıcam" gibi görünürdü.
  const orderIsIsicam = /^Isıcam:/i.test(o.renk||'');
  const lineIsicam = (orderIsIsicam && l && l.isicam && l.isicam.renk) ? l.isicam : null;
  const isicamMatch = lineIsicam ? null : (o.renk||'').match(/^Isıcam:\s*([\d+]+)\s+(.+)$/i);
  const kalinlik = parseKalinlik(o.product_label);
  const camRengi = lineIsicam ? lineIsicam.renk
    : isicamMatch ? isicamMatch[2] : (o.renk || parseCamAdi(o.product_label));
  const temperStr = (o.temper||'').toLocaleUpperCase('tr');
  let tempPart;
  if(temperStr.includes('TEMPERSİZ')) tempPart = 'Tempersiz';
  else if(o.temper) tempPart = ['Temp.', o.edge].filter(Boolean).join('/');
  else tempPart = o.edge || '';
  const yapiPart = lineIsicam ? (`${lineIsicam.dis||4}+${lineIsicam.bosluk||12}+${lineIsicam.ic||4}`)
    : isicamMatch ? isicamMatch[1] : kalinlik;
  const camOzelligi = [yapiPart, tempPart].filter(Boolean).join(' · ');
  return { camRengi, camOzelligi };
}

// Poz/Delik notu Optime'ın "Notes" alanına yazılırken kullanıcının belirttiği kurala göre kısaltılır:
// "menfez" geçiyorsa "MNF", "delik" veya "baca" geçiyorsa "DLK", başka her şey (örn. "düz")
// kullanıcının yazdığı hâliyle aktarılır (büyük harfe çevirme zaten ascBuildRow'da ascUp ile yapılıyor).
function ascNotesKisalt(note){
  if(!note) return '';
  const n = note.toLocaleLowerCase('tr');
  if(n.includes('menfez')) return 'MNF';
  if(n.includes('delik') || n.includes('baca')) return 'DLK';
  return note;
}

function delikEtiketMetni(note){
  if(!note) return { etiket: 'DELİK', deger: '' };
  const n = note.toLocaleLowerCase('tr');
  if(n.includes('menfez')) return { etiket: 'DELİK', deger: 'MENFEZ' };
  if(n.includes('baca')) return { etiket: 'DELİK', deger: 'BACA' };
  if(n.includes('delik')) return { etiket: 'DELİK', deger: 'DELİK' };
  // Delik/menfez/baca geçmeyen genel notlar (örn. "Düz") — "DELİK:" diye
  // yanlış bir önek koymak yerine nötr "NOT:" etiketiyle gösterilir.
  return { etiket: 'NOT', deger: note.toLocaleUpperCase('tr') };
}

// Bir siparişin tüm etiket kartlarının HTML'ini üretir (adete göre tekrarlı) —
// hem tekli hem toplu yazdırmada ortak kullanılır.
function buildEtiketHtmlForOrder(o){
  const lines = o.lines || [];
  const wsName = profile.workshop_name || profile.full_name || 'Atölye';
  const firma = o.bayi_adi || '';
  const kisi = o.cust_name || '';
  return lines.flatMap(l=>{
    const adet = parseInt(l.qty)||1;
    const { camRengi, camOzelligi } = etiketCamBilgisi(o, l);
    const delik = delikEtiketMetni(l.note);
    const sekilMetni = l.sekilli ? 'ŞKL' : '';
    return Array.from({length: adet}, (_, i) => `
    <div class="etk">
      <div class="etk-brand">${wsName}</div>
      <div class="etk-olcu">${l.w} × ${l.h} <span class="etk-mm">mm</span> <span class="etk-sayac">${i+1}/${adet}</span></div>
      <div class="etk-cam">${[camRengi, camOzelligi].filter(Boolean).join(' · ')}</div>
      <div class="etk-bottom">
        <div class="etk-sekil">
          ŞEKİL${sekilMetni ? ': '+sekilMetni : ''}
          ${l.sekilFotoUrl ? `<img src="${l.sekilFotoUrl}" class="etk-sekil-foto">` : ''}
        </div>
        <div class="etk-sekildelik">
          <div class="etk-delik-buyuk">${delik.deger ? delik.etiket+': '+delik.deger : delik.etiket}</div>
        </div>
      </div>
      <div class="etk-altfirma">
        <div class="etk-firma">${firma}</div>
        ${kisi && kisi!==firma ? `<div class="etk-kisi">👤 ${kisi}</div>` : ''}
      </div>
    </div>
  `);
  }).join('');
}

// Hazır etiket HTML'ini (tek ya da birden çok siparişten birleşik) A4 sayfa
// dizisi olarak açar ve yazdırma penceresini tetikler. 10'lu ızgara sipariş
// sınırı gözetmeden art arda dizildiği için, birden fazla sipariş art arda
// verilirse etiketler aynı sayfalarda birleşip fire (boş etiket alanı) azalır.
function openEtiketPrintWindow(etiketHtml){
  const win = window.open('', '_blank');
  win.document.write(`
    <!DOCTYPE html><html><head><meta charset="utf-8"><title>Etiketler</title>
    <style>
      @page { size: A4; margin: 4mm; }
      body { margin:0; font-family: Arial, sans-serif; display:flex; justify-content:center; }
      .sayfa { display:grid; grid-template-columns: repeat(2, 98mm); grid-auto-rows: 56.6mm; gap: 1mm 3mm; }
      .etk:nth-child(10n) { page-break-after: always; }
      .etk {
        width: 98mm; height: 56.6mm; box-sizing:border-box;
        padding: 5mm 5mm 3mm; display:flex; flex-direction:column;

function printEtiketler(o){
  if(!(o.lines||[]).length){ alert('Bu siparişte etiket basılacak ölçü satırı yok.'); return; }
  openEtiketPrintWindow(buildEtiketHtmlForOrder(o));
}

// TOPLU ETİKET — birden fazla siparişin etiketlerini TEK sayfa dizisinde
// art arda basar, böylece 10'luk sayfalar sipariş sınırından bağımsız dolar
// ve her sipariş kendi yarım kalan sayfasını israf etmez.
function printEtiketlerBulk(selOrders){
  const withLines = (selOrders||[]).filter(o=>(o.lines||[]).length);
  if(withLines.length===0){ alert('Seçili siparişlerde etiket basılacak ölçü satırı yok.'); return; }
  const etiketHtml = withLines.map(o=>buildEtiketHtmlForOrder(o)).join('');
  openEtiketPrintWindow(etiketHtml);
}


// TOPLU ETİKET arayüzü — bekleyen siparişleri işaretleme kutularıyla listeler,
// seçilenlerin toplam etiket adedine göre kaç sayfa tutacağını ve sayfanın
// ne kadarının boş (fire) kalacağını gösterir.
function renderBulkEtiket(){
  const el = document.getElementById('bulkEtiketSection');
  if(!el) return;
  const active = orders.filter(o=>o.status < DELIVERED_INDEX && (o.lines||[]).length && isOrderIsicam(o)===(bulkCamTypeTab==='isicam') && !kesimTamamlandiMi(o));
  // Mevcut işaretleme durumunu koru — arama/filtre değişince kullanıcının elle
  // kaldırdığı tikler geri gelmesin.
  const prevChecked = {};
  el.querySelectorAll('.bulkEtkCheck').forEach(c=>{ prevChecked[c.dataset.id] = c.checked; });
  if(active.length===0){
    el.innerHTML = `<div class="pane empty-state"><div style="font-size:13px;">Etiket basılacak bekleyen sipariş yok.</div></div>`;
    return;
  }
  // ASC bölümündeki gibi, siparişler cam kalınlığına göre (8mm/6mm/5mm vb.) gruplanıp
  // ayrı kutular hâlinde gösteriliyor — hızlıca tek kalınlığı seçip diğerlerini bırakabilmek için.
  const groups = {};
  active.forEach(o=>{
    const key = parseKalinlik(o.product_label) || 'BELİRSİZ KALINLIK';
    (groups[key] = groups[key] || []).push(o);
  });
  const keys = Object.keys(groups).sort();
  el.innerHTML = keys.map(key=>`
    <div class="pane form-card bulk-asc-group" style="margin-bottom:14px;">
      <div class="bulk-asc-head"><b>${key}</b><span class="hint">${groups[key].length} sipariş</span></div>
      <div class="bulk-asc-list">
        ${groups[key].map(o=>`
          <label class="bulk-asc-item">
            <input type="checkbox" class="bulkEtkCheck" data-id="${o.id}" ${prevChecked[o.id]===false ? '' : 'checked'}>
            <span>#${o.id} · ${o.bayi_adi||''}${o.cust_name && o.cust_name!==o.bayi_adi ? ' · 👤 '+o.cust_name : ''}${o.cust_address?' · 📍'+o.cust_address:''} · ${orderPieceCount(o)} etiket</span>
          </label>`).join('')}
      </div>
    </div>`).join('') + `
    <div class="form-actions" style="margin-top:10px;">
      <button class="btn btn-primary btn-sm" id="bulkEtkPrint">🏷️ Seçilenleri birlikte yazdır</button>
      <span class="hint" id="bulkEtkHint"></span>
    </div>
  `;
  const selectedOrders = ()=>{
    const ids = Array.from(el.querySelectorAll('.bulkEtkCheck')).filter(c=>c.checked).map(c=>c.dataset.id);
    return orders.filter(o=>ids.includes(String(o.id)));
  };
  const updateHint = ()=>{
    const total = selectedOrders().reduce((s,o)=>s+orderPieceCount(o),0);
    const hintEl = document.getElementById('bulkEtkHint');
    if(!hintEl) return;
    if(total===0){ hintEl.textContent = ''; return; }
    const sayfa = Math.ceil(total/10);
    const bosluk = sayfa*10 - total;
    hintEl.textContent = `${total} etiket · ${sayfa} sayfa` + (bosluk>0 ? ` · ${bosluk} boş yer` : ' · fire yok');
  };
  el.querySelectorAll('.bulkEtkCheck').forEach(c=>{ c.onchange = updateHint; });
  updateHint();
  document.getElementById('bulkEtkPrint').onclick = ()=>{
    const sel = selectedOrders();
    if(sel.length===0){ alert('En az bir sipariş seçili olmalı.'); return; }
    printEtiketlerBulk(sel);
  };
}

  const rows = [];

      const tutar = m2 * birimFiyat;
      rows.push({
        kalinlik: parseKalinlik(o.product_label) || o.product_label || '',

      .tf-firma { font-size:14px; font-weight:600; margin-bottom:10px; line-height:1.6; }
      .tf-headwrap { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
      .tf-logo { max-width:110px; max-height:60px; object-fit:contain; }

        ${adres ? 'ADRES: '+adres : ''}<br><br>

function openTeklifPrintWindow(html){
