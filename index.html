<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CamTakip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F4F6FA;
    --border:#E3E7EF; --border-strong:#D3D9E4;
    --accent:#2F6FED; --accent-soft:rgba(47,111,237,0.08); --accent-hover:#2558C4;
    --primary:#16A34A; --primary-hover:#128A3E; --primary-soft:rgba(22,163,74,0.10);
    --amber:#D97706; --purple:#7C5CFC; --gray:#8993A4;
    --text:#151823; --text-mut:#6B7280; --text-dim:#9CA3AF; --danger:#DC2626;
    --radius:16px; --radius-sm:10px; --radius-pill:999px;
    --shadow:0 1px 2px rgba(16,24,40,0.04), 0 2px 8px rgba(16,24,40,0.05);
    --font-display:'Inter',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent); color:#fff;}
  ::placeholder{color:var(--text-dim);}
  .shell{max-width:1400px; margin:0 auto; padding:24px 20px 80px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 20px; box-shadow:var(--shadow);}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:32px; height:32px; flex-shrink:0;}
  .brand-name{font-family:var(--font-display); font-weight:800; font-size:18px; letter-spacing:-0.01em; color:var(--text);}
  .brand-sub{font-size:12px; color:var(--accent); font-weight:600; margin-top:1px;}
  .user-chip{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-mut);}
  .user-chip b{color:var(--text);}
  .role-badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:var(--radius-pill); background:var(--accent-soft); color:var(--accent); text-transform:uppercase; letter-spacing:0.02em;}
  h1,h2,h3{font-family:var(--font-display); margin:0;}
  .section-eyebrow{font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; margin-top:26px; display:flex; align-items:center; gap:10px; font-weight:700;}
  .section-eyebrow::before{content:none;}
  .pane{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); position:relative;}
  .pane::before, .pane::after{content:none;}
  .form-card{padding:22px 22px 20px; margin-bottom:20px;}
  details.collapsible{padding:0;}
  details.collapsible summary{cursor:pointer; padding:14px 20px; font-family:var(--font-display); font-weight:700; font-size:13.5px; color:var(--text); list-style:revert; user-select:none;}
  details.collapsible summary:hover{color:var(--accent);}
  details.collapsible summary .hint{font-weight:500; margin-left:4px;}
  details.collapsible .collapsible-body{padding:0 20px 20px;}
  .field-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:12px;}
  .field-grid.two{grid-template-columns:1fr 1fr;}
  .field-grid.three{grid-template-columns:1fr 1fr 1fr;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12px; color:var(--text-mut); font-weight:600;}
  .field input, .field select, .field textarea{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); padding:10px 12px; font-size:14px; font-family:var(--font-body); outline:none; width:100%;}
  .field textarea{resize:vertical; min-height:38px;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 3px var(--accent-soft);}
  .seg{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-pill); padding:4px;}
  .step-panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow);}
  .step-panel h3{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); margin:0 0 14px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .step-panel h3::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); flex-shrink:0;}
  .qty-stepper{display:flex; align-items:center; border:1.5px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; width:fit-content;}
  .qty-stepper button{width:38px; height:42px; border:none; background:var(--surface-2); color:var(--text); font-size:18px; cursor:pointer; font-weight:700;}
  .qty-stepper button:hover{background:var(--accent-soft); color:var(--accent);}
  .qty-stepper input{border:none; width:56px; text-align:center; font-size:15px; height:42px; padding:0; background:transparent; color:var(--text); font-family:var(--font-body);}
  .qty-stepper input:focus{outline:none;}
  .seg button{flex:1; border:none; background:transparent; color:var(--text-mut); font-family:var(--font-body); font-weight:600; font-size:13px; padding:8px 12px; border-radius:var(--radius-pill); cursor:pointer;}
  .seg button.active{background:var(--accent); color:#fff; box-shadow:0 1px 2px rgba(47,111,237,0.35);}
  .btn{font-family:var(--font-body); font-weight:600; font-size:13.5px; border-radius:var(--radius-sm); padding:10px 18px; cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--text); display:inline-flex; align-items:center; gap:7px;}
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn-primary{background:var(--primary); color:#fff; border-color:var(--primary); font-weight:700; box-shadow:0 1px 2px rgba(22,163,74,0.3);}
  .btn-primary:hover{background:var(--primary-hover); color:#fff; border-color:var(--primary-hover);}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-sm{padding:6px 12px; font-size:12px; border-radius:var(--radius-pill);}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}
  .form-actions{display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap;}
  .hint{font-size:12px; color:var(--text-dim);}
  .err{font-size:12px; color:var(--danger);}
  .lines-wrap{border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; margin-bottom:12px; background:var(--surface-2);}
  .line-row{display:grid; grid-template-columns:0.8fr 0.8fr 55px 1.1fr 40px 85px 120px 44px 30px; gap:8px; align-items:center; margin-bottom:8px;}
  .line-sekilli{display:flex; align-items:center; gap:2px; font-size:10px; color:var(--text-dim); cursor:pointer; white-space:nowrap;}
  .line-sekilli input{width:14px; height:14px; margin:0;}
  .line-sekil-foto{display:flex; align-items:center; gap:8px; margin:-4px 0 10px 0; padding-left:4px;}
  .sekil-thumb{width:44px; height:44px; object-fit:cover; border-radius:6px; border:1px solid var(--border);}
  .line-row input{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); padding:9px 10px; font-size:13.5px; font-family:var(--font-body); outline:none; width:100%;}
  .line-row input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .line-m2{font-size:12.5px; color:var(--accent); text-align:right; white-space:nowrap; font-weight:700;}
  .line-del{background:transparent; border:none; color:var(--text-dim); cursor:pointer; font-size:16px; padding:4px; border-radius:var(--radius-pill);}
  .line-del:hover{color:var(--danger); background:rgba(220,38,38,0.08);}
  .line-delik-sablon{background:transparent; border:1px solid var(--border); color:var(--text-dim); cursor:pointer; font-size:13px; padding:4px 6px; border-radius:var(--radius-sm); white-space:nowrap;}
  .line-delik-sablon.has-data{color:var(--accent); border-color:var(--accent);}
  .line-delik-sablon:hover{color:var(--accent); border-color:var(--accent);}
  .line-labels{display:grid; grid-template-columns:0.8fr 0.8fr 55px 1.1fr 40px 85px 120px 44px 30px; gap:8px; margin-bottom:6px;}
  .line-labels span{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; font-weight:700;}
  .lines-total{display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}
  .lines-total-val{font-family:var(--font-display); font-size:18px; font-weight:800; color:var(--accent);}
  .list-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .filter-row{display:flex; gap:6px; flex-wrap:wrap;}
  .filter-chip{font-size:12px; font-weight:600; padding:6px 13px; border-radius:var(--radius-pill); border:1px solid var(--border); color:var(--text-mut); cursor:pointer; background:var(--surface);}
  .filter-chip.active{border-color:var(--accent); color:#fff; background:var(--accent);}
  .order-card{padding:16px 18px; margin-bottom:10px; display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;}
  .order-glyph{width:46px; height:46px; flex-shrink:0; margin-top:2px;}
  .order-body{flex:1; min-width:220px;}
  .order-top{display:flex; align-items:baseline; gap:10px; margin-bottom:3px; flex-wrap:wrap;}
  .order-id{font-size:11.5px; color:var(--text-dim); font-weight:600;}
  .order-cust{font-weight:700; font-size:14.5px; font-family:var(--font-display);}
  .order-props{font-size:12.5px; color:var(--text-mut); margin-bottom:6px;}
  .order-props b{color:var(--accent); font-weight:700;}
  .order-lines{display:flex; flex-direction:column; gap:2px; margin-bottom:6px;}
  .order-line{font-size:12.5px; display:flex; gap:10px;}
  .order-line .lm2{color:var(--text-mut);}
  .order-note{font-size:12px; color:var(--text-mut); margin-bottom:6px;}
  .order-m2total{font-size:12.5px; color:var(--accent); font-weight:700; margin-bottom:8px;}
  .order-due{font-size:11.5px; color:var(--text-mut); font-weight:600; display:flex; align-items:center; gap:5px; white-space:nowrap;}
  .status-pill{font-size:11.5px; font-weight:700; padding:5px 13px; border-radius:var(--radius-pill); white-space:nowrap; border:1px solid transparent;}
  .st-0{background:#EEF0F4; color:var(--gray); border-color:var(--border);}
  .st-1{background:#EAF1FE; color:var(--accent); border-color:#C9DDFC;}
  .st-2{background:#FDF1E0; color:var(--amber); border-color:#F3DDB0;}
  .st-3{background:#F1EDFE; color:var(--purple); border-color:#DDD3FC;}
  .st-4{background:#E7F8EE; color:var(--primary); border-color:#BEEACF;}
  .st-delivered{background:var(--primary); color:#fff; border-color:var(--primary);}
  .progress-track{width:100%; height:4px; background:var(--border); border-radius:var(--radius-pill); overflow:hidden; margin-top:8px;}
  .progress-fill{height:100%; background:var(--accent); border-radius:var(--radius-pill);}
  .order-actions{display:flex; gap:6px; align-items:center; margin-left:auto;}
  .empty-state{padding:48px 20px; text-align:center; color:var(--text-mut);}
  .stat-strip{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:20px;}
  .stat-card{padding:14px; text-align:left;}
  .stat-num{font-family:var(--font-display); font-size:26px; font-weight:800;}
  .stat-label{font-size:11px; color:var(--text-mut); font-weight:600; margin-top:5px;}
  .auth-wrap{max-width:420px; margin:60px auto 0;}
  .auth-tabs{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-pill); padding:4px; margin-bottom:20px;}
  .auth-tabs button{flex:1; border:none; background:transparent; color:var(--text-mut); font-weight:600; font-size:13px; padding:9px; border-radius:var(--radius-pill); cursor:pointer;}
  .auth-tabs button.active{background:var(--accent); color:#fff;}
  .logo-center{display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:28px;}
  .logo-center .brand-name{font-size:24px;}
  .loading-screen{text-align:center; padding:80px 20px; color:var(--text-mut); font-size:13px;}
  @media (max-width:640px){
    .field-grid, .field-grid.three{grid-template-columns:1fr 1fr;}
    .stat-strip{grid-template-columns:repeat(2,1fr);}
    .order-actions{width:100%; justify-content:flex-end; margin-left:0;}
    .line-row, .line-labels{grid-template-columns:1fr 1fr 38px 32px 68px 30px 28px;}
    .line-row .line-m2{display:none;}
    .line-row input[data-field="note"]{display:none;}
    .line-labels span:nth-child(4), .line-labels span:nth-child(6){display:none;}
    .line-isicam-compact{font-size:9.5px !important; padding:3px 4px !important;}
    .line-sekilli{font-size:9px !important;}
  }  .bulk-asc-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .bulk-asc-head .btn{margin-left:auto;}
  .bulk-asc-list{display:flex; flex-direction:column; gap:4px;}
  .bulk-asc-item{display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 2px; border-radius:6px;}
  .bulk-asc-item:hover{background:rgba(47,111,237,0.06);}
  .bulk-asc-item input{width:15px; height:15px;}

/* --- Duşakabin maliyet hesaplayıcı --- */
.dims-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.dims-row.single{grid-template-columns:1fr;}
.kutu-toggle{display:flex; gap:8px; flex-wrap:wrap;}
.kutu-btn{flex:1; min-width:90px; padding:10px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font-body); transition:.15s;}
.kutu-btn:hover{background:var(--accent-soft);}
.kutu-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.dm-side-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.kutu-btn:disabled{opacity:.4; cursor:not-allowed;}
.dk-result{background:linear-gradient(160deg,#151823 0%, #22273A 100%); border-radius:var(--radius); padding:20px; color:#fff;}
.dk-result .result-top{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.dk-result .result-title{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#8fb4f0; font-weight:800;}
.dk-result .result-model{font-size:14px; color:rgba(255,255,255,.65);}
.dk-result .maliyet-line{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:rgba(255,255,255,.06); border-radius:10px; margin-bottom:14px; border:1px solid rgba(255,255,255,.08);}
.dk-result .maliyet-line .l{font-size:13px; color:rgba(255,255,255,.7);}
.dk-result .maliyet-line .v{font-size:17px; font-weight:800; font-variant-numeric:tabular-nums;}
.dk-result .price-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
.dk-result .price-grid.single{grid-template-columns:1fr;}
@media(max-width:640px){.dk-result .price-grid{grid-template-columns:1fr;}}
.dk-result .price-card{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:14px 12px; text-align:left;}
.dk-result .price-card .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle;}
.dk-result .dot.parlak{background:#c9d3d6;}
.dk-result .dot.siyah{background:#2b2f33; box-shadow:0 0 0 2px rgba(255,255,255,.15);}
.dk-result .dot.altin{background:#c8973f;}
.dk-result .price-card .lbl{font-size:11.5px; color:rgba(255,255,255,.75); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.dk-result .price-card .amt{font-size:20px; font-weight:800; margin-top:6px; font-variant-numeric:tabular-nums;}
.dk-result .price-card .amt .cur{font-size:13px; font-weight:600; opacity:.7;}
.dk-result .footnote{margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.1); font-size:11.5px; color:rgba(255,255,255,.5); line-height:1.6;}
.dk-result .badge{display:inline-block; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,.12); color:#fff;}
.dk-result .badge.interp{background:#fdf1e2; color:#b8722f;}
.dk-result .empty-state{text-align:center; padding:30px 16px; color:rgba(255,255,255,.6); font-size:13px;}
.hint.warn{color:#b8722f;}
.hint.ok{color:#2f8a56;}
</style>
</head>

<script>
const SETUP_MISSING = SUPABASE_URL.includes('BURAYA') || SUPABASE_ANON_KEY.includes('BURAYA');
const sb = SETUP_MISSING ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const OLCU_OKU_FN_URL = SUPABASE_URL + '/functions/v1/olcu-oku';

// Sessizce başarısız olabilecek Supabase işlemlerini (silme/güncelleme/aç-kapa
// gibi status/hata alanı gösterilmeyen butonlarda) kullanıcıya bildirmek için
// ortak yardımcı. true dönerse çağıran fonksiyon işlemi durdurmalı.
function sbCheck(error, aciklama){
  if(!error) return false;
  console.error(aciklama||'Supabase hatası', error);
  alert((aciklama ? aciklama+'\n\n' : '') + 'Hata: ' + error.message);
  return true;
}
// RLS bir işlemi (delete/update) sessizce engellediğinde Postgres/PostgREST
// "hata" döndürmez, sadece 0 satır etkiler. Bunu yakalamak için çağıran
// tarafta .select() eklenip dönen "data" dizisinin uzunluğuna bakılmalı.
// true dönerse çağıran fonksiyon işlemi durdurmalı.
function sbCheckRow(data, error, aciklama){
  if(sbCheck(error, aciklama)) return true;
  if(!data || data.length===0){
    console.warn(aciklama||'İşlem 0 satırı etkiledi (muhtemelen RLS engelledi)');
    alert((aciklama ? aciklama+'\n\n' : '') + 'Bu işlem uygulanamadı (yetkin olmayabilir ya da kayıt zaten değişmiş). Lütfen sayfayı yenileyip tekrar dene.');
    return true;
  }
  return false;
}

function fmtM2(n){ return n.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' m²'; }

// Not metnini HTML'e güvenle basar, içindeki http(s) linkleri (müşterinin eklediği
// Excel/foto ek dosyaları gibi) tıklanabilir hale getirir.
function linkifyNote(text){
  if(!text) return '';
  const esc = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  return esc.replace(/(https?:\/\/[^\s<]+)/g, url=>`<a href="${url}" target="_blank" rel="noopener">🔗 dosyayı aç</a>`);
}
function lineM2(l){ return ((parseFloat(l.w)||0) * (parseFloat(l.h)||0) / 1000000) * (parseInt(l.qty)||0); }
function linesTotalM2(lines){ return lines.reduce((s,l)=>s+lineM2(l), 0); }
function fmtDate(d){
  if(!d) return 'Belirtilmedi';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('tr-TR', {day:'2-digit', month:'short'});
}
function paneGlyph(lines){
  const first = (lines && lines[0]) || {w:1,h:1};
  const w = Math.max(parseFloat(first.w)||1,1), h = Math.max(parseFloat(first.h)||1,1);
  const scale = 30 / Math.max(w,h);
  const rw = Math.max(w*scale,8), rh = Math.max(h*scale,8);
  const x=(44-rw)/2, y=(44-rh)/2;
  return `<svg width="44" height="44" viewBox="0 0 44 44" fill="none"><rect x="${x}" y="${y}" width="${rw}" height="${rh}" rx="1.5" fill="rgba(47,111,237,0.08)" stroke="#2F6FED" stroke-width="1.3"/></svg>`;
}

  `;
  document.getElementById('atLogin').onclick = ()=>{ authMode='login'; renderAuth(); };
  document.getElementById('atSignup').onclick = ()=>{ authMode='signup'; renderAuth(); };
  if(authMode==='signup'){
    document.querySelectorAll('.seg[data-group="authRole"] button').forEach(b=>{
      b.onclick = ()=>{ authRole = b.dataset.val; renderAuth(); };
    });
  }
  document.getElementById('a_submit').onclick = handleAuthSubmit;
}

async function handleAuthSubmit(){
  const email = document.getElementById('a_email').value.trim();
  const pass = document.getElementById('a_pass').value;
  const errEl = document.getElementById('a_err');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'E-posta ve şifre gerekli.'; return; }

  if(authMode === 'login'){
    const {data, error} = await sb.auth.signInWithPassword({email, password:pass});
    if(error){ errEl.textContent = 'Giriş başarısız: ' + error.message; return; }
    await afterAuth();
  } else {
    const name = document.getElementById('a_name').value.trim();
    const ws = document.getElementById('a_ws') ? document.getElementById('a_ws').value.trim() : '';
    if(!name){ errEl.textContent = 'Ad soyad gerekli.'; return; }
    const {data, error} = await sb.auth.signUp({email, password:pass});
    if(error){ errEl.textContent = 'Kayıt başarısız: ' + error.message; return; }
    const uid = data.user ? data.user.id : (data.session ? data.session.user.id : null);
    if(uid){
      const {error: profileErr} = await sb.from('profiles').insert({id:uid, full_name:name, role:authRole, workshop_name: authRole==='satici'?ws:null});
      if(profileErr){
        errEl.textContent = 'Hesap oluştu ama profil kaydedilemedi: ' + profileErr.message + ' — lütfen destekle iletişime geçin.';
        return;
      }
    }
    if(data.session){
      await afterAuth();
    } else {
      errEl.style.color = 'var(--accent)';
      errEl.textContent = 'Kayıt alındı. E-postanızı onayladıktan sonra giriş yapabilirsiniz.';
    }
  }
}

/* =========================================================
   POST-AUTH BOOTSTRAP
   ========================================================= */
async function afterAuth(){
  const {data:{session:s}} = await sb.auth.getSession();
  session = s;
  if(!session){ renderAuth(); return; }
  const {data:p, error} = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if(error || !p){ renderAuth(); return; }
  profile = p;
  if(profile.role === 'satici') await bootWorkshop();
  else await bootCustomer();
  setupRealtime();
}

/* =========================================================
   CANLI GÜNCELLEME (Realtime) — yeni sipariş gelince sayfayı
   yenilemeye gerek kalmadan listeler otomatik güncellensin diye.
   NOT: Bunun çalışması için Supabase panelinde Database → Replication
   bölümünden "orders" ve "dusakabin_orders" tabloları için Realtime
   açık olmalı.
   ========================================================= */
function setupRealtime(){
  if(realtimeChannel || !profile) return;
  const isSatici = profile.role === 'satici';
  const col = isSatici ? 'seller_id' : 'customer_id';
  realtimeChannel = sb.channel('camtakip-live-'+profile.id)
    .on('postgres_changes', {event:'*', schema:'public', table:'orders', filter:`${col}=eq.${profile.id}`}, async ()=>{
      if(isSatici) await loadOrdersForSeller(); else await loadOrdersForCustomer();
      renderStats(); renderFilters(); renderList(isSatici);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'dusakabin_orders', filter:`${col}=eq.${profile.id}`}, async ()=>{
      await loadDusakabinOrders();
      renderDkList();
    })
    .subscribe();
}

function teardownRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
}

async function handleLogout(){
  teardownRealtime();
  await sb.auth.signOut();
  session = null; profile = null; orders = [];
  authMode = 'login';
  renderAuth();
}

/* Sipariş formundaki Kategori / Ürün seçim kutuları
   prefix: 'w' (satıcı hızlı sipariş) veya 'c' (müşteri ölçü bildirimi) */
function productsSource(prefix){ return prefix==='w' ? myProducts : customerProducts; }

function setupOrderProductSelects(prefix){
  const catSel = document.getElementById(prefix+'_kategori');
  const prodSel = document.getElementById(prefix+'_urun');
  if(!catSel || !prodSel) return;
  const src = productsSource(prefix).filter(p=>p.aktif!==false);
  const cats = Array.from(new Set(src.map(p=>p.kategori))).sort((a,b)=>a.localeCompare(b,'tr'));
  catSel.innerHTML = cats.length ? cats.map(c=>`<option value="${c}">${c}</option>`).join('') : `<option value="">Ürün yok</option>`;
  catSel.onchange = ()=> updateProductSelect(prefix);
  updateProductSelect(prefix);
}

// Kategori adı yazım farklarına (Isıcam / ISI CAM / ISICAM vb.) toleranslı karşılaştırma —
// boşlukları atıp büyük harfe çevirip kıyaslıyor.
function isIsicamKategori(k){
  return (k||'').toLocaleUpperCase('tr').replace(/\s+/g,'') === 'ISICAM';
}

function updateProductSelect(prefix){
  const catSel = document.getElementById(prefix+'_kategori');
  const prodSel = document.getElementById(prefix+'_urun');
  if(!catSel || !prodSel) return;
  const kategori = catSel.value;
  const src = productsSource(prefix).filter(p=>p.aktif!==false && p.kategori===kategori);
  prodSel.innerHTML = src.length ? src.map(p=>`<option value="${p.id}">${p.aciklama}</option>`).join('') : `<option value="">Bu kategoride ürün yok</option>`;
  // "Isıcam siparişi" kutusu sadece seçili kategori Isıcam ise gösterilsin.
  const wrap = document.getElementById(prefix+'_isicam_wrap');
  if(wrap){
    const show = isIsicamKategori(kategori);
    wrap.style.display = show ? 'block' : 'none';
    if(!show){
      const chk = document.getElementById(prefix+'_isicam');
      const detail = document.getElementById(prefix+'_isicam_detail');
      if(chk && chk.checked){ chk.checked = false; }
      if(detail) detail.style.display = 'none';
    }
  }
}

function renderOrderCategorySelect(){
  if(document.getElementById('w_kategori')) setupOrderProductSelects('w');
}

function selectedProduct(prefix){
  const prodSel = document.getElementById(prefix+'_urun');
  const catSel = document.getElementById(prefix+'_kategori');
  if(!prodSel || !prodSel.value) return {id:null, kategori: catSel?catSel.value:'', aciklama:''};
  const p = productsSource(prefix).find(x=>String(x.id)===String(prodSel.value));
  return p ? {id:p.id, kategori:p.kategori, aciklama:p.aciklama} : {id:null, kategori: catSel?catSel.value:'', aciklama:''};
}

function buildIsicamText(prefix){
  const dis = parseFloat(document.getElementById(prefix+'_ic1_dis').value) || 4;
  const bosluk = parseFloat(document.getElementById(prefix+'_ic1_bosluk').value) || 12;
  const ic = parseFloat(document.getElementById(prefix+'_ic1_ic').value) || 4;
  const renk = document.getElementById(prefix+'_ic1_renk').value || 'Şeffaf+Şeffaf';
  
  return `Isıcam: ${dis}+${bosluk}+${ic} ${renk}`;
}



async function saveCompanyInfo(){
  const statusEl = document.getElementById('s_status');
  const updates = {
    company_email: document.getElementById('s_email').value,
    company_phone: document.getElementById('s_phone').value,
    company_web: document.getElementById('s_web').value,
    company_address: document.getElementById('s_addr').value
  };
  statusEl.textContent = 'Kaydediliyor…';
  const {error} = await sb.from('profiles').update(updates).eq('id', profile.id);
  if(error){ statusEl.textContent = 'Hata: ' + error.message; return; }
  Object.assign(profile, updates);
  statusEl.textContent = 'Kaydedildi ✓';
  setTimeout(()=>statusEl.textContent='',2000);
}

async function submitWorkshopOrder(){
  const statusEl = document.getElementById('w_status');
  const linesClean = lineState.filter(l=>l.w && l.h && l.qty);
  if(linesClean.length===0){ statusEl.textContent = 'En az bir ölçü satırı girin.'; return; }
  const prod = selectedProduct('w');
  if(!prod.aciklama){ statusEl.textContent = 'Lütfen kataloğunuzdan bir ürün seçin (kataloğunuz boşsa yukarıdan yükleyin).'; return; }
  statusEl.textContent = editingOrderId ? 'Güncelleniyor…' : 'Kaydediliyor…';
  const row = {
    seller_id: profile.id,
    customer_id: null,
    bayi_adi: document.getElementById('w_bayi').value.trim() || null,
    cust_name: document.getElementById('w_cust').value || 'İsimsiz müşteri',
    cust_address: document.getElementById('w_addr').value || '',
    product_id: prod.id, category: prod.kategori, product_label: prod.aciklama,
    temper: segVal('w_temper'), edge: segVal('w_edge'),
    renk: document.getElementById('w_isicam').checked
      ? buildIsicamText('w')
      : segVal('w_renk'),
    lines: linesClean.map(l=>({w:parseFloat(l.w), h:parseFloat(l.h), qty:parseInt(l.qty), note:l.note||'', dm:l.dm||[], delikSablon:l.delikSablon||null, sekilli:l.sekilli||false, sekilFotoUrl:l.sekilFotoUrl||null, isicam:l.isicam||{}, fiyat:document.getElementById('w_fiyat').value||''})),
    note: document.getElementById('w_note').value,
    asc_customer_code: document.getElementById('w_asc_code').value.trim() || null,
    due: document.getElementById('w_due').value || null,
    status: 0
  };
  const wasEditing = editingOrderId;
  const {data, error} = wasEditing
    ? await sb.from('orders').update(row).eq('id', wasEditing).select()
    : await sb.from('orders').insert(row).select();
  if(error){ statusEl.textContent = 'Hata: ' + error.message; return; }
  if(wasEditing && (!data || data.length===0)){ statusEl.textContent = 'Güncellenemedi (yetkin olmayabilir). Sayfayı yenileyip tekrar dene.'; return; }
  statusEl.textContent = wasEditing ? 'Güncellendi ✓' : 'Eklendi ✓';
  editingOrderId = null;
  document.getElementById('w_submit').textContent = 'Siparişi ekle';
  document.getElementById('w_cancelEdit').style.display = 'none';
  await loadOrdersForSeller();
  renderStats(); renderFilters(); renderList(true);
  document.getElementById('w_bayi').value=''; document.getElementById('w_cust').value=''; document.getElementById('w_addr').value=''; document.getElementById('w_note').value=''; document.getElementById('w_due').value=''; document.getElementById('w_fiyat').value='';
  document.getElementById('w_isicam').checked=false; document.getElementById('w_isicam_detail').style.display='none';
  lineState=[]; addLine();
  setTimeout(()=>statusEl.textContent='',2000);
}

async function bootCustomer(){
  const {data:sellerList} = await sb.from('profiles').select('id, workshop_name, full_name').eq('role','satici');
  sellers = sellerList || [];
  if(sellers.length){ await loadProductsForSellerId(sellers[0].id); await loadDkProductsForSellerId(sellers[0].id); }
  await loadOrdersForCustomer();
  await loadDusakabinOrders();
  renderCustomer();
}

async function loadOrdersForCustomer(){
  const {data, error} = await sb.from('orders').select('*').eq('customer_id', profile.id).is('deleted_at', null).order('created_at', {ascending:false});
  orders = error ? [] : data;
}

   DUŞAKABIN KAPISI VIEW
   ========================================================= */
let dusakabinOrders = [];

async function loadDusakabinOrders(){
  const isSatici = profile.role === 'satici';
  const q = sb.from('dusakabin_orders').select('*').order('created_at', {ascending:false});
  const {data, error} = isSatici
    ? await q.eq('seller_id', profile.id)
    : await q.eq('customer_id', profile.id);

function dkIsBellaMode(){ return dkTab === 'bella'; }

function dkPopulateVariants(){

  });

function dkPopulateModels(){
  const models = Object.keys(dkCurrentGroup()[dkEls.variant.value]).sort();
  dkEls.model.innerHTML = '';
  models.forEach(m=>{
    const opt = document.createElement('option');
    opt.value = m;
    let label = m.toUpperCase();
    if(m.endsWith('_8mm')) label = m.slice(0,-4).toUpperCase() + ' · 8MM CAM';
    else if(m.endsWith('_6mm')) label = m.slice(0,-4).toUpperCase() + ' · 6MM CAM';
    opt.textContent = label;
    dkEls.model.appendChild(opt);
  });
}

function dkCurrentModelData(){
  const g = dkCurrentGroup();
  const v = g[dkEls.variant.value];
  if(!v) return null;
  return v[dkEls.model.value] || null;
}

function dkUpdateDimFields(){
  const md = dkCurrentModelData();
  if(!md) return;
  const isGrid = (md.type === 'grid2d' || md.type === 'kare');
  if(isGrid){
    dkEls.dim2Field.style.display = '';
    dkEls.dim1Label.textContent = 'En';
  } else {
    dkEls.dim2Field.style.display = 'none';
    dkEls.dim1Label.textContent = 'Ölçü (cm)';
  }
  if(md.type === 'fixed0' || md.type === 'fixed1'){
    dkEls.dim1Label.textContent = 'Ölçü (cm) — sabit ' + md.fixedDim + ' cm kenar hariç, diğer kenar';
  }
  if(dkEls.typeBadge){
    if(isGrid){
      dkEls.typeBadge.textContent = '⬛ KARE — İki ölçü girin (En + Boy)';
      dkEls.typeBadge.style.background = 'var(--accent-soft)';
      dkEls.typeBadge.style.color = 'var(--accent)';
    } else {
      dkEls.typeBadge.textContent = '📏 TEK ÖLÇÜLÜ — Tek değer girin';
      dkEls.typeBadge.style.background = 'var(--primary-soft)';
      dkEls.typeBadge.style.color = 'var(--primary)';
    }
  }
  const rows = md.rows;
  const examples = rows.slice(0,4).map(r=>r.olcu).join(', ');
  dkEls.olcuHint.textContent = rows.length + ' hazır ölçü bulunuyor (örn: ' + examples + (rows.length>4?'...':'') + '). Farklı bir ölçü girersen tahmini hesaplanır.';

  const n = rows.length;
  let q = '';
  const minN = md.type==='grid2d' ? 4 : 3;
  if(n < minN){
    q = '⚠️ Bu modelde çok az veri var (' + n + ' ölçü) — tahminler düşük güvenilirlikte, dikkatli kullan.';
  } else if(md.r2 !== null && md.r2 !== undefined && md.r2 < 0.95){
    q = '⚠️ Bu modelin ölçü-maliyet ilişkisi tam doğrusal değil (uyum skoru düşük) — kaynak dosyada muhtemelen küçük bir veri tutarsızlığı var, tahmini sonuçları amcanla teyit et.';
  } else if(md.r2 !== null && md.r2 !== undefined){
    q = '✓ ' + n + ' gerçek ölçü verisiyle doğrulanmış, güvenilir tahmin.';
  }
  dkEls.qualityHint.textContent = q;
  dkEls.qualityHint.className = 'hint' + (q.startsWith('⚠️') ? ' warn' : (q.startsWith('✓') ? ' ok' : ''));
}

function dkComputeMaliyet(md, dims){
  if(md.type === 'kare'){
    const [d1,d2] = dims;
    const mismatch = Math.abs(d1-d2) > 0.5;
    const v = (d1+d2)/2;
    const exact = !mismatch ? md.rows.find(r => Math.abs(r.dims[0]-v) <= 0.5) : null;
    if(exact) return {maliyet: exact.maliyet, exact:true, mismatch:false, row:exact};
    return {maliyet: md.coefs[0] + md.coefs[1]*v, exact:false, mismatch, row:null};
  }
  if(md.type === 'single'){
    const v = dims[0];
    const exact = md.rows.find(r => Math.abs(r.dims[0]-v) <= 0.5);
    if(exact) return {maliyet: exact.maliyet, exact:true, row:exact};
    return {maliyet: md.coefs[0] + md.coefs[1]*v, exact:false, row:null};
  }
  if(md.type === 'fixed0' || md.type === 'fixed1'){
    const v = dims[0];
    const varIdx = md.varIndex;
    const exact = md.rows.find(r => Math.abs(r.dims[varIdx]-v) <= 0.5);
    if(exact) return {maliyet: exact.maliyet, exact:true, row:exact};
    return {maliyet: md.coefs[0] + md.coefs[1]*v, exact:false, row:null};
  }
  if(md.type === 'range'){
    const v = dims[0];
    const band = md.bands.find(b => v >= b.low-0.5 && v <= b.high+0.5);
    if(band) return {maliyet: band.maliyet, exact:true, row:band};
    return {maliyet: md.coefs[0] + md.coefs[1]*v, exact:false, row:null};
  }
  // grid2d
  const exact = md.rows.find(r=>{
    if(Math.abs(r.dims[0]-dims[0])<=0.5 && Math.abs(r.dims[1]-dims[1])<=0.5) return true;
    if(Math.abs(r.dims[0]-dims[1])<=0.5 && Math.abs(r.dims[1]-dims[0])<=0.5) return true;
    return false;
  });
  if(exact) return {maliyet: exact.maliyet, exact:true, row:exact};
  const maliyet = md.coefs[0] + md.coefs[1]*dims[0] + md.coefs[2]*dims[1];
  return {maliyet, exact:false, row:null};
}

function dkBandPrice(bands, v){
  if(!bands || !bands.length) return 0;
  for(const b of bands){ if(v>=b[0]-0.5 && v<=b[1]+0.5) return b[2]; }
  const sorted = bands.slice().sort((a,b)=>a[0]-b[0]);
  if(v < sorted[0][0]) return sorted[0][2];
  return sorted[sorted.length-1][2];
}

function dkBuildYuzeyToggle(md){
  dkEls.yuzeyToggle.innerHTML = '';
  const opts = [['seffaf','Şeffaf']];
  if(md.yuzey.kumlama) opts.push(['kumlama','Kumlama']);
  if(md.yuzey.karolaj) opts.push(['karolaj','Karolaj Baskı']);
  if(md.yuzey.fume) opts.push(['fume','Füme']);
  opts.forEach(([val,label])=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'kutu-btn' + (val===yuzeySecim ? ' active':'');
    b.dataset.val = val;
    b.textContent = label;
    b.addEventListener('click', ()=>{ yuzeySecim = val; dkRender(); });
    dkEls.yuzeyToggle.appendChild(b);
  });
}

function dkRender(){
  const md = dkCurrentModelData();
  if(!md){ dkEls.resultPanel.innerHTML = '<div class="empty-state">Bu seçim için veri yok.</div>'; return; }

  const d1 = parseFloat(dkEls.dim1.value);
  const isGrid = (md.type === 'grid2d' || md.type === 'kare');
  const d2 = isGrid ? parseFloat(dkEls.dim2.value) : null;
  if(!d1 || (isGrid && !d2)){
    dkEls.resultPanel.innerHTML = '<div class="empty-state">Ölçü girince özet burada görünecek.</div>';
    dkEls.yuzeyPanel.style.display = 'none';
    dkLastCalc = null;
    return;
  }
  const dims = isGrid ? [d1,d2] : [d1];
  const adet = Math.max(1, parseInt(dkEls.adet.value)||1);

  // Kutu seçeneği bu modelde var mı? Yoksa zorla "kutusuz" yap ve butonu kilitle.
  const kutuVar = !!md.kutu;
  dkEls.kutuToggle.querySelectorAll('.kutu-btn').forEach(b=>{
    b.disabled = !kutuVar;
  });
  if(!kutuVar){ kutuSecim = 'kutusuz'; }
  dkEls.kutuToggle.querySelectorAll('.kutu-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.val === kutuSecim);
  });
  dkEls.kutuHint.textContent = kutuVar ? '' : 'Bu modelde kutu (paketleme) seçeneği kataloğda yok — sadece kutusuz seçenek kullanılabilir.';
  const kutuMetre = isGrid ? (d1+d2)/100 : (d1/100); // girilen ölçülerin toplamı, metre cinsinden

  // Cam yüzeyi / desen paneli
  let yuzeyTutari = 0, yuzeyLabel = '';
  if(md.yuzey){
    dkEls.yuzeyPanel.style.display = '';
    dkBuildYuzeyToggle(md);
    if(!md.yuzey[yuzeySecim] && yuzeySecim !== 'seffaf'){ yuzeySecim = 'seffaf'; dkBuildYuzeyToggle(md); }
    dkEls.yuzeyHint.textContent = 'Fiyat, girilen "En" ölçüsüne (ilk kutu) göre kataloğun ölçü bandından hesaplanır.';
    if(yuzeySecim !== 'seffaf'){
      yuzeyTutari = dkBandPrice(md.yuzey[yuzeySecim], d1);
      yuzeyLabel = {kumlama:'Kumlama', karolaj:'Karolaj Baskı', fume:'Füme'}[yuzeySecim];
      dkEls.desenField.style.display = '';
      dkEls.desenLabel.textContent = 'Kumlama Deseni (sadece görsel, fiyata etki etmez)';
      if(dkEls.desenSelect.dataset.filled !== 'kumlama'){
        dkEls.desenSelect.innerHTML = md.desenKumlama.map(x=>`<option>${x}</option>`).join('');
        dkEls.desenSelect.dataset.filled = 'kumlama';
      }
    } else {
      dkEls.desenField.style.display = 'none';
    }
  } else if(md.desenler){
    dkEls.yuzeyPanel.style.display = '';
    dkEls.yuzeyToggle.innerHTML = '<div class="hint" style="margin:0">Bu model mika/polistiren cam kullanır — kumlama/füme uygulanmaz, sadece hazır desen seçilir.</div>';
    dkEls.yuzeyHint.textContent = '';
    dkEls.desenField.style.display = '';
    dkEls.desenLabel.textContent = 'Desen (fiyata etki etmez)';
    if(dkEls.desenSelect.dataset.filled !== 'mika'){
      dkEls.desenSelect.innerHTML = md.desenler.map(x=>`<option>${x}</option>`).join('');
      dkEls.desenSelect.dataset.filled = 'mika';
    }
  } else {
    dkEls.yuzeyPanel.style.display = 'none';
    dkEls.desenField.style.display = 'none';
  }

  const {maliyet, exact, mismatch, row} = dkComputeMaliyet(md, dims);
  const badge = exact ? '<span class="badge">amcanın gerçek verisi</span>' : '<span class="badge interp">tahmini ölçü</span>';
  const olcuText = isGrid ? (d1+'x'+d2+' cm') : (d1+' cm');
  const mismatchNote = mismatch ? '<div style="margin-top:10px;font-size:12px;color:#f3c98a">⚠️ Bu model kare (en=boy) üretiliyor — farklı en/boy girdin, ortalaması kullanıldı.</div>' : '';

  dkLastCalc = {
    dkTab, variant: dkEls.variant.value, model: dkEls.model.value,
    olcuText, adet, maliyet, exact,
    kutuVar, kutuSecim, yuzeySecim, yuzeyLabel, yuzeyTutari,
    isBella: dkIsBellaMode()
  };

  if(dkIsBellaMode()){
    // Tam ölçü eşleşmesi varsa amcanın gerçek (kataloğa birebir uyan) fiyatını kullan;
    // yoksa maliyet × kâr çarpanı ile tahmini hesapla.
    let fiyatR = (exact && row && row.fiyat != null) ? row.fiyat : Math.ceil((maliyet * md.carpan)/10)*10;
    let kutuTutari = 0;
    if(kutuVar && kutuSecim === 'kutulu'){
      kutuTutari = md.kutu.tek * kutuMetre;
      fiyatR += kutuTutari;
    }
    fiyatR += yuzeyTutari;
    dkLastCalc.fiyat = fiyatR;
    dkEls.resultPanel.innerHTML = `
      <div class="result-top">
        <div>
          <div class="result-title">Sipariş Özeti</div>
          <div class="result-model">${dkEls.model.value.toUpperCase()} · ${olcuText} · ${adet} adet · ${kutuSecim==='kutulu'?'Kutulu':'Kutusuz'}</div>
        </div>
        ${badge}
      </div>
      ${mismatchNote}
    `;
    return;
  }

  // Tam ölçü eşleşmesi varsa amcanın gerçek (kataloğa birebir uyan) fiyatlarını kullan;
  // yoksa maliyet × kâr çarpanı + renk farkları ile tahmini hesapla.
  let parlak, siyah, altin;
  if(exact && row && row.parlak != null){
    parlak = row.parlak; siyah = row.siyah; altin = row.altin;
  } else {
    parlak = Math.ceil((maliyet*md.carpan)/10)*10;
    siyah = parlak + md.deltaSiyah;
    altin = siyah + md.deltaAltin;
  }
  let kutuP=0, kutuS=0, kutuA=0;
  if(kutuVar && kutuSecim === 'kutulu'){
    kutuP = md.kutu.parlak * kutuMetre;
    kutuS = md.kutu.siyah * kutuMetre;
    kutuA = md.kutu.altin * kutuMetre;
    parlak += kutuP; siyah += kutuS; altin += kutuA;
  }
  if(yuzeyTutari > 0){
    parlak += yuzeyTutari; siyah += yuzeyTutari; altin += yuzeyTutari;
  }
  dkLastCalc.parlak = parlak; dkLastCalc.siyah = siyah; dkLastCalc.altin = altin;

  dkEls.resultPanel.innerHTML = `
    <div class="result-top">
      <div>
        <div class="result-title">Sipariş Özeti</div>
        <div class="result-model">${dkEls.model.value.toUpperCase()} · ${olcuText} · ${adet} adet · ${kutuSecim==='kutulu'?'Kutulu':'Kutusuz'}</div>
      </div>
      ${badge}
    </div>
    ${mismatchNote}
  `;
}

function buildDkLineItem(statusEl){
  const isCustomMode = dkTab === 'custom';
  if(!isCustomMode && !dkLastCalc){ if(statusEl) statusEl.textContent='Lütfen geçerli bir ölçü girin.'; return null; }
  const adet = Math.max(1, parseInt(document.getElementById('dk_adet').value)||1);

  if(isCustomMode){
    const kategori = document.getElementById('dk_c_kategori').value;
    const prodSel = document.getElementById('dk_c_urun');
    const urunAdi = prodSel.options[prodSel.selectedIndex] ? prodSel.options[prodSel.selectedIndex].text : '';
    const olcuGirilen = document.getElementById('dk_c_olcu').value.trim();
    if(!kategori || !prodSel.value){ if(statusEl) statusEl.textContent='Lütfen kataloğunuzdan bir ürün seçin (kataloğunuz boşsa yukarıdaki "Duşakabin ürün kataloğu" bölümünden ekleyin).'; return null; }
    if(!olcuGirilen){ if(statusEl) statusEl.textContent='Lütfen ölçü girin.'; return null; }
    return {
      seri: `Kendi Ürünüm · ${kategori} · ${urunAdi}`,
      olcu_kod: 'custom',
      olcu_text: olcuGirilen,
      kaplama: document.getElementById('dk_c_kaplama').value.trim() || null,
      cam_renk: null,
      adet: adet
    };
  } else {
    const modelLabel = dkEls.model.value.toUpperCase();
    const variantLabel = DK_VARIANT_LABELS[dkEls.variant.value] || dkEls.variant.value;
    const seriTypeLabel = dkTab === 'bella' ? 'Bella Seri' : 'Renkli Seri';
    const seriText = `${seriTypeLabel} · ${modelLabel} · ${variantLabel}`;

    let kaplamaLabel;
    if(dkLastCalc.isBella){
      kaplamaLabel = 'Bella (tek fiyat)';
    } else {
      kaplamaLabel = segVal('dk_kaplama') || 'Parlak';
    }
    const yuzeyLabelText = dkLastCalc.yuzeySecim && dkLastCalc.yuzeySecim !== 'seffaf'
      ? ({kumlama:'Kumlama', karolaj:'Karolaj Baskı', fume:'Füme'}[dkLastCalc.yuzeySecim] || dkLastCalc.yuzeySecim)
      : 'Şeffaf';
    const kutuText = dkLastCalc.kutuVar && dkLastCalc.kutuSecim === 'kutulu' ? 'Kutulu' : 'Kutusuz';
    const olcuText = `${dkLastCalc.olcuText} · ${kutuText}`;

    return {
      seri: seriText,
      olcu_kod: `${dkTab}/${dkEls.variant.value}/${dkEls.model.value}`,
      olcu_text: olcuText,
      kaplama: kaplamaLabel,
      cam_renk: yuzeyLabelText,
      adet: adet
    };
  }
}

function dkResetItemFields(){
  // Sadece o anki ürün ayarlarını sıfırlar; müşteri/bayi/adres/tarih bilgisine dokunmaz.
  document.getElementById('dk_adet').value = '1';
  const cOlcuEl = document.getElementById('dk_c_olcu'); if(cOlcuEl) cOlcuEl.value='';
  const cKaplamaEl = document.getElementById('dk_c_kaplama'); if(cKaplamaEl) cKaplamaEl.value='';
  const dim1 = document.getElementById('dk_dim1'); if(dim1) dim1.value='';
  const dim2 = document.getElementById('dk_dim2'); if(dim2) dim2.value='';
  if(typeof dkRender === 'function') dkRender();
}

function addDkItemToList(){
  const statusEl = document.getElementById('dk_addStatus');
  const item = buildDkLineItem(statusEl);
  if(!item) return;
  dkStagedItems.push(item);
  renderDkStagedList();
  dkResetItemFields();
  statusEl.textContent = `Eklendi (${dkStagedItems.length} ürün listede) ✓`;
  setTimeout(()=>{ if(statusEl) statusEl.textContent=''; },2000);
}

function removeDkStagedItem(i){
  dkStagedItems.splice(i,1);
  renderDkStagedList();
}

function renderDkStagedList(){
  const el = document.getElementById('dk_stagedList');
  if(!el) return;
  if(dkStagedItems.length===0){ el.innerHTML=''; return; }
  el.innerHTML = `
    <div class="hint" style="margin-bottom:6px;display:block;">Listedeki ürünler (kaydedince hepsi tek seferde eklenecek):</div>
    ${dkStagedItems.map((it,i)=>`
      <div style="display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:var(--radius-sm); background:var(--surface); margin-bottom:4px; font-size:12.5px;">
        <span style="flex:1;">${it.seri} — ${it.olcu_text} · ${it.adet} adet${it.kaplama?' · '+it.kaplama:''}${it.cam_renk?' · '+it.cam_renk:''}</span>
        <button class="line-del dkStagedDelBtn" data-i="${i}" title="Kaldır">×</button>
      </div>
    `).join('')}
  `;
  el.querySelectorAll('.dkStagedDelBtn').forEach(b=>{ b.onclick = ()=> removeDkStagedItem(parseInt(b.dataset.i)); });
}

async function submitDusakabinOrder(){
  const statusEl = document.getElementById('dk_status');
  const isSatici = profile.role === 'satici';

  // Listede hiç ürün yoksa, üstteki mevcut ayarı tek ürün olarak otomatik ekle.
  let items = dkStagedItems.slice();
  if(items.length===0){
    const item = buildDkLineItem(statusEl);
    if(!item) return;
    items = [item];
  }

  let sellerId, customerId, bayiAdi, custName;
  if(isSatici){
    sellerId = profile.id;
    customerId = null;
    bayiAdi = document.getElementById('dk_bayi').value.trim() || null;
    custName = document.getElementById('dk_cust').value||'İsimsiz müşteri';
  } else {
    sellerId = document.getElementById('dk_seller').value;
    if(!sellerId){ statusEl.textContent='Lütfen bir atölye seçin.'; return; }
    customerId = profile.id;
    bayiAdi = profile.full_name;
    custName = document.getElementById('dk_custname').value.trim() || profile.full_name;
  }

  const custAddress = document.getElementById('dk_addr').value||'';
  const note = document.getElementById('dk_note').value;
  const due = document.getElementById('dk_due').value||null;

  const rows = items.map(item => ({
    seller_id: sellerId,
    customer_id: customerId,
    bayi_adi: bayiAdi,
    cust_name: custName,
    cust_address: custAddress,
    seri: item.seri,
    olcu_kod: item.olcu_kod,
    olcu_text: item.olcu_text,
    kaplama: item.kaplama,
    cam_renk: item.cam_renk,
    adet: item.adet,
    note: note,
    due: due,
    status: 0
  }));

  statusEl.textContent='Kaydediliyor…';
  const {error} = await sb.from('dusakabin_orders').insert(rows);
  if(error){ statusEl.textContent='Hata: '+error.message; return; }
  statusEl.textContent = rows.length>1 ? `${rows.length} ürün eklendi ✓` : 'Eklendi ✓';
  await loadDusakabinOrders();
  renderDkList();
  dkStagedItems = [];
  renderDkStagedList();
  const custEl = document.getElementById('dk_cust');
  if(custEl) custEl.value='';
  const bayiEl = document.getElementById('dk_bayi');
  if(bayiEl) bayiEl.value='';
  const custNameEl = document.getElementById('dk_custname');
  if(custNameEl) custNameEl.value='';
  document.getElementById('dk_addr').value='';
  document.getElementById('dk_note').value='';
  document.getElementById('dk_due').value='';
  dkResetItemFields();
  setTimeout(()=>statusEl.textContent='',2500);
}

async function submitCustomerOrder(){
  const statusEl = document.getElementById('c_status');
  const linesClean = lineState.filter(l=>l.w && l.h && l.qty);
  const sellerId = document.getElementById('c_seller').value;
  if(!sellerId){ statusEl.textContent = 'Lütfen bir atölye seçin.'; return; }
  if(linesClean.length===0){ statusEl.textContent = 'En az bir ölçü girin.'; return; }
  const prod = selectedProduct('c');
  if(!prod.aciklama){ statusEl.textContent = 'Bu atölyede seçilebilir ürün bulunamadı.'; return; }
  statusEl.textContent = editingOrderId ? 'Güncelleniyor…' : 'Gönderiliyor…';
  const existing = editingOrderId ? orders.find(x=>String(x.id)===String(editingOrderId)) : null;
  // Ek dosyalar (Excel/foto) varsa önce onları Supabase Storage'a yükle, linklerini not alanına ekle.
  const attachStatusEl = document.getElementById('c_attach_status');
  const attachInput = document.getElementById('c_attach');
  const attachUrls = [];
  if(attachInput && attachInput.files && attachInput.files.length){
    for(const file of attachInput.files){
      if(attachStatusEl) attachStatusEl.textContent = `Yükleniyor: ${file.name}…`;
      const guvenliAd = file.name
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[İIı]/g, 'i')
        .replace(/[^a-zA-Z0-9.\-]/g, '_');
      const path = `${profile.id}/${Date.now()}_${guvenliAd}`;
      const {error: upErr} = await sb.storage.from('siparis-ekleri').upload(path, file);
      if(upErr){ if(attachStatusEl) attachStatusEl.textContent = `Hata (${file.name}): ${upErr.message}`; statusEl.textContent = 'Ek dosya yüklenemedi.'; return; }
      const {data: pubData} = sb.storage.from('siparis-ekleri').getPublicUrl(path);
      attachUrls.push({name: file.name, url: pubData.publicUrl});
    }
    if(attachStatusEl) attachStatusEl.textContent = `${attachUrls.length} dosya yüklendi ✓`;
  }
  let noteVal = document.getElementById('c_note').value || '';
  // Düzenlerken, önceden yüklenmiş eklerin linkleri notta zaten varsa tekrar eklenmesin —
  // sadece bu seferki yeni seçilen dosyalar not alanına eklenir.
  if(attachUrls.length){
    const ekBlok = '\n\n📎 Ek dosyalar:\n' + attachUrls.map(a=>`- ${a.name}: ${a.url}`).join('\n');
    noteVal = (noteVal || '') + ekBlok;
  }
  const row = {
    seller_id: sellerId, customer_id: profile.id,
    bayi_adi: profile.full_name,
    cust_name: document.getElementById('c_custname').value.trim() || profile.full_name,
    cust_address: document.getElementById('c_addr').value || '',
    product_id: prod.id, category: prod.kategori, product_label: prod.aciklama,
    temper: segVal('c_temper'), edge: segVal('c_edge'),
    renk: document.getElementById('c_isicam').checked
      ? buildIsicamText('c')
      : segVal('c_renk'),
    lines: linesClean.map(l=>({w:parseFloat(l.w), h:parseFloat(l.h), qty:parseInt(l.qty), note:l.note||'', dm:l.dm||[], delikSablon:l.delikSablon||null, sekilli:l.sekilli||false, sekilFotoUrl:l.sekilFotoUrl||null, isicam:l.isicam||{}, fiyat:l.fiyat||''})),
    note: noteVal, due: existing ? existing.due : null, status:0
  };
  const wasEditing = editingOrderId;
  const {data, error} = wasEditing
    ? await sb.from('orders').update(row).eq('id', wasEditing).select()
    : await sb.from('orders').insert(row).select();
  if(error){ statusEl.textContent = 'Hata: ' + error.message; return; }
  if(wasEditing && (!data || data.length===0)){ statusEl.textContent = 'Güncellenemedi (yetkin olmayabilir). Sayfayı yenileyip tekrar dene.'; return; }
  statusEl.textContent = wasEditing ? 'Güncellendi ✓' : 'Gönderildi ✓';
  editingOrderId = null;
  document.getElementById('c_submit').textContent = 'Ölçüyü gönder';
  document.getElementById('c_cancelEdit').style.display = 'none';
  await loadOrdersForCustomer();
  renderList(false);
  document.getElementById('c_note').value=''; document.getElementById('c_addr').value=''; document.getElementById('c_custname').value='';
  document.getElementById('c_isicam').checked=false; document.getElementById('c_isicam_detail').style.display='none';
  lineState=[]; addLine();
  setTimeout(()=>statusEl.textContent='',2000);
}

/* =========================================================
   SHARED: segmented control, measurement lines, list rendering
   ========================================================= */
function initSeg(group){
  document.querySelectorAll(`.seg[data-group="${group}"] button`).forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll(`.seg[data-group="${group}"] button`).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    };
  });
}
function segVal(group){
  const a = document.querySelector(`.seg[data-group="${group}"] button.active`);
  return a ? a.dataset.val : '';
}
function setSegVal(group, val){
  document.querySelectorAll(`.seg[data-group="${group}"] button`).forEach(b=>{
    b.classList.toggle('active', b.dataset.val === val);
  });
}

// Var olan bir siparişi düzenleme moduna alır: formu mevcut verilerle doldurur,
// "Kaydet" butonunu güncelleme moduna çevirir. Kaydedince submitWorkshopOrder/
// submitCustomerOrder, editingOrderId dolu olduğu için INSERT yerine UPDATE yapar.
function openEditOrder(o, isSellerView){
  editingOrderId = o.id;
  const prefix = isSellerView ? 'w' : 'c';
  if(isSellerView){
    const bayiEl = document.getElementById('w_bayi'); if(bayiEl) bayiEl.value = o.bayi_adi || '';
    const dueEl = document.getElementById('w_due'); if(dueEl) dueEl.value = o.due || '';
  } else {
    const sellerSel = document.getElementById('c_seller');
    if(sellerSel && o.seller_id) sellerSel.value = o.seller_id;
  }
  const custEl = document.getElementById(prefix+(isSellerView?'_cust':'_custname'));
  if(custEl) custEl.value = o.cust_name || '';
  const addrEl = document.getElementById(prefix+'_addr'); if(addrEl) addrEl.value = o.cust_address || '';
  const noteEl = document.getElementById(prefix+'_note'); if(noteEl) noteEl.value = o.note || '';
  const ascCodeEl = document.getElementById(prefix+'_asc_code'); if(ascCodeEl) ascCodeEl.value = o.asc_customer_code || '';
  if(isSellerView){
    const fiyatEl = document.getElementById('w_fiyat');
    if(fiyatEl) fiyatEl.value = (o.lines && o.lines[0] && o.lines[0].fiyat) || '';
  }

  const catSel = document.getElementById(prefix+'_kategori');
  if(catSel){
    catSel.value = o.category || '';
    updateProductSelect(prefix);
    const prodSel = document.getElementById(prefix+'_urun');
    if(prodSel) prodSel.value = o.product_id || '';
  }

  setSegVal(prefix+'_temper', o.temper || 'Temperli');
  setSegVal(prefix+'_edge', o.edge || 'Rodajlı');

  // Isıcam parsing - yeni format: "Isıcam: 4+12+4 Seffaf+Seffaf" veya "Isıcam: 4+12+4 Seffaf+Seffaf | 4+22+4 Füme+Füme"
  const isicamMatch = (o.renk||'').match(/^Isıcam:\s*(.+)$/i);
  const isicamChk = document.getElementById(prefix+'_isicam');
  const isicamDetail = document.getElementById(prefix+'_isicam_detail');
  if(isicamMatch){
    if(isicamChk) isicamChk.checked = true;
    if(isicamDetail) isicamDetail.style.display = 'block';
    
    const isicamParts = isicamMatch[1].split('|').map(s=>s.trim());
    
    // İlk Isıcam
    if(isicamParts[0]){
      const m1 = isicamParts[0].match(/^(\d+)\+(\d+)\+(\d+)\s+(.+)$/);
      if(m1){
        const dis = document.getElementById(prefix+'_ic1_dis');
        const bosluk = document.getElementById(prefix+'_ic1_bosluk');
        const ic = document.getElementById(prefix+'_ic1_ic');
        const renk = document.getElementById(prefix+'_ic1_renk');
        if(dis) dis.value = m1[1];
        if(bosluk) bosluk.value = m1[2];
        if(ic) ic.value = m1[3];
        if(renk) renk.value = m1[4];
        // Form'daki değerlerle birlikte, yeni eklenecek satırların varsayılan
        // Isıcam'ı olarak kullanılan global state'i de senkronize et.
        isicamState = {dis: parseFloat(m1[1])||4, bosluk: parseFloat(m1[2])||12, ic: parseFloat(m1[3])||4, renk: m1[4]};
      }
    }
  } else {
    if(isicamChk) isicamChk.checked = false;
    if(isicamDetail) isicamDetail.style.display = 'none';
    setSegVal(prefix+'_renk', o.renk || 'Füme');
  }

  lineState = (o.lines||[]).map(l=>({w:l.w, h:l.h, qty:l.qty, note:l.note||'', dm:(l.dm||[]).map(d=>({...d})), delikSablon: l.delikSablon ? JSON.parse(JSON.stringify(l.delikSablon)) : null, sekilli:l.sekilli||false, sekilFotoUrl:l.sekilFotoUrl||null, isicam:(l.isicam && l.isicam.renk) ? {...l.isicam} : {...isicamState}, fiyat:l.fiyat||''}));
  if(lineState.length===0) lineState.push({w:'',h:'',qty:1,note:'',sekilli:false, fiyat:'', isicam: {...isicamState}});
  renderLines();

  const submitBtn = document.getElementById(prefix+'_submit');
  if(submitBtn) submitBtn.textContent = 'Değişiklikleri kaydet';
  const cancelBtn = document.getElementById(prefix+'_cancelEdit');
  if(cancelBtn) cancelBtn.style.display = '';
  const statusEl = document.getElementById(prefix+'_status');
  if(statusEl) statusEl.textContent = `#${o.id} düzenleniyor…`;

  const scrollTarget = document.getElementById(isSellerView ? 'w_bayi' : 'c_custname');
  if(scrollTarget) scrollTarget.scrollIntoView({behavior:'smooth', block:'start'});
}

function cancelEdit(prefix){
  editingOrderId = null;
  const submitBtn = document.getElementById(prefix+'_submit');
  if(submitBtn) submitBtn.textContent = prefix==='w' ? 'Siparişi ekle' : 'Ölçüyü gönder';
  const cancelBtn = document.getElementById(prefix+'_cancelEdit');
  if(cancelBtn) cancelBtn.style.display = 'none';
  const statusEl = document.getElementById(prefix+'_status');
  if(statusEl) statusEl.textContent = '';
  lineState = []; addLine();
}

function addLine(){
  lineState.push({w:'',h:'',qty:1,note:'',sekilli:false, fiyat:'', isicam: {...isicamState}});
  renderLines();
}
function removeLine(idx){
  lineState.splice(idx,1);
  if(lineState.length===0) lineState.push({w:'',h:'',qty:1,note:'',sekilli:false, fiyat:'', isicam: {...isicamState}});
  renderLines();
}
function renderLines(){
  const prefix = profile.role==='satici' ? 'w' : 'c';
  const el = document.getElementById(prefix+'_lines');
  if(!el) return;
  const isicamEnabled = !!document.getElementById(prefix+'_isicam')?.checked;
  el.innerHTML = lineState.map((l,i)=>`
    <div class="line-row">
      <input type="number" placeholder="1200" value="${l.w}" data-field="w" data-idx="${i}">
      <input type="number" placeholder="800" value="${l.h}" data-field="h" data-idx="${i}">
      <input type="number" placeholder="1" value="${l.qty}" data-field="qty" data-idx="${i}">
      <input type="text" placeholder="Örn: BACA" value="${l.note||''}" data-field="note" data-idx="${i}">
      <label class="line-sekilli" title="Bu parça şekilli (standart dikdörtgen değil)">
        <input type="checkbox" data-field="sekilli" data-idx="${i}" ${l.sekilli?'checked':''}> ŞKL
      </label>
      <span class="line-m2">${fmtM2(lineM2(l))}</span>
      ${isicamEnabled ? `<span class="line-isicam-compact" data-idx="${i}" style="font-size:11px;color:var(--text-mut);cursor:pointer;padding:4px 8px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);white-space:nowrap;display:inline-block;user-select:none;" title="Tıkla: Bu satırın Isıcam'ını düzenle">${(l.isicam?.dis||4)}+${(l.isicam?.bosluk||12)}+${(l.isicam?.ic||4)} ${(l.isicam?.renk||'—')}</span>` : `<span></span>`}
      <button class="line-delik-sablon ${l.delikSablon?'has-data':''}" data-idx="${i}" title="Delik/Poz şablonu seç">🔧${l.delikSablon?' 1':''}</button>
      <button class="line-del" data-idx="${i}" title="Satırı sil">×</button>
    </div>
    ${l.sekilli ? `
    <div class="line-sekil-foto">
      ${l.sekilFotoUrl
        ? `<a href="${l.sekilFotoUrl}" target="_blank"><img src="${l.sekilFotoUrl}" class="sekil-thumb"></a>
           <button class="btn btn-ghost btn-sm sekil-foto-del" data-idx="${i}">Fotoğrafı kaldır</button>`
        : `<button class="btn btn-ghost btn-sm sekil-foto-btn" data-idx="${i}">📷 Şekil fotoğrafı/krokisi ekle</button>
           <span class="hint sekil-foto-status" data-idx="${i}"></span>`}
      <input type="file" accept="image/*" capture="environment" class="sekil-foto-input" data-idx="${i}" style="display:none;">
    </div>` : ''}
  `).join('');
  el.querySelectorAll('.sekil-foto-btn').forEach(btn=>{
    btn.onclick = ()=> el.querySelector(`.sekil-foto-input[data-idx="${btn.dataset.idx}"]`).click();
  });
  el.querySelectorAll('.sekil-foto-input').forEach(inp=>{
    inp.onchange = async ()=>{
      const idx = parseInt(inp.dataset.idx);
      const file = inp.files[0];
      if(!file) return;
      const statusSpan = el.querySelector(`.sekil-foto-status[data-idx="${idx}"]`);
      if(statusSpan) statusSpan.textContent = 'Yükleniyor…';
      // Dosya adındaki Türkçe/özel karakterler Supabase Storage'da "Invalid key" hatası
      // verdiği için sadece güvenli karakterler (harf/rakam/nokta/tire/alt çizgi) bırakılıyor.
      const guvenliAd = file.name
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // aksanları ayır (é->e vb.)
        .replace(/[İIı]/g, 'i')
        .replace(/[^a-zA-Z0-9.\-]/g, '_');
      const path = `${profile.id}/${Date.now()}_${guvenliAd}`;
      const {error} = await sb.storage.from('sekil-fotolari').upload(path, file);
      if(error){ if(statusSpan) statusSpan.textContent = 'Hata: '+error.message; return; }
      const {data} = sb.storage.from('sekil-fotolari').getPublicUrl(path);
      lineState[idx].sekilFotoUrl = data.publicUrl;
      renderLines();
    };
  });
  el.querySelectorAll('.sekil-foto-del').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.dataset.idx);
      lineState[idx].sekilFotoUrl = null;
      renderLines();
    };
  });
  const NAV_FIELDS = ['w','h','qty','note'];
  el.querySelectorAll('input[type="checkbox"][data-field="sekilli"]').forEach(chk=>{
    chk.onchange = ()=>{
      const idx = parseInt(chk.dataset.idx);
      lineState[idx].sekilli = chk.checked;
      renderLines();
    };
  });
  el.querySelectorAll('input:not([type="checkbox"])').forEach(inp=>{
    inp.oninput = ()=>{
      const idx = parseInt(inp.dataset.idx), field = inp.dataset.field;
      lineState[idx][field] = inp.value;
      document.getElementById(prefix+'_totalM2').textContent = fmtM2(linesTotalM2(lineState));
      inp.closest('.line-row')?.querySelector('.line-m2') && (inp.closest('.line-row').querySelector('.line-m2').textContent = fmtM2(lineM2(lineState[idx])));
    };
    inp.onkeydown = (e)=>{
      const idx = parseInt(inp.dataset.idx);
      const field = inp.dataset.field;
      const fi = NAV_FIELDS.indexOf(field);
      if(e.key==='ArrowRight'){
        e.preventDefault();
        if(fi < NAV_FIELDS.length-1){
          const next = el.querySelector(`input[data-field="${NAV_FIELDS[fi+1]}"][data-idx="${idx}"]`);
          if(next) next.focus();
        }
      } else if(e.key==='ArrowLeft'){
        e.preventDefault();
        if(fi > 0){
          const prev = el.querySelector(`input[data-field="${NAV_FIELDS[fi-1]}"][data-idx="${idx}"]`);
          if(prev) prev.focus();
        }
      } else if(e.key==='ArrowUp'){
        e.preventDefault();
        if(idx > 0){
          const up = el.querySelector(`input[data-field="${field}"][data-idx="${idx-1}"]`);
          if(up) up.focus();
        }
      } else if(e.key==='ArrowDown'){
        e.preventDefault();
        if(idx < lineState.length-1){
          const down = el.querySelector(`input[data-field="${field}"][data-idx="${idx+1}"]`);
          if(down) down.focus();
        }
      } else if(e.key==='Enter'){
        e.preventDefault();
        lineState[idx][field] = inp.value;
        if(fi < NAV_FIELDS.length-1){
          // sonraki alana geç
          const next = el.querySelector(`input[data-field="${NAV_FIELDS[fi+1]}"][data-idx="${idx}"]`);
          if(next) next.focus();
        } else {
          // son alan (note) — yeni satır ekle veya sonraki satıra geç
          if(idx === lineState.length-1){
            addLine();
            setTimeout(()=>{
              const newFirst = el.querySelector(`input[data-field="w"][data-idx="${idx+1}"]`);
              if(newFirst) newFirst.focus();
            }, 30);
          } else {
            const next = el.querySelector(`input[data-field="w"][data-idx="${idx+1}"]`);
            if(next) next.focus();
          }
        }
      }
    };
  });
  el.querySelectorAll('.line-del').forEach(btn=>{
    btn.onclick = ()=> removeLine(parseInt(btn.dataset.idx));
  });
  el.querySelectorAll('.line-delik-sablon').forEach(btn=>{
    btn.onclick = ()=> openDelikSablonPanel(parseInt(btn.dataset.idx));
  });
  el.querySelectorAll('.line-isicam-compact').forEach(span=>{
    span.onclick = ()=> openIsicamLineEditor(parseInt(span.dataset.idx));
  });
  const totalEl = document.getElementById(prefix+'_totalM2');
  if(totalEl) totalEl.textContent = fmtM2(linesTotalM2(lineState));
}

  modal.innerHTML = `
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
