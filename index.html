      <div style="font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 16px;">
        Satır ${lineIdx + 1} — Isıcam Seçimi
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;">
        <div class="field"><label>Dış cam (mm)</label><input id="modal_ic_dis" type="number" value="${currentIsicam.dis||4}" min="1"></div>
        <div class="field"><label>Boşluk (mm)</label><input id="modal_ic_bosluk" type="number" value="${currentIsicam.bosluk||12}" min="1"></div>
        <div class="field"><label>İç cam (mm)</label><input id="modal_ic_ic" type="number" value="${currentIsicam.ic||4}" min="1"></div>
      </div>
      <div class="field" style="margin-bottom:16px;"><label>Cam kombinasyonu</label>
        <select id="modal_ic_renk" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:9px 10px;font-size:13.5px;font-family:var(--font-body);outline:none;width:100%;">
          <option value="Şeffaf+Şeffaf" ${currentIsicam.renk==='Şeffaf+Şeffaf'?'selected':''}>Şeffaf + Şeffaf</option>
          <option value="Şeffaf+Füme" ${currentIsicam.renk==='Şeffaf+Füme'?'selected':''}>Şeffaf + Füme</option>
          <option value="Füme+Füme" ${currentIsicam.renk==='Füme+Füme'?'selected':''}>Füme + Füme</option>
          <option value="Saten+Saten" ${currentIsicam.renk==='Saten+Saten'?'selected':''}>Saten + Saten</option>
          <option value="Şeffaf+Saten" ${currentIsicam.renk==='Şeffaf+Saten'?'selected':''}>Şeffaf + Saten</option>
        </select>
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="modal_save" class="btn btn-primary" style="flex: 1;">Kaydet</button>
        <button id="modal_cancel" class="btn btn-ghost" style="flex: 1;">İptal</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  const disEl = modal.querySelector('#modal_ic_dis');
  const boslukEl = modal.querySelector('#modal_ic_bosluk');
  const icEl = modal.querySelector('#modal_ic_ic');
  const renkEl = modal.querySelector('#modal_ic_renk');
  
  modal.querySelector('#modal_save').onclick = ()=>{
    const newIsicam = {
      dis: parseFloat(disEl.value) || 4,
      bosluk: parseFloat(boslukEl.value) || 12,
      ic: parseFloat(icEl.value) || 4,
      renk: renkEl.value
    };
    lineState[lineIdx].isicam = newIsicam;
    renderLines();
    document.body.removeChild(modal);
  };
  
  modal.querySelector('#modal_cancel').onclick = ()=>{
    document.body.removeChild(modal);
  };
  
  modal.onclick = (e)=>{
    if(e.target === modal) document.body.removeChild(modal);
  };
  
  disEl.focus();
}

// ====================================================================
// EXCEL'DEN SİPARİŞ OKUMA — müşterinin kendi Excel dosyasından
// En/Boy/Adet satırlarını içeri aktarır (WhatsApp'a alternatif)
// ====================================================================
let xlImportPrefix = null;

function openExcelImport(prefix){
  xlImportPrefix = prefix;
  const inp = document.getElementById('xl_fileInput');
  inp.value = '';
  inp.click();
}

function normalizeHeaderText(s){
  return String(s||'').toLocaleLowerCase('tr').trim()
    .replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c');
}

async function handleExcelFileChosen(e){
  const file = e.target.files && e.target.files[0];
  if(!file || !xlImportPrefix) return;
  const prefix = xlImportPrefix;
  const statusEl = document.getElementById(prefix+'_status');
  if(statusEl) statusEl.textContent = 'Excel okunuyor…';
  try{
    const buf = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    const ws = wb.worksheets[0];
    if(!ws){ if(statusEl) statusEl.textContent = 'Excel dosyasında sayfa bulunamadı.'; return; }

    // 1) Başlık satırını bul: "en", "boy/yükseklik", "adet/miktar" kelimelerini
    //    içeren hücreleri arayarak hangi sütunun ne olduğunu tespit et.
    //    Not/Açıklama, Delik ve Poz gibi birden fazla sütun olabilir — hepsini
    //    toplayıp satırın notuna birleştiriyoruz (kaybolmasınlar diye).
    const EN_WORDS = ['en','eni','genislik','genisligi','width','w'];
    const BOY_WORDS = ['boy','boyu','yukseklik','yuksekligi','height','h'];
    const ADET_WORDS = ['adet','adedi','miktar','qty','quantity'];
    const NOT_WORDS = ['not','notu','aciklama','note','delik','poz','menfez'];

    let headerRow = null, colMap = null;
    const maxScanRow = Math.min(ws.rowCount, 15);
    for(let r=1; r<=maxScanRow; r++){
      const row = ws.getRow(r);
      const map = { notCols: [] };
      row.eachCell({includeEmpty:false}, (cell, colNumber)=>{
        const t = normalizeHeaderText(cell.value);
        if(!t) return;
        if(EN_WORDS.includes(t) && map.en===undefined) map.en = colNumber;
        else if(BOY_WORDS.includes(t) && map.boy===undefined) map.boy = colNumber;
        else if(ADET_WORDS.includes(t) && map.adet===undefined) map.adet = colNumber;
        else if(NOT_WORDS.includes(t)) map.notCols.push(colNumber);
      });
      if(map.en!==undefined && map.boy!==undefined){
        headerRow = r; colMap = map; break;
      }
    }

    let startRow, en, boy, adet, notCols;
    if(headerRow){
      startRow = headerRow + 1;
      en = colMap.en; boy = colMap.boy; adet = colMap.adet; notCols = colMap.notCols;
    } else {
      // Başlık bulunamadı: ilk dolu satırdan itibaren 1., 2., 3. sütunları
      // En / Boy / Adet olarak varsay.
      startRow = 1;
      en = 1; boy = 2; adet = 3; notCols = [4];
    }

    const cellNum = (row, col)=>{
      if(!col) return null;
      const v = row.getCell(col).value;
      if(v===null || v===undefined || v==='') return null;
      const n = parseFloat(String(typeof v==='object' && v.result!==undefined ? v.result : v).replace(',','.'));
      return isNaN(n) ? null : n;
    };
    // Küçük sayılar (örn. 90) muhtemelen cm ile girilmiştir; uygulama mm kullanır.
    const toMm = (n)=> n<=300 ? Math.round(n*10) : Math.round(n);

    const parsed = [];
    for(let r=startRow; r<=ws.rowCount; r++){
      const row = ws.getRow(r);
      const enV = cellNum(row, en);
      const boyV = cellNum(row, boy);
      if(enV===null || boyV===null || enV<=0 || boyV<=0) continue;
      const adetV = cellNum(row, adet);
      const noteParts = (notCols||[]).map(c=>{
        const v = row.getCell(c).value;
        return v ? String(v).trim() : '';
      }).filter(Boolean);
      parsed.push({
        w: String(toMm(enV)),
        h: String(toMm(boyV)),
        qty: adetV && adetV>0 ? String(Math.round(adetV)) : '1',
        note: noteParts.join(' · ')
      });
    }

    if(parsed.length===0){
      if(statusEl) statusEl.textContent = 'Excel içinde En/Boy içeren bir satır bulunamadı. Dosya farklı bir düzende olabilir, lütfen ölçüleri elle kontrol edip girin.';
      return;
    }

    lineState = parsed;
    renderLines();
    if(statusEl){
      statusEl.textContent = `${parsed.length} satır Excel'den okundu — lütfen aşağıdan kontrol edip gerekirse düzeltin, sonra siparişi ekleyin.`;
      statusEl.style.color = 'var(--accent)';
      setTimeout(()=>{ statusEl.style.color=''; },4000);
    }
  } catch(err){
    if(statusEl) statusEl.textContent = 'Excel okunamadı: ' + err.message;
  }
}
document.getElementById('xl_fileInput').addEventListener('change', handleExcelFileChosen);

// ====================================================================
// GÖRSELDEN ÖLÇÜ OKUMA
// ====================================================================
let mrCtx = null; // {mode:'lines'|'dusakabin', prefix?, seriKey?}

function openMeasureReader(mode, prefix){
  mrCtx = { mode, prefix };
  document.getElementById('mr_fileInput').value = '';
  document.getElementById('mr_fileInput').click();
}

document.getElementById('mr_fileInput').addEventListener('change', async function(){
  const file = this.files && this.files[0];
  if(!file || !mrCtx) return;
  const overlay = document.getElementById('mr_overlay');
  const body = document.getElementById('mr_body');
  overlay.style.display = 'flex';

  const reader = new FileReader();
  reader.onload = async function(e){
    const dataUrl = e.target.result;
    const base64 = dataUrl.split(',')[1];
    const previewImg = `<img src="${dataUrl}" style="width:100%;border-radius:var(--radius-sm);margin-bottom:12px;max-height:220px;object-fit:contain;background:var(--surface-2);">`;
    body.innerHTML = previewImg + `<div class="hint">Görsel okunuyor, birkaç saniye sürebilir…</div>`;

    try{
      const res = await fetch(OLCU_OKU_FN_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({
          image_base64: base64,
          mime_type: file.type || 'image/jpeg',
          mode: mrCtx.mode
        })
      });
      const data = await res.json();
      if(!res.ok || data.error){
        body.innerHTML = previewImg + `<div class="hint" style="color:var(--danger);">Hata: ${data.error || 'Görsel okunamadı'}</div>
          <div class="form-actions" style="margin-top:12px;"><button class="btn btn-ghost btn-sm" id="mr_close">Kapat</button></div>`;
        document.getElementById('mr_close').onclick = closeMeasureReader;
        return;
      }
      if(mrCtx.mode === 'lines') renderLinesResult(previewImg, data);
      else renderDusakabinResult(previewImg, data);
    } catch(err){
      body.innerHTML = previewImg + `<div class="hint" style="color:var(--danger);">Bağlantı hatası: ${err.message}</div>
        <div class="form-actions" style="margin-top:12px;"><button class="btn btn-ghost btn-sm" id="mr_close">Kapat</button></div>`;
      document.getElementById('mr_close').onclick = closeMeasureReader;
    }
  };
  reader.readAsDataURL(file);
});

function closeMeasureReader(){
  document.getElementById('mr_overlay').style.display = 'none';
  mrCtx = null;
}

function renderLinesResult(previewImg, data){
  const body = document.getElementById('mr_body');
  const guvenColor = data.guven === 'yüksek' ? 'var(--accent)' : (data.guven === 'düşük' ? 'var(--danger)' : 'var(--text-mut)');
  const olculer = Array.isArray(data.olculer) ? data.olculer : [];
  if(olculer.length === 0){
    body.innerHTML = previewImg + `
      <div class="hint" style="display:block;margin-bottom:10px;color:var(--danger);">⚠️ Fişte geçerli bir ölçü satırı bulunamadı. Daha net/yakın bir fotoğrafla tekrar dene.</div>
      ${data.genel_not ? `<div class="hint" style="display:block;margin-bottom:6px;">Not: ${data.genel_not}</div>` : ''}
      <div class="form-actions" style="margin-top:10px;"><button class="btn btn-ghost btn-sm" id="mr_cancel">Kapat</button></div>`;
    document.getElementById('mr_cancel').onclick = closeMeasureReader;
    return;
  }
  const rows = olculer.map((o,i)=>{
    const delikSayisi = Array.isArray(o.delikler) ? o.delikler.length : 0;
    return `
    <div class="field-grid" style="grid-template-columns:24px 1fr 1fr 70px;gap:6px;align-items:end;margin-bottom:${delikSayisi?0:6}px;">
      <input type="checkbox" id="mr_chk_${i}" checked style="margin-bottom:10px;">
      <div class="field"><label style="font-size:11px;">En (mm)</label><input id="mr_en_${i}" type="number" value="${o.en_mm||''}"></div>
      <div class="field"><label style="font-size:11px;">Boy (mm)</label><input id="mr_boy_${i}" type="number" value="${o.boy_mm||''}"></div>
      <div class="field"><label style="font-size:11px;">Adet</label><input id="mr_adet_${i}" type="number" value="${o.adet||1}"></div>
    </div>
    ${delikSayisi ? `<div class="hint" style="display:block;margin-bottom:6px;color:var(--accent);">📐 Bu satırda ${delikSayisi} delik/menfez tespit edildi — "Delik/Poz" kutusuna not olarak eklenecek.</div>` : ''}`;
  }).join('');
  body.innerHTML = previewImg + `
    ${data.musteri_adi ? `<div class="field" style="margin-bottom:8px;"><label style="font-size:11px;">Okunan müşteri adı — düzeltip onaylayabilirsin</label><input id="mr_musteri" type="text" value="${data.musteri_adi}"></div>` : ''}
    ${data.genel_not ? `<div class="hint" style="display:block;margin-bottom:8px;">Fişteki genel not: <b>${data.genel_not}</b> — bunu Ürün/Temperleme seçiminde elle işaretlemeyi unutma.</div>` : ''}
    <div class="hint" style="display:block;margin-bottom:8px;">${olculer.length} ölçü satırı bulundu. Kontrol edip işaretini kaldırdıklarını hariç tutabilirsin:</div>
    ${rows}
    ${data.guven ? `<div class="hint" style="display:block;margin:6px 0;color:${guvenColor};">Güven: ${data.guven}</div>` : ''}
    <div class="form-actions" style="margin-top:10px;">
      <button class="btn btn-primary btn-sm" id="mr_ok">Seçilenleri ekle</button>
      <button class="btn btn-ghost btn-sm" id="mr_cancel">İptal</button>
    </div>`;
  document.getElementById('mr_cancel').onclick = closeMeasureReader;
  document.getElementById('mr_ok').onclick = function(){
    const musteriInput = document.getElementById('mr_musteri');
    if(musteriInput && musteriInput.value.trim()){
      const custField = document.getElementById(mrCtx.prefix + '_cust') || document.getElementById(mrCtx.prefix + '_custname');
      if(custField && !custField.value.trim()) custField.value = musteriInput.value.trim();
    }
    const MENFEZ_DIR_MAP = {ust:'up', alt:'down', sol:'left', sag:'right'};
    let eklenen = 0;
    olculer.forEach((o,i)=>{
      const chk = document.getElementById('mr_chk_'+i);
      if(!chk.checked) return;
      const en = document.getElementById('mr_en_'+i).value;
      const boy = document.getElementById('mr_boy_'+i).value;
      const adet = document.getElementById('mr_adet_'+i).value || 1;
      if(!en || !boy) return;
      // Delik/menfez ölçüsünü (üstten/soldan mm) fotoğraftan otomatik hesaplamıyoruz —
      // bu, hataya çok açık bir tahmin olurdu. Bunun yerine sadece "kaç tane, ne tür"
      // olduğunu NOT olarak düşüyoruz; kesin ölçüyü kullanıcı "Delik/Poz" kutusuna kendi yazar.
      const delikler = Array.isArray(o.delikler) ? o.delikler : [];
      let otoNot = '';
      if(delikler.length){
        const sayim = {};
        delikler.forEach(d=>{
          // Yeni format: d.tip ("delik"/"menfez"). Eski format desteği: menfez_yon varsa "Menfez" say.
          const tip = d.tip === 'menfez' ? 'Menfez' : (d.tip === 'delik' ? 'Delik' : (MENFEZ_DIR_MAP[d.menfez_yon] ? 'Menfez' : 'Delik'));
          sayim[tip] = (sayim[tip]||0) + 1;
        });
        otoNot = Object.entries(sayim).map(([tip,c])=> c>1 ? `${c} ${tip}` : tip).join(' + ');
      }
      const emptyIdx = lineState.findIndex(l=>!l.w && !l.h);
      if(emptyIdx >= 0 && eklenen === 0){
        const mevcutNot = lineState[emptyIdx].note || '';
        lineState[emptyIdx] = { w: en, h: boy, qty: adet, note: [mevcutNot, otoNot].filter(Boolean).join(' — '), dm: [], sekilli: false, isicam: {...isicamState} };
      } else {
        lineState.push({ w: en, h: boy, qty: adet, note: otoNot, dm: [], sekilli: false, isicam: {...isicamState} });
      }
      eklenen++;
    });
    renderLines();
    closeMeasureReader();
  };
}

function renderDusakabinResult(previewImg, data){
  const body = document.getElementById('mr_body');
  const guvenColor = data.guven === 'yüksek' ? 'var(--accent)' : (data.guven === 'düşük' ? 'var(--danger)' : 'var(--text-mut)');
  const okundu = data.olcu2_cm ? `${data.olcu1_cm} x ${data.olcu2_cm} cm` : `${data.olcu1_cm} cm`;
  const showDim2 = dkEls.dim2Field && dkEls.dim2Field.style.display !== 'none';
  body.innerHTML = previewImg + `
    <div class="hint" style="display:block;margin-bottom:10px;">Görselden okunan ölçü: <b>${okundu}</b></div>
    ${data.not ? `<div class="hint" style="display:block;margin-bottom:6px;">Not: ${data.not}</div>` : ''}
    ${data.guven ? `<div class="hint" style="display:block;margin-bottom:10px;color:${guvenColor};">Güven: ${data.guven}</div>` : ''}
    <div class="field-grid two" style="margin-bottom:6px;">
      <div class="field"><label style="font-size:11px;">En (cm)</label><input id="mr_dk_dim1" type="number" value="${data.olcu1_cm||''}"></div>
      ${showDim2 ? `<div class="field"><label style="font-size:11px;">Boy (cm)</label><input id="mr_dk_dim2" type="number" value="${data.olcu2_cm||''}"></div>` : ''}
    </div>
    <div class="hint" style="display:block;margin-bottom:10px;">Değerleri kontrol edip düzelt, sonra ölçü formuna aktar.</div>
    <div class="form-actions" style="margin-top:10px;">
      <button class="btn btn-primary btn-sm" id="mr_ok">Doğru, aktar</button>
      <button class="btn btn-ghost btn-sm" id="mr_cancel">İptal</button>
    </div>`;
  document.getElementById('mr_cancel').onclick = closeMeasureReader;
  document.getElementById('mr_ok').onclick = function(){
    const v1 = document.getElementById('mr_dk_dim1').value;
    const v2El = document.getElementById('mr_dk_dim2');
    if(v1) dkEls.dim1.value = v1;
    if(v2El && v2El.value) dkEls.dim2.value = v2El.value;
    dkRender();
    closeMeasureReader();
  };
}

// Çoğu şablon tek panelli (kendisi); Çift Menteşeli Camlar 2 panelli. Bu fonksiyon
// her ikisini de aynı listeye normalize eder — render/export kodu tek yerden geçer.
function dsTemplatePanels(tpl){
  if(tpl.multiPanel) return [
    Object.assign({key:'sol'}, tpl.panels.sol),
    Object.assign({key:'sag'}, tpl.panels.sag)
  ];
  return [{key:null, glass:tpl.glass, holes:tpl.holes, arrows:tpl.arrows, note:tpl.note, noteX:tpl.noteX, noteY:tpl.noteY, camOlcuArrow:null}];
}

function dsRenderSVG(tpl){
  const vb = tpl.viewBox;
  let out = `<svg viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" style="display:block; width:100%; height:auto;">`;
  out += `<defs><marker id="dsArrEnd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#000"/></marker><marker id="dsArrStart" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto"><path d="M8,0 L2,3 L8,6 Z" fill="#000"/></marker></defs>`;
  dsTemplatePanels(tpl).forEach(p=>{
    out += `<rect x="${p.glass.x}" y="${p.glass.y}" width="${p.glass.w}" height="${p.glass.h}" fill="#F5F7FA" stroke="#000" stroke-width="1.5"/>`;
    p.holes.forEach(h=>{
      out += `<ellipse cx="${h.x+h.w/2}" cy="${h.y+h.h/2}" rx="${h.w/2}" ry="${h.h/2}" fill="#fff" stroke="#000" stroke-width="1"/>`;
    });
    p.arrows.forEach(a=>{
      if(a.type==='single'){
        out += `<line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" stroke="#000" stroke-width="1" marker-end="url(#dsArrEnd)"/>`;
      } else {
        out += `<line x1="${a.x}" y1="${a.y1}" x2="${a.x}" y2="${a.y2}" stroke="#000" stroke-width="1" marker-end="url(#dsArrEnd)" marker-start="url(#dsArrStart)"/>`;
      }
    });
    if(p.camOlcuArrow){
      const a = p.camOlcuArrow;
      out += `<line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" stroke="#000" stroke-width="1" marker-end="url(#dsArrEnd)"/>`;
      out += `<text x="${a.x1-40}" y="${a.y2+10}" font-size="7" fill="#000">${p.camOlcuLabel||''}</text>`;
    }
    if(p.note) p.note.split('\n').forEach((line,i)=>{
      out += `<text x="${p.noteX}" y="${p.noteY+12+(i*12)}" font-size="9" fill="#000">${line}</text>`;
    });
  });
  out += `</svg>`;
  return out;
}

// Ok etiketinin (cm kutusu) konumunu ok geometrisinden otomatik türetir — elle
// hesaplanan koordinatlarda hata riskini azaltmak için. Tek yönlü ok: ucun biraz
// ilerisinde (ok yönünde). Çift yönlü ok: ortada, sağa doğru hafif kaymış.
function dsAutoLabel(a){
  if(a.type==='double') return {x:a.x+10, y:(a.y1+a.y2)/2};
  const dx=a.x2-a.x1, dy=a.y2-a.y1, len=Math.hypot(dx,dy)||1;
  return {x:a.x2+(dx/len)*10, y:a.y2+(dy/len)*10};
}

let dsCtx = null; // {lineIdx, sablon}
function openDelikSablonPanel(lineIdx){
  dsCtx = {lineIdx, sablon:null};
  document.getElementById('ds_overlay').style.display = 'flex';
  document.getElementById('ds_detail').style.display = 'none';
  document.getElementById('ds_gallery').style.display = 'grid';
  renderDsGallery();
}
function renderDsGallery(){
  const gal = document.getElementById('ds_gallery');
  gal.innerHTML = Object.keys(DELIK_SABLON_TANIMLARI).map(key=>{
    const t = DELIK_SABLON_TANIMLARI[key];
    return `<div class="sb-card" data-key="${key}" style="border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px; cursor:pointer; background:var(--surface-2); text-align:center;">
      ${dsRenderSVG(t)}
      <div style="font-size:11px; font-weight:600; margin-top:4px;">${t.ad}</div>
    </div>`;
  }).join('');
  gal.querySelectorAll('[data-key]').forEach(card=>{
    card.onclick = ()=> openDsDetail(card.dataset.key);
  });
}
function openDsDetail(key){
  dsCtx.sablon = key;
  const tpl = DELIK_SABLON_TANIMLARI[key];
  document.getElementById('ds_gallery').style.display = 'none';
  document.getElementById('ds_detail').style.display = 'block';
  document.getElementById('ds_detailTitle').textContent = tpl.ad;
  const wrap = document.getElementById('ds_canvasWrap');
  wrap.style.aspectRatio = `${tpl.viewBox.w} / ${tpl.viewBox.h}`;
  wrap.innerHTML = dsRenderSVG(tpl);
  const mevcutLine = lineState[dsCtx.lineIdx];
  const mevcutSablon = (mevcutLine && mevcutLine.delikSablon && mevcutLine.delikSablon.sablon===key) ? mevcutLine.delikSablon : null;
  dsTemplatePanels(tpl).forEach(p=>{
    const prefix = p.key ? p.key+'_' : '';
    const existing = tpl.multiPanel
      ? ((mevcutSablon && mevcutSablon.paneller && mevcutSablon.paneller[p.key]) ? mevcutSablon.paneller[p.key].olculer : {})
      : (mevcutSablon ? mevcutSablon.olculer : {});
    p.arrows.forEach(a=>{
      if(a.decorative) return; // sadece nota işaret eden ok — ölçü girişi yok
      const lbl = dsAutoLabel(a);
      const inp = document.createElement('input');
      inp.type = 'number'; inp.step = '1'; inp.placeholder = 'mm';
      inp.id = 'ds_inp_'+prefix+a.id;
      // Önce daha önce bu satıra kaydedilmiş değer, yoksa şablonun sabit varsayılanı
      // (atölyenin standart ölçüsü) gösterilir — kullanıcı isterse üzerine yazar.
      inp.value = (existing[a.id]!=null) ? existing[a.id] : (a.def!=null ? a.def : '');
      inp.style.cssText = `position:absolute; width:56px; padding:3px 4px; font-size:14px; font-weight:600; text-align:center; border:1.5px solid var(--accent); border-radius:3px; background:#fff; left:${(lbl.x-tpl.viewBox.x)/tpl.viewBox.w*100}%; top:${(lbl.y-tpl.viewBox.y)/tpl.viewBox.h*100}%; transform:translate(-50%,-50%);`;
      wrap.appendChild(inp);
    });
    // "BURAYA CAM ÖLÇÜSÜ" (kural 5.1): giriş kutusu yok, satırın kendi Boy (h)
    // alanından salt-okunur gösteriliyor.
    if(p.camOlcuArrow){
      const lbl = dsAutoLabel({type:'single', x1:p.camOlcuArrow.x1, y1:p.camOlcuArrow.y1, x2:p.camOlcuArrow.x2, y2:p.camOlcuArrow.y2});
      const disp = document.createElement('div');
      const hVal = (mevcutLine && mevcutLine.h) ? mevcutLine.h+' mm' : '(Boy girilmedi)';
      disp.textContent = hVal;
      disp.style.cssText = `position:absolute; font-size:13px; font-weight:700; color:var(--text-dim); background:var(--surface-2); border:1px dashed var(--border); border-radius:3px; padding:3px 6px; left:${(lbl.x-tpl.viewBox.x)/tpl.viewBox.w*100}%; top:${(lbl.y-tpl.viewBox.y)/tpl.viewBox.h*100}%; transform:translate(-50%,-50%); white-space:nowrap;`;
      wrap.appendChild(disp);
    }
  });
}

// ====================================================================
// EXCEL EXPORT ENJEKSİYONU — ExcelJS 4.4.0 shape (dikdörtgen/oval/ok) çizmiyor,
// bu yüzden workbook üretildikten sonra .xlsx (zip) açılıp içine gerçek
// xdr:sp / xdr:cxnSp XML'i elle eklenip yeniden paketleniyor.
// Koordinat birimi: nokta. EMU = nokta × 12700 (VBA.xlsx'ten doğrulandı).
// ====================================================================
const EMU_PER_PT = 12700;
const DS_DEFAULT_ROW_PT = 15; // proje genelinde varsayılan satır yüksekliği (bkz. EXCEL_ROWS_PER_A4_PAGE yorumu) — sayfada özel satır yüksekliği yok
function dsEmu(pt){ return Math.round(pt*EMU_PER_PT); }
function dsXmlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// 0-indeksli satırın sayfa üzerindeki mutlak Y'si (EMU) — absoluteAnchor için.
function dsRowTopEmu(row){ return Math.round(row * DS_DEFAULT_ROW_PT * EMU_PER_PT); }

// Dikdörtgen/oval (dolgulu, çerçeveli) — VBA CizCam/CizDelik karşılığı.
// xEmu/yEmu: sayfanın mutlak sol-üstüne göre gerçek EMU konumu (a:off'un GERÇEK
// değeri olmalı — VBA.xlsx'ten çıkarılan gerçek örnekte a:off hep gerçek konumu
// taşıyordu, "0,0" değil; bunu atlayınca şekiller yanlış yerde toplanıyordu).
function dsOoxmlShape(id, name, xEmu, yEmu, cx, cy, prst, fillHex, lineHex, lineWEmu){
  return `<xdr:absoluteAnchor><xdr:pos x="${xEmu}" y="${yEmu}"/><xdr:ext cx="${cx}" cy="${cy}"/><xdr:sp macro="" textlink=""><xdr:nvSpPr><xdr:cNvPr id="${id}" name="${dsXmlEsc(name)}"/><xdr:cNvSpPr/></xdr:nvSpPr><xdr:spPr><a:xfrm><a:off x="${xEmu}" y="${yEmu}"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="${prst}"><a:avLst/></a:prstGeom><a:solidFill><a:srgbClr val="${fillHex}"/></a:solidFill><a:ln w="${lineWEmu}"><a:solidFill><a:srgbClr val="${lineHex}"/></a:solidFill></a:ln></xdr:spPr><xdr:txBody><a:bodyPr/><a:lstStyle/><a:p><a:endParaRPr lang="tr-TR"/></a:p></xdr:txBody></xdr:sp><xdr:clientData/></xdr:absoluteAnchor>`;
}
// Ok/çift ok (bağlayıcı çizgi) — VBA CizOk/CizCiftYonuOk karşılığı.
function dsOoxmlConnector(id, name, x1Emu, y1Emu, x2Emu, y2Emu, doubleHeaded){
  const xEmu=Math.min(x1Emu,x2Emu), yEmu=Math.min(y1Emu,y2Emu), cx=Math.abs(x2Emu-x1Emu), cy=Math.abs(y2Emu-y1Emu);
  const flipH = x1Emu>x2Emu, flipV = y1Emu>y2Emu;
  const flipAttr = (flipH?' flipH="1"':'') + (flipV?' flipV="1"':'');
  const lineEnds = doubleHeaded ? `<a:headEnd type="triangle"/><a:tailEnd type="triangle"/>` : `<a:tailEnd type="triangle" w="med" len="med"/>`;
  return `<xdr:absoluteAnchor><xdr:pos x="${xEmu}" y="${yEmu}"/><xdr:ext cx="${cx}" cy="${cy}"/><xdr:cxnSp macro=""><xdr:nvCxnSpPr><xdr:cNvPr id="${id}" name="${dsXmlEsc(name)}"/><xdr:cNvCxnSpPr/></xdr:nvCxnSpPr><xdr:spPr><a:xfrm${flipAttr}><a:off x="${xEmu}" y="${yEmu}"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="line"><a:avLst/></a:prstGeom><a:ln w="12700"><a:solidFill><a:srgbClr val="000000"/></a:solidFill>${lineEnds}</a:ln></xdr:spPr></xdr:cxnSp><xdr:clientData/></xdr:absoluteAnchor>`;
}
// Metin kutusu (çerçevesiz/dolgusuz) — VBA CizMetinKutusu karşılığı. Ok etiketleri de bunu kullanır.
function dsOoxmlTextbox(id, name, xEmu, yEmu, cx, cy, text, opts){
  opts = opts||{};
  const align = opts.align||'l', bold = opts.bold?'1':'0', sz = opts.sz||900;
  const paras = String(text).split('\n').map(line=>
    `<a:p><a:pPr algn="${align}"/><a:r><a:rPr lang="tr-TR" sz="${sz}" b="${bold}"><a:solidFill><a:srgbClr val="000000"/></a:solidFill><a:latin typeface="Segoe UI"/></a:rPr><a:t>${dsXmlEsc(line)}</a:t></a:r></a:p>`
  ).join('');
  return `<xdr:absoluteAnchor><xdr:pos x="${xEmu}" y="${yEmu}"/><xdr:ext cx="${cx}" cy="${cy}"/><xdr:sp macro="" textlink=""><xdr:nvSpPr><xdr:cNvPr id="${id}" name="${dsXmlEsc(name)}"/><xdr:cNvSpPr txBox="1"/></xdr:nvSpPr><xdr:spPr><a:xfrm><a:off x="${xEmu}" y="${yEmu}"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/><a:ln><a:noFill/></a:ln></xdr:spPr><xdr:txBody><a:bodyPr wrap="none" vertOverflow="clip" horzOverflow="clip" anchor="t"/><a:lstStyle/>${paras}</xdr:txBody></xdr:sp><xdr:clientData/></xdr:absoluteAnchor>`;
}

// Bir (şablon + girilen ölçüler) çiftinin, verilen satıra (0-indeksli) ankraj olacak
// tüm şekillerinin XML'ini üretir. Şeklin geometrisi tpl'den birebir gelir, DEĞİŞMEZ —
// olculer sadece etiket metni olarak eklenir. row'un mutlak Y'si (EMU) burada bir kere
// hesaplanıp tüm alt şekillere eklenir (absoluteAnchor => col/row sınırı yok, X de dahil
// sayfanın mutlak sol-üstüne göre).
function dsBuildAnchorXML(tpl, delikSablonData, row, idStart, lineH){
  let id = idStart, out = '';
  const baseY = dsRowTopEmu(row);
  const X = pt => dsEmu(pt);
  const Y = pt => baseY + dsEmu(pt);
  dsTemplatePanels(tpl).forEach(p=>{
    const olculer = tpl.multiPanel
      ? (((delikSablonData.paneller||{})[p.key]||{}).olculer || {})
      : (delikSablonData.olculer || {});
    out += dsOoxmlShape(id++, 'Cam', X(p.glass.x), Y(p.glass.y), dsEmu(p.glass.w), dsEmu(p.glass.h), 'rect', 'F5F7FA', '000000', 19050);
    p.holes.forEach((h,i)=>{ out += dsOoxmlShape(id++, 'Delik '+(i+1), X(h.x), Y(h.y), dsEmu(h.w), dsEmu(h.h), 'ellipse', 'FFFFFF', '000000', 12700); });
    p.arrows.forEach(a=>{
      // decorative=true ok her zaman çizilir (VBA'daki gibi geometri sabit), ama
      // ölçü girişi olmadığı için olculer[a.id] hiç set edilmez → etiket kutusu eklenmez.
      if(a.type==='single'){
        out += dsOoxmlConnector(id++, 'Ok', X(a.x1), Y(a.y1), X(a.x2), Y(a.y2), false);
      } else {
        out += dsOoxmlConnector(id++, 'Cift Ok', X(a.x), Y(a.y1), X(a.x), Y(a.y2), true);
      }
      const v = olculer[a.id];
      if(v!=null && v!==''){
        const lbl = dsAutoLabel(a);
        out += dsOoxmlTextbox(id++, 'Olcu '+a.id, X(lbl.x-27), Y(lbl.y-8), dsEmu(54), dsEmu(18), v+' mm', {sz:1200, bold:true, align:'ctr'});
      }
    });
    // "BURAYA CAM ÖLÇÜSÜ" — kural 5.1: kullanıcı girişi değil, satırın kendi Boy (h) alanı.
    if(p.camOlcuArrow){
      const a = p.camOlcuArrow;
      out += dsOoxmlConnector(id++, 'Ok', X(a.x1), Y(a.y1), X(a.x2), Y(a.y2), false);
      if(lineH){
        const lbl = dsAutoLabel({type:'single', x1:a.x1, y1:a.y1, x2:a.x2, y2:a.y2});
        out += dsOoxmlTextbox(id++, 'Cam Olcusu', X(lbl.x-35), Y(lbl.y-8), dsEmu(80), dsEmu(18), lineH+' mm', {sz:1200, bold:true, align:'ctr'});
      }
    }
    if(p.note) out += dsOoxmlTextbox(id++, 'Not', X(p.noteX), Y(p.noteY), dsEmu(220), dsEmu(34), p.note, {sz:900});
  });
  return {xml: out, nextId: id};
}

// wb.xlsx.writeBuffer() ile üretilmiş ham buffer'ı JSZip ile açıp, sayfanın
// drawing XML'ine delikSablon şekillerini ekleyip yeniden paketler.
async function injectDelikSablonShapes(buf, anchors){
  if(!anchors || !anchors.length) return buf;
  const zip = await JSZip.loadAsync(buf);
  const relsFile = zip.file('xl/worksheets/_rels/sheet1.xml.rels');
  if(!relsFile){ console.warn('[delikSablon] sheet1.xml.rels bulunamadı, şekiller eklenemedi.'); return buf; }
  const relsXml = await relsFile.async('string');
  const relMatch = relsXml.match(/<Relationship[^>]*Type="[^"]*\/drawing"[^>]*Target="([^"]+)"[^>]*\/>/)
                 || relsXml.match(/<Relationship[^>]*Target="([^"]+)"[^>]*Type="[^"]*\/drawing"[^>]*\/>/);
  if(!relMatch){ console.warn('[delikSablon] drawing ilişkisi bulunamadı, şekiller eklenemedi.'); return buf; }
  const drawingPath = 'xl/drawings/' + relMatch[1].split('/').pop();
  const drawingFile = zip.file(drawingPath);
  if(!drawingFile){ console.warn('[delikSablon] drawing dosyası bulunamadı: '+drawingPath); return buf; }
  let drawingXml = await drawingFile.async('string');

  let maxId = 0;
  (drawingXml.match(/id="(\d+)"/g)||[]).forEach(s=>{ const n=parseInt(s.match(/\d+/)[0]); if(n>maxId) maxId=n; });
  let nextId = maxId + 1;

  let injectXml = '';
  anchors.forEach(a=>{
    const tpl = DELIK_SABLON_TANIMLARI[a.delikSablon && a.delikSablon.sablon];
    if(!tpl) return;
    const built = dsBuildAnchorXML(tpl, a.delikSablon, a.row, nextId, a.h);
    injectXml += built.xml;
    nextId = built.nextId;
  });
  if(!injectXml) return buf;

  drawingXml = drawingXml.replace('</xdr:wsDr>', injectXml + '</xdr:wsDr>');
  zip.file(drawingPath, drawingXml);
  return await zip.generateAsync({type:'arraybuffer'});
}

// Excel'e gömülecek delik/menfez diyagramını bir <canvas>'a çizip PNG base64 döndürür.
// Şablonla birebir aynı mantık: dikdörtgen (cam) + delik (daire) + üstten/soldan
// mesafeyi gösteren, üzerinde gerçek mm değeri yazan iki ölçü oku.
// Menfez yönü seçilmişse (dirs), o kenar(lar)a ayrıca kısa kırmızı ok çizilir (ayrı bilgi).
function renderDelikPngBase64(line, size){
  size = size || 220;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const padTop = 34, padLeft = 44, padRight = 44, padBottom = 16;
  const availW = size - padLeft - padRight, availH = size - padTop - padBottom;
  const w = parseFloat(line.w) || 1000, h = parseFloat(line.h) || 1000;
  const ratio = w/h;
  let rw, rh;
  if(ratio > availW/availH){ rw = availW; rh = availW/ratio; } else { rh = availH; rw = availH*ratio; }
  const x0 = padLeft + (availW-rw)/2, y0 = padTop + (availH-rh)/2, x1 = x0+rw, y1 = y0+rh;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);
  ctx.strokeStyle = '#333333'; ctx.lineWidth = 1.5;
  ctx.strokeRect(x0,y0,rw,rh);
  ctx.font = '11px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  (line.dm||[]).forEach(p=>{
    const px = x0+p.x*rw, py = y0+p.y*rh;
    const side = p.side || 'sol';
    // Gerçek mm mesafesi: kayıtlıysa doğrudan kullan, eski kayıtlarda yoksa oran üzerinden geri hesapla.
    const ustMm = (p.ust!=null && !isNaN(p.ust)) ? Math.round(p.ust) : Math.round(p.y*h);
    const yatayMm = (p.yatay!=null && !isNaN(p.yatay)) ? Math.round(p.yatay) : (p.sol!=null && !isNaN(p.sol)) ? Math.round(p.sol) : Math.round((side==='sag' ? (1-p.x) : p.x)*w);

    // --- Üstten ölçü oku: dikdörtgenin üst kenarından deliğe kadar, mm yazılı ---
    ctx.strokeStyle = '#1d4ed8'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(px, y0-14); ctx.lineTo(px, py); ctx.stroke();
    ctx.fillStyle = '#1d4ed8';
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px-4, py-8); ctx.lineTo(px+4, py-8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1d4ed8'; ctx.textAlign = 'center';
    ctx.fillText(ustMm+' mm', px, y0-22);

    // --- Yatay ölçü oku: hangi kenardan ölçüldüyse o kenardan deliğe kadar, mm yazılı ---
    if(side==='sag'){
      ctx.beginPath(); ctx.moveTo(x1+14, py); ctx.lineTo(px, py); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px+8, py-4); ctx.lineTo(px+8, py+4); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.translate(x1+24, py); ctx.rotate(Math.PI/2);
      ctx.fillText(yatayMm+' mm', 0, 0);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.moveTo(x0-14, py); ctx.lineTo(px, py); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px-8, py-4); ctx.lineTo(px-8, py+4); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.translate(x0-24, py); ctx.rotate(-Math.PI/2);
      ctx.fillText(yatayMm+' mm', 0, 0);
      ctx.restore();
    }

    // --- Menfez yönü (varsa) — ayrı, kısa kırmızı ok(lar) ---
    (p.dirs||[]).forEach(dir=>{
      let tx=px, ty=py;
      if(dir==='up') ty = y0-10;
      if(dir==='down') ty = y1+10;
      if(dir==='left') tx = x0-10;
      if(dir==='right') tx = x1+10;
      ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(tx,ty); ctx.stroke();
      const ang = Math.atan2(ty-py, tx-px);
      ctx.beginPath(); ctx.moveTo(tx,ty);
      ctx.lineTo(tx-7*Math.cos(ang-0.4), ty-7*Math.sin(ang-0.4));
      ctx.lineTo(tx-7*Math.cos(ang+0.4), ty-7*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fillStyle = '#dc2626'; ctx.fill();
    });

    // --- Delik (daire) ---
    ctx.beginPath(); ctx.arc(px,py,6,0,Math.PI*2);
    ctx.fillStyle = 'rgba(51,51,51,0.12)'; ctx.fill();
    ctx.strokeStyle = '#333333'; ctx.lineWidth = 1.2; ctx.stroke();
  });
  return canvas.toDataURL('image/png').split(',')[1];
}

function renderStats(){
  const el = document.getElementById('statStrip');
  if(!el) return;
  const counts = STATUSES.map((s,i)=>orders.filter(o=>o.status===i).length);
  el.innerHTML = STATUSES.map((s,i)=>`<div class="pane stat-card"><div class="stat-num">${counts[i]}</div><div class="stat-label">${s.short}</div></div>`).join('');
}

function renderFilters(){
  const el = document.getElementById('filterRow');
  if(!el) return;
  const chips = [{key:'all',label:'Tümü'}, ...STATUSES.map((s,i)=>({key:String(i),label:s.short}))];
  el.innerHTML = chips.map(c=>`<button class="filter-chip ${activeFilter===c.key?'active':''}" data-key="${c.key}">${c.label}</button>`).join('');
  el.querySelectorAll('.filter-chip').forEach(btn=>{
    btn.onclick = ()=>{ activeFilter = btn.dataset.key; renderFilters(); renderList(profile.role==='satici'); };
  });
}

// Sipariş listesinin altındaki kalınlık/kategori filtre çipleri — 4mm/8mm/Isıcam gibi
// birbirine karışmaması için, sadece o an aktif siparişlerde gerçekten var olan
// kalınlıklar gösterilir.
function renderThicknessFilters(){
  const el = document.getElementById('thicknessFilterRow');
  if(!el) return;
  const activeOrders = orders.filter(o=>o.status < DELIVERED_INDEX);
  const present = new Set(activeOrders.map(orderThicknessKey));
  if(present.size <= 1){ el.innerHTML = ''; return; }
  const order = ['4MM','5MM','6MM','8MM','ISI CAM','DİĞER'];
  const keys = [...present].sort((a,b)=>{
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia===-1?99:ia) - (ib===-1?99:ib);
  });
  const chips = [{key:'all',label:'Tümü'}, ...keys.map(k=>({key:k,label:k}))];
  el.innerHTML = chips.map(c=>`<button class="filter-chip ${thicknessFilter===c.key?'active':''}" data-key="${c.key}">${c.label}</button>`).join('');
  el.querySelectorAll('.filter-chip').forEach(btn=>{
    btn.onclick = ()=>{ thicknessFilter = btn.dataset.key; renderThicknessFilters(); renderList(true); };
  });
}

    actionsHtml = `

function renderList(isSellerView){
  const el = document.getElementById('orderList');
  if(!el) return;
  const activeOrders = orders.filter(o=>o.status < DELIVERED_INDEX);
  const deliveredOrders = orders.filter(o=>o.status === DELIVERED_INDEX);
  let list = activeOrders.slice();
  if(isSellerView && activeFilter !== 'all') list = list.filter(o=>String(o.status)===activeFilter);
  if(isSellerView && thicknessFilter !== 'all') list = list.filter(o=>orderThicknessKey(o)===thicknessFilter);
  renderThicknessFilters();
  if(isSellerView && searchQuery.trim()){
    const q = searchQuery.trim().toLocaleLowerCase('tr');
    list = list.filter(o=> `${o.bayi_adi||''} ${o.cust_name||''}`.toLocaleLowerCase('tr').includes(q));
  }

  el.innerHTML = list.length===0
    ? `<div class="pane empty-state"><div class="section-eyebrow">Kayıt yok</div><div style="font-size:13px;">Henüz aktif sipariş bulunmuyor.</div></div>`
    : list.map(o=>orderCardHtml(o, isSellerView, false)).join('');

  el.querySelectorAll('.editBtn').forEach(b=>{
    b.onclick = ()=>{
      const o = orders.find(x=>String(x.id)===b.dataset.id);
      if(o) openEditOrder(o, isSellerView);
    };
  });
  el.querySelectorAll('.deleteBtn').forEach(b=>{
    b.onclick = async ()=>{
      const o = orders.find(x=>String(x.id)===b.dataset.id);
      if(!o) return;
      if(!confirm(`#${o.id} numaralı siparişi silmek istediğine emin misin? Silinenler'den geri alabilirsin.`)) return;
      const {data, error} = await sb.from('orders').update({deleted_at: new Date().toISOString()}).eq('id', o.id).select();
      if(sbCheckRow(data, error, 'Sipariş silinemedi.')) return;
      if(isSellerView){ await loadOrdersForSeller(); } else { await loadOrdersForCustomer(); }
      renderStats(); renderFilters(); renderList(isSellerView);
    };
  });

  el.querySelectorAll('.orderBulkDelCheck').forEach(c=>{
    c.onchange = ()=>{
      if(c.checked) selectedForBulkDelete.add(c.dataset.id);
      else selectedForBulkDelete.delete(c.dataset.id);
      updateBulkDeleteBar();
    };
  });
  updateBulkDeleteBar();

  if(isSellerView){
    el.querySelectorAll('.excelBtn').forEach(b=>{
      b.onclick = ()=>{
        const o = orders.find(x=>String(x.id)===b.dataset.id);
        if(o) askExcelCopiesAndExport(o);
      };
    });
    el.querySelectorAll('.ascBtn').forEach(b=>{
      b.onclick = ()=>{
        const o = orders.find(x=>String(x.id)===b.dataset.id);
        if(o) exportOrderToASC(o);
      };
    });
    el.querySelectorAll('.etiketBtn').forEach(b=>{
      b.onclick = ()=>{
        const o = orders.find(x=>String(x.id)===b.dataset.id);
        if(o) printEtiketler(o);
      };
    });
    el.querySelectorAll('.nextBtn').forEach(b=>{
      b.onclick = async ()=>{
        const o = orders.find(x=>String(x.id)===b.dataset.id);
        if(o && o.status <= DELIVERED_INDEX-1){
          const {data, error} = await sb.from('orders').update({status:o.status+1}).eq('id', o.id).select();
          if(sbCheckRow(data, error, 'Sipariş durumu güncellenemedi.')) return;
          await loadOrdersForSeller(); renderStats(); renderFilters(); renderList(true);
        }
      };
    });
    el.querySelectorAll('.prevBtn').forEach(b=>{
      b.onclick = async ()=>{
        const o = orders.find(x=>String(x.id)===b.dataset.id);
        if(o && o.status > 0){
          const {data, error} = await sb.from('orders').update({status:o.status-1}).eq('id', o.id).select();
          if(sbCheckRow(data, error, 'Sipariş durumu güncellenemedi.')) return;
          await loadOrdersForSeller(); renderStats(); renderFilters(); renderList(true);
        }
      };
    });
  }

  // Teslim edilenler — ayrı arşiv bölümü
  const archEl = document.getElementById('deliveredSection');
  if(archEl){
    archEl.innerHTML = `
      <div class="list-head" style="margin-top:26px;">
        <div class="section-eyebrow" style="margin-bottom:0;">Teslim edilenler <span class="hint">(${deliveredOrders.length})</span></div>
        ${deliveredOrders.length>0 ? `<button class="btn btn-ghost btn-sm" id="toggleDeliveredBtn">${showDelivered?'Gizle':'Göster'}</button>` : ''}
      </div>
      <div id="deliveredList" style="${showDelivered?'':'display:none;'}">
        ${deliveredOrders.length===0
          ? `<div class="pane empty-state"><div style="font-size:13px;">Henüz teslim edilmiş sipariş yok.</div></div>`
          : deliveredOrders.map(o=>orderCardHtml(o, isSellerView, true)).join('')}
      </div>
    `;
    const toggleBtn = document.getElementById('toggleDeliveredBtn');
    if(toggleBtn) toggleBtn.onclick = ()=>{ showDelivered = !showDelivered; renderList(isSellerView); };
    if(isSellerView){
      archEl.querySelectorAll('.excelBtn').forEach(b=>{
        b.onclick = ()=>{
          const o = orders.find(x=>String(x.id)===b.dataset.id);
          if(o) askExcelCopiesAndExport(o);
        };
      });
      archEl.querySelectorAll('.ascBtn').forEach(b=>{
        b.onclick = ()=>{
          const o = orders.find(x=>String(x.id)===b.dataset.id);
          if(o) exportOrderToASC(o);
        };
      });
      archEl.querySelectorAll('.etiketBtn').forEach(b=>{
        b.onclick = ()=>{
          const o = orders.find(x=>String(x.id)===b.dataset.id);
          if(o) printEtiketler(o);
        };
      });
      archEl.querySelectorAll('.undoDeliverBtn').forEach(b=>{
        b.onclick = async ()=>{
          const o = orders.find(x=>String(x.id)===b.dataset.id);
          if(o){
            const {data, error} = await sb.from('orders').update({status:STATUSES.length-1}).eq('id', o.id).select();
            if(sbCheckRow(data, error, 'Sipariş durumu güncellenemedi.')) return;
            await loadOrdersForSeller(); renderStats(); renderFilters(); renderList(true);
          }
        };
      });
    }
  }
  if(isSellerView){ renderBulkEtiket(); renderBulkAsc(); }
}

function updateBulkDeleteBar(){
  const btn = document.getElementById('bulkDeleteBtn');
  const countEl = document.getElementById('bulkDeleteCount');
  if(!btn || !countEl) return;
  const n = selectedForBulkDelete.size;
  countEl.textContent = n;
  btn.style.display = n>0 ? 'inline-flex' : 'none';
}

async function handleBulkDelete(){
  const ids = [...selectedForBulkDelete];
  if(ids.length===0) return;
  if(!confirm(`${ids.length} siparişi silmek istediğine emin misin? Silinenler'den geri alabilirsin.`)) return;
  const {data, error} = await sb.from('orders').update({deleted_at: new Date().toISOString()}).in('id', ids).select();
  if(sbCheckRow(data, error, 'Siparişler silinemedi.')) return;
  selectedForBulkDelete.clear();
  await loadOrdersForSeller();
  renderStats(); renderFilters(); renderList(true);
}

    ${deletedOrders.length===0
