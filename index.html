}

/* =========================================================
   TOPLU ASC — aynı cam tipindeki (kalınlık+renk) bekleyen siparişleri
   otomatik grupla, kullanıcı isterse tek tek çıkarabilsin, sonra
   grup için TEK ASC dosyası üretilsin (Ahmet abinin Optime'a farklı
   müşterilerin aynı camını tek dosyada birleştirerek yüklemesi için)
   ========================================================= */
function ascGroupKeyForOrder(o){
  return ascCamKodu(o) || 'BELİRSİZ CAM TİPİ';
}

// Isıcam sekmesinde çıta/kalınlığa göre değil, SADECE renk kombinasyonuna göre gruplanır
// (Füme+Füme bir kutu, Şeffaf+Şeffaf bir kutu, Füme+Şeffaf bir kutu — çıta farkı önemsiz).
function ascColorGroupKeyForOrder(o){
  const m = (o.renk||'').match(/^Isıcam:\s*[\d+]+\s+(.+)$/i);
  if(!m) return ascGroupKeyForOrder(o);
  const renkler = m[1].split('+').map(r=>ascUp(r.trim()));
  renkler.sort((a,b)=>a.localeCompare(b,'tr'));
  return renkler.join('+');
}

function orderPieceCount(o){
  return (o.lines||[]).reduce((s,l)=>s+(parseInt(l.qty)||1), 0);
}

function renderBulkAsc(){
  const el = document.getElementById('bulkAscSection');
  if(!el) return;
  const isIsicamTab = bulkCamTypeTab==='isicam';
  const active = orders.filter(o=>o.status < DELIVERED_INDEX && isOrderIsicam(o)===isIsicamTab && !kesimTamamlandiMi(o));
  // Mevcut işaretleme durumunu koru — arama/filtre değişince kullanıcının elle
  // kaldırdığı tikler geri gelmesin.
  const prevChecked = {};
  el.querySelectorAll('.bulkAscCheck').forEach(c=>{ prevChecked[c.dataset.id] = c.checked; });
  const groups = {};
  active.forEach(o=>{
    const key = isIsicamTab ? ascColorGroupKeyForOrder(o) : ascGroupKeyForOrder(o);
    (groups[key] = groups[key] || []).push(o);
  });
  const keys = Object.keys(groups).sort();
  if(keys.length===0){
    el.innerHTML = `<div class="pane empty-state"><div style="font-size:13px;">Birleştirilecek bekleyen sipariş yok.</div></div>`;
    return;
  }
  el.innerHTML = keys.map(key=>{
    const grp = groups[key];
    const totalPieces = grp.reduce((s,o)=>s+orderPieceCount(o), 0);
    return `
    <div class="pane form-card bulk-asc-group" style="margin-bottom:14px;">
      <div class="bulk-asc-head">
        <b>${key}</b>
        <span class="hint">${grp.length} sipariş · ${totalPieces} parça</span>
        <button class="btn btn-primary btn-sm bulkAscDownload" data-key="${encodeURIComponent(key)}">ASC olarak indir</button>
      </div>
      <div class="bulk-asc-list">
        ${grp.map(o=>`
          <label class="bulk-asc-item">
            <input type="checkbox" class="bulkAscCheck" data-key="${encodeURIComponent(key)}" data-id="${o.id}" ${prevChecked[o.id]===false ? '' : 'checked'}>
            <span>#${o.id} · ${o.bayi_adi||''}${o.cust_name && o.cust_name!==o.bayi_adi ? ' · 👤 '+o.cust_name : ''}${o.cust_address?' · 📍'+o.cust_address:''} · ${orderPieceCount(o)} parça</span>
          </label>`).join('')}
      </div>
    </div>`;
  }).join('') + (isIsicamTab ? `
    <div class="form-actions" style="margin-top:4px;">
      <button class="btn btn-primary btn-sm" id="bulkAscAyirBtn">🔀 Ayır ve renklere göre indir</button>
      <span class="hint">Yukarıda işaretli siparişlerin dış/iç camlarını ayırıp renklerine göre (Füme, Şeffaf, vb.) ayrı ASC dosyaları indirir. Aynı renkli çift cam (örn. Füme+Füme) adet ×2 yazılır.</span>
    </div>
  ` : '');
  el.querySelectorAll('.bulkAscDownload').forEach(b=>{
    b.onclick = ()=>{
      const key = decodeURIComponent(b.dataset.key);
      const checks = el.querySelectorAll(`.bulkAscCheck[data-key="${b.dataset.key}"]`);
      const ids = Array.from(checks).filter(c=>c.checked).map(c=>c.dataset.id);
      if(ids.length===0){ alert('En az bir sipariş seçili olmalı.'); return; }
      const selOrders = orders.filter(o=>ids.includes(String(o.id)));
      exportOrdersToBulkASC(selOrders, key);
    };
  });
  const ayirBtn = document.getElementById('bulkAscAyirBtn');
  if(ayirBtn){
    ayirBtn.onclick = ()=>{
      const ids = Array.from(el.querySelectorAll('.bulkAscCheck:checked')).map(c=>c.dataset.id);
      const uniqueIds = [...new Set(ids)];
      if(uniqueIds.length===0){ alert('En az bir sipariş seçili olmalı.'); return; }
      const selOrders = orders.filter(o=>uniqueIds.includes(String(o.id)));
      exportIsicamSplitByColor(selOrders);
    };
  }
}

// Isıcam siparişleri dış/iç camlarına ayırıp renklerine göre gruplar. Aynı renk kombinasyonunda
// (örn. Füme+Füme) her iki cam da aynı renge gittiği için adet ×2 yazılır; karışık renkte
// (örn. Füme+Şeffaf) her cam kendi renk grubuna adet ×1 olarak gider.
function splitIsicamOrdersByColor(selOrders){
  const colorGroups = {}; // { 'FÜME': Map(key -> {w,h,qty,not1,camKodu,compMatCode,custCode,firma,kisi,girisTarihi,teslimTarihi}) }
  selOrders.forEach(o=>{
    const isicamMatch = (o.renk||'').match(/^Isıcam:\s*([\d+]+)\s+(.+)$/i);
    if(!isicamMatch) return;
    const yapi = isicamMatch[1].split('+');
    const renkler = isicamMatch[2].split('+');
    const t1 = yapi[0]||'', t2 = yapi[2]||yapi[0]||'';
    const r1 = ascUp(renkler[0]||''), r2 = ascUp(renkler[1]||renkler[0]||'');
    const sameColor = r1 === r2;
    const firma = o.bayi_adi||'', kisi = o.cust_name||'';
    const custCode = (o.asc_customer_code && o.asc_customer_code.trim()) ? ascUp(o.asc_customer_code.trim()) : ascCustCode(firma, kisi);
    const girisTarihi = ascDDMMYYYY(o.created_at ? o.created_at.slice(0,10) : null);
    const teslimTarihi = ascDDMMYYYY(o.due);
    (o.lines||[]).forEach(l=>{
      const qty = parseInt(l.qty)||1;
      const not1 = ascNotesKisalt(l.note);
      const addPane = (renk, kalinlik, mult)=>{
        const camKoduPane = `${kalinlik}MM${renk}`.slice(0,17);
        const compMatPane = `${kalinlik}MM${renk}`;
        if(!colorGroups[renk]) colorGroups[renk] = new Map();
        const map = colorGroups[renk];
        const key = `${l.w}|${l.h}|${not1}|${kalinlik}|${custCode}|${firma}|${kisi}`;
        if(map.has(key)) map.get(key).qty += qty*mult;
        else map.set(key, {w:l.w, h:l.h, qty: qty*mult, not1, camKodu:camKoduPane, compMatCode:compMatPane, custCode, firma, kisi, girisTarihi, teslimTarihi});
      };
      if(sameColor) addPane(r1, t1, 2);
      else { addPane(r1, t1, 1); addPane(r2, t2, 1); }
    });
  });
  return colorGroups;
}

function exportIsicamSplitByColor(selOrders){
  const colorGroups = splitIsicamOrdersByColor(selOrders);
  const colors = Object.keys(colorGroups);
  if(colors.length===0){ alert('Seçili siparişlerde Isıcam verisi bulunamadı.'); return; }
  const girisTarihiHeader = ascDDMMYYYY(null);
  colors.forEach(renk=>{
    const pieces = [...colorGroups[renk].values()];
    const rows = pieces.map((p,i)=>ascBuildRow(i+1, p.camKodu, p.custCode, p.w, p.h, p.qty, '', p.not1, p.firma, p.kisi, p.girisTarihi, p.teslimTarihi, p.compMatCode));
    downloadASCText(rows, renk, girisTarihiHeader, renk);
  });
}

async function exportOrdersToBulkASC(selOrders, camKey){
  let startNo = 1;
  let allRows = [];
  selOrders.forEach(o=>{
    const r = ascRowsForOrder(o, startNo);
    allRows = allRows.concat(r);
    startNo += r.length;
  });
  const girisTarihi = ascDDMMYYYY(null); // bugünün tarihi (birleştirme anı)
  downloadASCText(allRows, camKey, girisTarihi, 'TOPLU');
}

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error((label||'İşlem') + ' zaman aşımına uğradı (' + ms/1000 + 's).')), ms))
  ]);
}

// Formlarda (müşteri adı, tarih vb. text/number/date input'ları) Enter'a basınca
// sayfa yenilenmesin, bunun yerine bir sonraki alana otomatik geçilsin —
// mouse ile tıklamaya gerek kalmadan klavyeyle hızlıca ilerlenebilsin diye.
// Tek yerden, tüm sayfa/formlar için delegasyonla çalışıyor (her render'da tekrar bağlamaya gerek yok).
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  const el = e.target;
  if(!(el instanceof HTMLElement)) return;
  const tag = el.tagName;
  if(tag === 'TEXTAREA') return; // not alanları çok satırlı, Enter kendi işini yapsın
  if(tag === 'BUTTON') return;   // butonlar zaten Enter ile tetiklenir, karışmayalım
  if(tag !== 'INPUT' && tag !== 'SELECT') return;
  if(['file','checkbox','radio','button','submit'].includes(el.type)) return;
  const container = el.closest('.form-card') || el.closest('.pane') || document.body;
  const focusable = Array.from(container.querySelectorAll('input, select, button'))
    .filter(x=> !x.disabled && x.type!=='file' && x.offsetParent !== null);
  const idx = focusable.indexOf(el);
  if(idx === -1) return;
  e.preventDefault(); // Enter'ın forma submit/reload ettirmesini her durumda engelle
  const next = focusable[idx+1];
  if(next){
    next.focus();
    if(typeof next.select === 'function' && (next.tagName==='INPUT')) next.select();
  }
});
